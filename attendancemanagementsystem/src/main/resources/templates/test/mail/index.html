<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>完全隔離メールテスト</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; border: 1px solid #ccc; padding: 20px; border-radius: 8px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background-color: #28a745; color: white; padding: 10px 20px; border: none; cursor: pointer; }
        .alert-success { color: #155724; background-color: #d4edda; padding: 10px; margin-bottom: 20px; }
        .alert-danger { color: #721c24; background-color: #f8d7da; padding: 10px; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h2>📩 メール送信テスト（テスト環境）</h2>
    <p>既存システムとは関係なく、指定した宛先にメールを送ります。</p>

    <div th:if="${successMessage}" class="alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert-danger" th:text="${errorMessage}"></div>

    <form th:action="@{/test/mail/send}" method="post">
        <div class="form-group">
            <label>宛先 (To):</label>
            <input type="email" name="to" placeholder="example@gmail.com" required>
        </div>

        <div class="form-group">
            <label>件名 (Subject):</label>
            <input type="text" name="subject" value="テスト送信" required>
        </div>

        <div class="form-group">
            <label>本文 (Body):</label>
            <textarea name="body" rows="5" required>これはテスト環境からの送信テストです。</textarea>
        </div>

        <button type="submit">送信する</button>
    </form>
</div>

</body>
</html>
