<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>送信者ID 確認テスト</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

    <h2 class="mb-4">🕵️ 送信者ID(SenderUserID) の確認</h2>

    <div class="alert alert-info">
        <strong>ポイント:</strong> 受信者を <b>ID: 1 以外</b> (例: 2) にすると違いがより明確になります。
    </div>

    <div class="row mb-5">
        <div class="col-md-6">
            <div class="card border-primary">
                <div class="card-header bg-primary text-white">① OTP通知 (自分から)</div>
                <div class="card-body">
                    <p class="small text-muted">送信者 = 受信者 (SELF) になるはず</p>
                    <form th:action="@{/test/sender/otp}" method="post" class="d-flex">
                        <input type="number" name="userId" class="form-control me-2" value="2" placeholder="UserID">
                        <button type="submit" class="btn btn-primary">送信</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card border-danger">
                <div class="card-header bg-danger text-white">② 欠席アラート (システムから)</div>
                <div class="card-body">
                    <p class="small text-muted">送信者 = 1 (SYSTEM) 固定になるはず</p>
                    <form th:action="@{/test/sender/risk}" method="post" class="d-flex">
                        <input type="number" name="userId" class="form-control me-2" value="2" placeholder="UserID">
                        <button type="submit" class="btn btn-danger">送信</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <h3>📂 DB保存結果</h3>
    <table class="table table-bordered align-middle">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Type</th>
                <th>Message</th>
                <th>Sender (送信者)</th> <th>Receiver (受信者)</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="n : ${notifications}">
                <td th:text="${n.notificationId}"></td>
                <td>
                    <span th:if="${n.notificationTypeId == 1}" class="badge bg-secondary">OTP</span>
                    <span th:if="${n.notificationTypeId == 3}" class="badge bg-danger">Risk</span>
                </td>
                <td th:text="${#strings.abbreviate(n.message, 20)}"></td>
                
                <td class="fs-5">
                    <span class="fw-bold me-2" th:text="${n.senderUserId}"></span>

                    <span th:if="${n.senderUserId == 1}" class="badge bg-danger">SYSTEM</span>

                    <span th:if="${n.senderUserId == n.receiverUserId}" class="badge bg-primary">SELF</span>
                </td>

                <td class="fs-5 fw-bold" th:text="${n.receiverUserId}"></td>
            </tr>
        </tbody>
    </table>
    
    <div class="text-end mt-3">
        <a href="/test/sender" class="btn btn-secondary btn-sm">再読み込み</a>
    </div>

</body>
</html>
