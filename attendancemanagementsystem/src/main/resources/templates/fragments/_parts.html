<!-- 前画面に戻るだけ -->
<div th:fragment="historyBackButton">
    <button type="button" 
            onclick="history.back()" 
            class="backbutton">戻る
    </button>
</div>

<!-- 遷移先URLを保持して戻る -->
<div th:fragment="backButton(url)">
    <button type="button" 
            th:onclick="'location.href=\'' + @{${url}} + '\''" 
             class="backbutton">戻る
    </button>
</div>


<!-- 画面ができ次第ヘッダーのリンクを追加する -->
