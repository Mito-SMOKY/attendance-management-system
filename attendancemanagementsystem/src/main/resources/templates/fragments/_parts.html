<link rel="stylesheet" th:href="@{/css/parts.css}" />

<div th:fragment="historyBackButton">
  <button type="button" onclick="history.back()" class="backbutton">
    戻る
  </button>
</div>

<div th:fragment="backButton(url)">
  <button
    type="button"
    th:onclick="'location.href=\'' + @{${url}} + '\''"
    class="backbutton"
  >
    戻る
  </button>
</div>

<div th:fragment="main-header">
  <header class="main-header"></header>
</div>

<div th:fragment="student-header">
  <header class="main-header-student">
    <div class="header-left">
      <span sec:authentication="principal.usersEntity.name">ユーザー名</span>さん
    </div>
    <nav class="header-nav">
      <ul>
        <li><a th:href="@{/student/main_calendar}">日付</a></li>
        <li><a th:href="@{/student/subject-list}">教科</a></li>
        <li><a th:href="@{/student/request_main}">申請</a></li>
      </ul>
      <form th:action="@{/logout}" method="post" style="display:inline;">
        <button type="submit">ログアウト</button>
      </form>
    </nav>
    <div class="header-right">
      <a th:href="@{/profile}" class="icon-link">
        <i class="fas fa-user"></i>
      </a>
      <a href="#" class="icon-link notification">
        <i class="fas fa-bell"></i>
        <span class="notification-dot"></span>
      </a>
    </div>
  </header>
</div>

<div th:fragment="admin-header">
  <header class="main-header-admin">
    <div class="header-left">
      <span sec:authentication="principal.usersEntity.name">ユーザー名</span>さん
    </div>
    <nav class="header-nav">
      <ul>
        <li><a th:href="@{/admin/timetable}">日付</a></li>
        <li><a href="#">教科</a></li>
        <li><a href="#">生徒</a></li>
        <li class="dropdown">
          <a href="#" class="dropdown-toggle">その他 ▼</a>
          <div class="dropdown-menu">
            <a th:href="@{/admin/tmpAccount}">仮アカウント管理</a>
            <a th:href="@{/admin/master-data}">マスタデータ管理</a>
            <form th:action="@{/logout}" method="post" style="display:inline;">
              <button type="submit">ログアウト</button>
            </form>
          </div>
        </li>
      </ul>
    </nav>
    <div class="header-right">
      <a th:href="@{/profile}" class="icon-link">
        <i class="fas fa-user"></i>
      </a>
      <a href="#" class="icon-link notification">
        <i class="fas fa-bell"></i>
      </a>
    </div>
  </header>
</div>
