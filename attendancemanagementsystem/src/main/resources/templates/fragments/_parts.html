<div th:fragment="historyBackButton">
  <button type="button" onclick="history.back()" class="backbutton">
    戻る
  </button>
</div>

<div th:fragment="backButton(url)">
  <button
    type="button"
    th:onclick="'location.href=\'' + @{${url}} + '\''"
    class="backbutton"
  >
    戻る
  </button>
</div>

<div th:fragment="main-header">

</div>

<!-- パスワードの表示切替ボタン -->
 <!-- 以下コピペ用 -->
 <!-- <div th:replace="~{fragments/_parts :: passwordToggle('ここにパスワード入力欄のidを記入')}"></div> -->
  
<th:block th:fragment="passwordToggle(inputId)">
    <i class="fa-solid fa-eye-slash toggle-password" 
      th:id="${'toggle-' + inputId}" 
      style="cursor: pointer;"></i>

    <script th:inline="javascript">
        (function() {
            // Thymeleafから渡されたinputIdを取得
            const inputId = /*[[${inputId}]]*/ '';
            const toggleIcon = document.getElementById('toggle-' + inputId);
            const passwordInput = document.getElementById(inputId);

            if (toggleIcon && passwordInput) {
                toggleIcon.addEventListener("click", function () {
                    // type属性を切り替える
                    const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
                    passwordInput.setAttribute("type", type);

                    // アイコンを切り替える
                    this.classList.toggle("fa-eye");
                    this.classList.toggle("fa-eye-slash");
                });
            }
        })();
    </script>
</th:block>
