<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メールアドレス変更 - 本人確認</title>
    
    <link rel="stylesheet" th:href="@{/css/parts.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/login/loginEmailAuth.css}">
</head>
<body>
    
    <div class="header-container">
        <div th:if="${#authorization.expr('hasRole(''STUDENT'')')}">
            <div th:replace="~{fragments/_parts :: student-header}"></div>
        </div>
        <div th:if="${#authorization.expr('hasRole(''ADMIN'')')}">
            <div th:replace="~{fragments/_parts :: admin-header}"></div>
        </div>
        <div th:if="${#authorization.expr('hasRole(''SUPER_ADMIN'')')}">
            <div th:replace="~{fragments/_parts :: superadmin-header}">
        </div>
    </div>

    <div class="container" style="margin-top: 70px;">
        
        <div class="backbutton-container">
            <div th:replace="~{fragments/_parts :: backButton(url='/profile')}"></div>
        </div>
        <h2 class="main-title">本人確認</h2>
        
        <p class="description">
            メールアドレスを変更するために、<br>ログインIDとパスワードを入力してください。
        </p>

        <div id="jsErrorMsg" class="js-error-msg"></div>

        <form th:action="@{/profile/security/email/auth}" method="post" class="form-content" id="authForm">
            
            <div class="form-group">
                <label class="label" for="loginId">ログインID</label>
                <input type="text" id="loginId" name="loginId" class="input-text" 
                    placeholder="ユーザーID" required>
            </div>

            <div class="form-group">
                <label class="label" for="password">現在のパスワード</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" class="input-text" 
                        placeholder="パスワード" required minlength="8" maxlength="24">
                    <i class="fa-solid fa-eye-slash toggle-password" id="togglePassword"></i>
                </div>
                
                <p th:if="${error}" th:text="${error}" class="error-msg"></p>
            </div>

            <button type="submit" id="submitBtn" class="submit-btn">次へ進む</button>
        </form>
    </div>

    <script th:src="@{/js/login_EmailAuth.js}"></script>
</body>
</html>
