<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お知らせ詳細</title>
    
    <link rel="stylesheet" th:href="@{/css/parts.css}">
    <link rel="stylesheet" th:href="@{/css/common/notificationDetail.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

    <div class="header-container">
        <div th:if="${#authorization.expr('hasRole(''STUDENT'')')}">
            <div th:replace="~{fragments/_parts :: student-header}"></div>
        </div>
        <div th:if="${#authorization.expr('hasRole(''ADMIN'')')}">
            <div th:replace="~{fragments/_parts :: admin-header}"></div>
        </div>
        <div th:if="${#authorization.expr('hasRole(''SUPER_ADMIN'')')}">
            <div th:replace="~{fragments/_parts :: superadmin-header}"></div>
    </div>

    <div class="container">
        <div class="detail-container">
            
            <div class="detail-header">
                <div class="detail-date">
                    <i class="fa-regular fa-clock"></i>
                    <span th:text="${#temporals.format(notification.createdAt, 'yyyy/MM/dd HH:mm')}"></span>
                </div>
                <h1 class="detail-title" th:text="${title}">
                    <!-- 件名 -->
                </h1>

            </div>

            <p class="display-name-value" id="display-value"></p>
            <div class="detail-body" th:text="${notification.message}">
                
                <!-- 本文 -->
            </div>

            <a th:href="@{/notifications}" class="back-btn">
                <i class="fa-solid fa-arrow-left"></i> 一覧に戻る
            </a>

        </div>
    </div>

</body>
</html>
