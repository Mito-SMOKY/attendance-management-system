<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワード変更 - 新しいパスワード</title>
    <link rel="stylesheet" th:href="@{/css/parts.css}">
    <style>
        body { font-family: "Yu Gothic", sans-serif; color: #333; margin: 0; }
        .header-bar { background-color: #6CC0C8; height: 60px; width: 100%; }
        .container { max-width: 600px; margin: 0 auto; padding: 40px 20px; text-align: center; }
        .main-title { font-size: 20px; margin-top: 60px; margin-bottom: 40px; }
        .input-group { margin-bottom: 20px; text-align: left; display: inline-block; }
        .input-label { display: block; font-weight: bold; margin-bottom: 5px; }
        .input-field { width: 300px; padding: 10px; font-size: 16px; border: 1px solid #999; border-radius: 5px; }
        .error-msg { color: red; margin-bottom: 15px; font-size: 14px; }
        .submit-btn { background-color: #6CC0C8; color: white; border: none; padding: 12px 40px; font-size: 16px; border-radius: 5px; cursor: pointer; margin-top: 20px;}
    </style>
</head>
<body>
    <div class="header-container">

        <div th:if="${#authorization.expr('hasRole(''STUDENT'')')}">
            <div th:replace="~{fragments/_parts :: student-header}"></div>
        </div>
        <div th:if="${#authorization.expr('hasRole(''ADMIN'')')}">
            <div th:replace="~{fragments/_parts :: admin-header}"></div>
        </div>

        <div th:if="${#authorization.expr('hasRole(''SUPER_ADMIN'')')}">
            <div th:replace="~{fragments/_parts :: admin-header}"></div>
        </div>
    </div>
    <div class="container">
        <h2 class="main-title">新しいパスワードを設定してください</h2>

        <div th:if="${error}">
            <p class="error-msg" th:text="${error}"></p>
        </div>

        <form th:action="@{/profile/security/password/update}" method="post">
            
            <div class="input-group">
                <label class="input-label">新しいパスワード</label>
                <input type="password" name="password" class="input-field" required placeholder="8文字以上推奨">
            </div>
            <br>
            <div class="input-group">
                <label class="input-label">パスワード（確認）</label>
                <input type="password" name="confirmPassword" class="input-field" required placeholder="もう一度入力">
            </div>

            <div>
                <button type="submit" class="submit-btn">パスワードを変更する</button>
            </div>
        </form>
    </div>
</body>
</html>
