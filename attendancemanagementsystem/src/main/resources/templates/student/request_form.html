<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公欠申請フォーム</title>
    
    <link rel="stylesheet" th:href="@{/css/parts.css}">
    <link rel="stylesheet" th:href="@{/css/student/request_form.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script th:src="@{/js/request_form.js}" defer></script>
</head>

<body>

    <div class="header-container">
        <div th:replace="~{fragments/_parts :: student-header}"></div>
    </div>

    <div class="backbutton-container">
        <div th:replace="~{fragments/_parts :: backButton(url=@{/student/request_main})}"></div>
    </div>
    
    <main class="content-wrapper request-form-layout">
    
        <div class="form-container">
            <form id="requestForm" method="post" th:action="@{/student/request/form}">
                <input type="hidden" name="startDate" id="hiddenStartDate">
                <input type="hidden" name="endDate" id="hiddenEndDate">

                <div th:if="${errorMessage}" class="alert alert-danger" style="color: red; text-align: center; margin-bottom: 20px;">
                    <i class="fa-solid fa-triangle-exclamation"></i> <span th:text="${errorMessage}"></span>
                </div>

                <table class="request-form-table">
                    <tr>
                        <th style="width: 30%;">申請先 (承認者)</th>
                        <td>
                            <div class="select-wrapper">
                                <select name="approverId" id="approverSelect" class="standard-select" required>
                                    <option value="" disabled selected>承認者を選択してください</option>
                                    <option th:each="admin : ${admins}" 
                                            th:value="${admin.userId}" 
                                            th:text="${admin.name}">
                                    </option>
                                </select>
                            </div>
                            <p th:if="${#lists.isEmpty(admins)}" style="color: red; font-size: 0.9em; margin-top: 5px;">
                                ※申請可能な管理者がいません。
                            </p>
                        </td>
                    </tr>

                    <tr>
                        <th>期間</th>
                        <td>
                            <div class="date-select-group">
                                <div class="date-row">
                                    <span class="date-label">開始：</span>
                                    <select id="startYear" class="date-select"></select> 年
                                    <select id="startMonth" class="date-select"></select> 月
                                    <select id="startDay" class="date-select"></select> 日
                                </div>
                                <div class="date-row">
                                    <span class="date-label">終了：</span>
                                    <select id="endYear" class="date-select"></select> 年
                                    <select id="endMonth" class="date-select"></select> 月
                                    <select id="endDay" class="date-select"></select> 日
                                </div>
                            </div>
                        </td>
                    </tr>

                    <tr>
                        <th>対象時限</th>
                        <td>
                            <div class="checkbox-group">
                                <label class="checkbox-item"><input type="checkbox" name="periods" value="1"> <span>1限</span></label>
                                <label class="checkbox-item"><input type="checkbox" name="periods" value="2"> <span>2限</span></label>
                                <label class="checkbox-item"><input type="checkbox" name="periods" value="3"> <span>3限</span></label>
                                <label class="checkbox-item"><input type="checkbox" name="periods" value="4"> <span>4限</span></label>
                            </div>
                        </td>
                    </tr>

                    <tr>
                        <th>変更内容</th>
                        <td>
                            <textarea class="reason-textarea" name="reason" id="reasonText" placeholder="理由を入力してください（例：会社説明会のため）" required></textarea>
                        </td>
                    </tr>
                </table>

                <div class="submit-button-container" style="text-align: center; margin-top: 30px;">
                    <button type="button" id="confirmBtn" class="ghost-button" style="padding: 10px 40px;">申請内容を確認する</button>
                </div>
            
            </form>
        </div>
    </main>

    <div id="confirmationModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3>申請内容の確認</h3>
            <p style="margin-bottom: 15px;">以下の内容で申請しますか？</p>
            <div class="modal-body">
                <dl>
                    <dt>【申請先】</dt> <dd id="modalApprover"></dd> 
                    <dt>【期間】</dt> <dd id="modalPeriod"></dd>
                    <dt>【時限】</dt> <dd id="modalTime"></dd>
                    <dt>【理由】</dt> <dd id="modalReason" style="white-space: pre-wrap; word-wrap: break-word;"></dd>
                </dl>
            </div>
            <div class="modal-actions">
                <button type="button" id="modalCancelBtn" class="cancel-btn">修正する</button>
                <button type="button" id="modalSubmitBtn" class="confirm-btn">申請する</button>
            </div>
        </div>
    </div>

</body>
</html>
