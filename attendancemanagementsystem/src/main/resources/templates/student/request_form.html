<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公欠申請フォーム</title>
    
    <link rel="stylesheet" th:href="@{/css/parts.css}">
        <link rel="stylesheet" th:href="@{/css/student/request_form.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <div class="header-container">
        <div th:replace="~{fragments/_parts :: student-header}"></div>
    </div>

    <div class="backbutton-container">
        <div th:replace="~{fragments/_parts :: backButton(url=@{/student/request_main})}"></div>
    </div>
    
    <main class="content-wrapper request-form-layout">
    
        <div class="form-container">
            <form id="requestForm" method="post" th:action="@{/student/request/form}">
            
                <table class="request-form-table">
                    <tr>
                        <th style="width: 30%;">申請先 (承認者)</th>
                        <td>
                            <div class="custom-select-wrapper">
                                <select class="date-select" id="approverId" name="approverId" style="width: 100%; max-width: 300px;">
                                    <option value="" disabled selected>承認者を選択してください</option>
                                    <option th:each="admin : ${approvers}" 
                                        th:value="${admin.userId}" 
                                        th:text="${admin.name}"></option> </select>
                            </div>
                        </td>
                    </tr>

                    <tr>
                        <th>公欠申請日 (開始)</th>
                        <td>
                            <div class="date-selection">
                                <select class="date-select" id="startYear" name="startYear">
                                    <option th:each="year : ${years}" th:value="${year}" th:text="${year} + '年'"></option>
                                </select>
                                <select class="date-select" id="startMonth" name="startMonth">
                                    <option th:each="m : ${#numbers.sequence(1, 12)}" th:value="${m}" th:text="${m} + '月'"></option>
                                </select>
                                <select class="date-select" id="startDay" name="startDay">
                                    </select>
                            </div>
                        </td>
                    </tr>

                    <tr>
                        <th>公欠申請日 (終了)</th>
                        <td>
                            <div class="date-selection">
                                <select class="date-select" id="endYear" name="endYear">
                                    <option th:each="year : ${years}" th:value="${year}" th:text="${year} + '年'"></option>
                                </select>
                                <select class="date-select" id="endMonth" name="endMonth">
                                    <option th:each="m : ${#numbers.sequence(1, 12)}" th:value="${m}" th:text="${m} + '月'"></option>
                                </select>
                                <select class="date-select" id="endDay" name="endDay">
                                    </select>
                            </div>
                        </td>
                    </tr>
                    
                    <tr>
                        <th>時限</th>
                        <td>
                            <div style="margin-bottom: 5px;">
                                <label class="checkbox-item" style="font-weight: bold;">
                                    <input type="checkbox" id="selectAllPeriods"> 全選択
                                </label>
                            </div>
                            
                            <div class="time-checkboxes">
                                <label class="checkbox-item"><input type="checkbox" name="periods" value="1"> 1限</label>
                                <label class="checkbox-item"><input type="checkbox" name="periods" value="2"> 2限</label>
                                <label class="checkbox-item"><input type="checkbox" name="periods" value="3"> 3限</label>
                                <label class="checkbox-item"><input type="checkbox" name="periods" value="4"> 4限</label>
                                <label class="checkbox-item"><input type="checkbox" name="periods" value="5"> 5限</label>
                            </div>
                        </td>
                    </tr>
                    
                    <tr>
                        <th>理由</th>
                        <td>
                            <textarea class="reason-textarea" name="reason" placeholder="理由を入力してください（例：会社説明会のため）"></textarea>
                        </td>
                    </tr>
                </table>

                <div class="submit-button-container" style="text-align: center; margin-top: 30px;">
                    <button type="button" id="confirmBtn" class="ghost-button" style="padding: 10px 40px;">申請内容を確認する</button>
                </div>
            
            </form>
        </div>
    </main>

    <div id="confirmationModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3>申請内容の確認</h3>
            <p style="margin-bottom: 15px;">以下の内容で申請しますか？</p>
            <div class="modal-body">
                <dl>
                    <dt>【申請先】</dt> <dd id="modalApprover"></dd> 
                    <dt>【期間】</dt> <dd id="modalPeriod"></dd>
                    <dt>【時限】</dt> <dd id="modalTime"></dd>
                    <dt>【理由】</dt> <dd id="modalReason" style="white-space: pre-wrap; word-wrap: break-word;"></dd>
                </dl>
            </div>
            <div class="modal-actions">
                <button type="button" id="modalCancelBtn" class="cancel-btn">修正する</button>
                <button type="button" id="modalSubmitBtn" class="confirm-btn">確定する</button>
            </div>
        </div>
    </div>

    <script th:src="@{/js/request_form.js}"></script>

</body>
</html>
