<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>時間割</title>
    
    <link rel="stylesheet" th:href="@{/css/parts.css}">
    <link rel="stylesheet" th:href="@{/css/timeTable.css}">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

 <div class="header-container">
        <div th:replace="~{fragments/_parts :: header(title='出欠管理システム')}"></div>
    </div>

    <script th:inline="javascript">
    /*<![CDATA[*/
    window.initialWeekStartStr = /*[[${weekStart}]]*/ '';
    window.initialDateStr = /*[[${initialDate}]]*/ '';
    window.initialData = /*[[${initialData}]]*/ null;
    /*]]>*/
    </script>

    <script th:src="@{/js/timeTable.js}" defer></script>
    
    <div class="timetable-container">
        
        <div class="timetable-header">
            
            <div class="month-year-selector">
                <select id="yearSelector"></select>
                <select id="monthSelector"></select>
                </div>

            <div class="week-navigation">
                <button id="prevWeekBtn" class="nav-arrow"><</button>
                <span id="currentWeekDisplay" class="week-info"></span>
                <button id="nextWeekBtn" class="nav-arrow">></button>
            </div>
            
            <div class="calendar-icon">
                <span>カレンダー</span>
            </div>
        </div>

        <div class="timetable-wrapper">
            <table id="weeklyTimetable" class="timetable">
                <thead>
                    <tr>
                        <th class="time-slot-header">時間</th>
                        </tr>
                </thead>
                <tbody id="timetableBody">
                    </tbody>
            </table>
        </div>
    </div>
    
    
    

</body>
</html>
