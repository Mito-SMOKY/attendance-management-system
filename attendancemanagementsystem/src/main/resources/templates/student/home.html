<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>学生メインメニュー (表示確認)</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        h1, h2, h3 { color: #333; }
        ul { border: 1px solid #ccc; padding: 10px; }
        li { margin-bottom: 5px; }
        .empty { color: #888; }
    </style>
</head>
<body>
    <h1>学生メインメニュー (データ表示確認)</h1>

    <h2 th:text="${displayMonth}">2025年 11月 (←これはHTMLの仮データ)</h2>
    
    <p>ようこそ、 <strong th:text="${studentName}">〇〇さん (←仮)</strong></p>

    <hr>

    <h3>■ カレンダーの予定 (calendarEvents)</h3>
    
    <div th:if="${#lists.isEmpty(calendarEvents)}">
        <p class="empty">今月の予定はありません。</p>
    </div>
    
    <ul th:unless="${#lists.isEmpty(calendarEvents)}">
        <li th:each="event : ${calendarEvents}">
            <span th:text="${event.date}">2025-11-17</span> : 
            <strong th:text="${event.title}">イベントタイトル</strong>
        </li>
    </ul>

    <hr>

    <h3>■ 出欠記録 (attendanceRecords)</h3>
    <p style="font-size: 0.9em; color: #555;">
        (注意: Service側が未最適化のため、全期間の記録が表示されます)
    </p>

    <div th:if="${#lists.isEmpty(attendanceRecords)}">
        <p class="empty">出欠記録はありません。</p>
    </div>

    <ul th:unless="${#lists.isEmpty(attendanceRecords)}">
        <li th:each="record : ${attendanceRecords}">
            日付: <span th:text="${record.timetable?.date}">日付不明</span> / 
            ステータスID: <span th:text="${record.statusId}">0</span> /
            (TimeTableID: <span th:text="${record.timetable?.timeTableId}">0</span>)
        </li>
    </ul>

</body>
</html>
