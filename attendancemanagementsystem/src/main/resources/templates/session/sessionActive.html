<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>授業実施中 - Attendance System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    
    <link th:href="@{/css/session/sessionActive.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.1/css/all.css">
</head>
<body>

<div class="active-header d-flex justify-content-between align-items-center">
    
    <div>
        <h2 class="m-0">
            <span th:text="${sessionDto.gradeClass}"></span>
            <span th:text="${sessionDto.className}"></span>: 
            <span th:text="${sessionDto.subjectName}"></span>
        </h2>
        <div class="text-muted mt-1">
            <span class="me-3">開始時間：<span th:text="${sessionDto.startTime}"></span></span>
            <span>場所：<span th:text="${sessionDto.classroomName}"></span></span>
        </div>
    </div>
    <div class="d-flex gap-2">
        <button id="cancelSessionBtn" class="btn btn-outline-danger">授業キャンセル</button>
        <button id="endSessionBtn" class="btn btn-primary">授業終了・確定</button>
    </div>
</div>

<div class="container pb-5">
    
    <div class="row mt-4 g-2">
        <div class="col">
            <div class="stat-card">
                <div class="text-muted">総人数</div>
                <div class="stat-number" id="countTotal">-</div>
            </div>
        </div>
        <div class="col">
            <div class="stat-card">
                <div class="text-muted">出席</div>
                <div class="stat-number text-success" id="countPresent">-</div>
            </div>
        </div>
        <div class="col">
            <div class="stat-card">
                <div class="text-muted">遅刻</div>
                <div class="stat-number text-warning" id="countLate">-</div>
            </div>
        </div>
        <div class="col">
            <div class="stat-card">
                <div class="text-muted">早退</div>
                <div class="stat-number text-info" id="countEarly">-</div>
            </div>
        </div>
        <div class="col">
            <div class="stat-card">
                <div class="text-muted">欠席</div>
                <div class="stat-number text-danger" id="countAbsent">-</div>
            </div>
        </div>
        <div class="col">
            <div class="stat-card">
                <div class="text-muted">公欠</div>
                <div class="stat-number text-danger" id="countAbsentCandidate">-</div>
            </div>
        </div>
        <div class="col">
            <div class="stat-card">
                <div class="text-muted">出欠停止</div>
                <div class="stat-number text-danger" id="countSuspended">-</div>
            </div>
        </div>

    </div>

    <div class="student-table-container">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="m-0">出席状況一覧</h4>
            <span class="badge bg-secondary" id="lastUpdated">更新: --:--:--</span>
        </div>

        <table class="table table-hover align-middle">
            <thead class="table-light">
                <tr>
                    <th style="width: 25%">名前</th>
                    <th style="width: 15%">入室時間</th>
                    <th style="width: 30%">ステータス変更</th>
                    <th style="width: 30%">ステータス</th>
                </tr>
            </thead>
            <tbody id="attendeesTableBody">
            </tbody>
        </table>
    </div>
</div>

<div id="loadingOverlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.8); z-index:2000; justify-content:center; align-items:center;">
    <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
</div>

<input type="hidden" id="sessionId" th:value="${sessionDto.sessionId}">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script th:src="@{/js/session/sessionActive.js}"></script>

</body>
</html>
