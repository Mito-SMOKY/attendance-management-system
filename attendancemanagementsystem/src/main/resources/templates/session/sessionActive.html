<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>セッションアクティブ画面</title>
    <link rel="stylesheet" href="/css/admin/session.css">
    <link rel="stylesheet" th:href="@{/css/parts.css}">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.1/css/all.css">
</head>

<body>

<div id="loadingOverlay">
    <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
</div>

<div class="container mt-4">
    <div class="active-header rounded mb-4">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <span class="badge bg-success mb-2">実施中</span>
                <h2 class="mb-0 fw-bold">
                    <span th:text="${sessionDto.className}">科目名</span>
                </h2>
                <div class="text-muted mt-1">
                    <i class="bi bi-clock"></i> 開始時刻: <span th:text="${#temporals.format(sessionDto.startTime, 'HH:mm')}">10:00</span>
                    <span class="mx-2">|</span>
                    <i class="bi bi-geo-alt"></i> 教室: <span th:text="${sessionDto.classroomName}">教室A</span>
                </div>
            </div>
            
            <div>
                <button id="endSessionBtn" 
                        class="btn btn-danger btn-lg shadow-sm"
                        th:data-session-id="${sessionDto.sessionId}">
                    授業を終了して集計
                </button>
            </div>
        </div>
    </div>

    <div class="student-list">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="mb-0">
                出席状況（リアルタイム）
                <span class="badge bg-secondary ms-2" id="studentCount">0名</span>
            </h4>
            <div class="text-end">
                <small class="text-muted me-2" id="lastUpdated">更新中...</small>
                <button class="btn btn-outline-primary btn-sm" onclick="fetchAttendees()">
                    手動更新
                </button>
            </div>
        </div>
        
        <table class="table table-hover align-middle">
            <thead class="table-light">
                <tr>
                    <th>学籍番号/ID</th>
                    <th>氏名</th>
                    <th>入室時間</th>
                    <th>状態</th>
                </tr>
            </thead>
            <tbody id="attendeeList">
                <tr>
                    <td colspan="4" class="text-center text-muted py-4">
                        データを読み込んでいます...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="/js/session.js"></script>

</body>
</html>
