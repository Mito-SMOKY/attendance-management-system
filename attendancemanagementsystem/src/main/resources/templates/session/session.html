<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>セッション設定画面</title>
    <link rel="stylesheet" href="/css/admin/session.css">
    <link rel="stylesheet" th:href="@{/css/parts.css}">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.1/css/all.css">
</head>

<body>

<div class="header-container">
    <div th:replace="~{fragments/_parts :: admin-header}"></div>
</div>

<div class="backbutton-container">
     <div th:replace="~{fragments/_parts :: backButton(url='/admin/timetable')}"></div>
</div>


<div class="container">
    <div class="setting-table">
        <h2 class="table-label">授業を開始する</h2>
        
        <form id="startSessionForm">
            
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="date" class="form-label">日付</label>
                    <input type="date" class="form-control" id="date" required 
                        th:value="${defaultDate}">
                </div>
                <div class="col-md-6">
                    <label for="time" class="form-label">開始時間</label>
                    <input type="time" class="form-control" id="time" required 
                        th:value="${defaultTime}">
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="targetDepartment" class="form-label">対象学科</label>
                    <select class="form-select" id="targetDepartment" onchange="updateOptions()" required>
                        <option th:each="dept : ${departmentList}" 
                                th:value="${dept.departmentId}" 
                                th:text="${dept.major.majorName + ' ' + dept.className}">
                        </option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="targetGrade" class="form-label">対象学年</label>
                    <select class="form-select" id="targetGrade" required>
                        <option value="">読込中...</option>
                    </select>
                </div>
            </div>

            <div class="mb-3">
                <label for="subjectId" class="form-label">科目</label>
                <select class="form-select" id="subjectId" required>
                    <option value="">読込中...</option>
                </select>
            </div>

            <div class="mb-4">
                <label for="classroomId" class="form-label">使用教室</label>
                <select class="form-select" id="classroomId" required>
                    <option th:each="room : ${classroomList}" 
                        th:value="${room.classroomId}" 
                        th:text="${room.classroomName}">
                    </option>
                </select>
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary btn-lg">セッション開始</button>
            <div class="mb-3">
                <label for="subjectId" class="form-label">授業科目</label>
                <select class="form-select" id="subjectId" required>
                    <option value="" selected disabled>科目を選択してください</option>
                    <option th:each="subject : ${subjectList}"
                            th:value="${subject.subjectId}"
                            th:text="${subject.subjectName} + ' (' + ${subject.totalCredits} + '単位)'">
                    </option>
                </select>
            </div>

            <div class="mb-3">
                <label for="classroomId" class="form-label">教室</label>
                <select class="form-select" id="classroomId" required>
                    <option value="" selected disabled>教室を選択してください</option>
                    <option th:each="room : ${classroomList}"
                            th:value="${room.classroomId}"
                            th:text="${room.classroomName}">
                    </option>
                </select>
            </div>

            <div class="btn-container">
                <button type="submit" class="session-start-btn">
                    セッションを開始
                </button>
            </div>
        </form>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    
    // APIのベースURLをThymeleafで生成
    const API_BASE = /*[[@{/session/api}]]*/ '/session/api';
    const SESSION_START_URL = /*[[@{/session/start}]]*/ '/session/start';
    const SESSION_ACTIVE_URL_BASE = /*[[@{/session/active/}]]*/ '/session/active/';

    // ★追加: 強制終了処理を行う関数
    function forceEndSession() {
        // activeSessionがnullの場合はこのスクリプトブロック自体がエラーにならないように注意が必要ですが、
        // HTML側でth:ifを使っているので安全です。ただし変数は埋め込む必要があります。
        /*[+
        const activeSessionId = [[${activeSession != null ? activeSession.sessionId : null}]];
        +]*/
        
        if(!activeSessionId) return;

        if(!confirm("前回の授業を終了し、出席を確定しますか？\n(ログに基づいて自動集計されます)")) {
            return;
        }

        // 終了APIを叩く
        fetch('/session/end', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                sessionId: activeSessionId,
                changes: {} // 手動変更なし
            })
        })
        .then(response => response.json())
        .then(data => {
            alert("前回の授業を終了しました。");
            // 画面をリロードしてモーダルを消す
            window.location.href = "/session"; 
        })
        .catch(error => {
            console.error('Error:', error);
            alert("終了処理に失敗しました。");
        });
    }

    function updateOptions() {
        const deptId = document.getElementById('targetDepartment').value;
        if (!deptId) return;

        // 1. 学年の更新
        fetch(`${API_BASE}/grades/${deptId}`)
            .then(res => res.json())
            .then(grades => {
                const gradeSelect = document.getElementById('targetGrade');
                gradeSelect.innerHTML = '';
                if (grades.length === 0) {
                    gradeSelect.innerHTML = '<option value="">学年なし</option>';
                } else {
                    grades.forEach(g => {
                        const opt = document.createElement('option');
                        opt.value = g;
                        opt.textContent = g + '年';
                        gradeSelect.appendChild(opt);
                    });
                }
            })
            .catch(err => console.error("Grade fetch error:", err));

        // 2. 科目の更新
        fetch(`${API_BASE}/subjects/${deptId}`)
            .then(res => res.json())
            .then(subjects => {
                const subjectSelect = document.getElementById('subjectId');
                subjectSelect.innerHTML = '';
                if (subjects.length === 0) {
                    subjectSelect.innerHTML = '<option value="">科目なし</option>';
                } else {
                    subjects.forEach(s => {
                        const opt = document.createElement('option');
                        opt.value = s.subjectId;
                        opt.textContent = s.subjectName;
                        subjectSelect.appendChild(opt);
                    });
                }
            })
            .catch(err => console.error("Subject fetch error:", err));
    }

    document.getElementById('startSessionForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const subjectSelect = document.getElementById('subjectId');
        if (subjectSelect.selectedIndex < 0) {
            alert("科目を選択してください");
            return;
        }
        const selectedSubjectName = subjectSelect.options[subjectSelect.selectedIndex].text;

        const data = {
            date: document.getElementById('date').value,
            time: document.getElementById('time').value,
            classroomId: document.getElementById('classroomId').value,
            targetDepartmentId: document.getElementById('targetDepartment').value,
            targetGrade: document.getElementById('targetGrade').value,
            subjectId: document.getElementById('subjectId').value,
            subjectName: selectedSubjectName
        };

        fetch(SESSION_START_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        })
        .then(response => {
            if (!response.ok) throw new Error('セッション作成に失敗しました');
            return response.json();
        })
        .then(data => {
            const url = SESSION_ACTIVE_URL_BASE + data.sessionId;
            const width = 1000;
            const height = 800;
            const left = (window.screen.width - width) / 2;
            const top = (window.screen.height - height) / 2;
            window.open(url, 'SessionWindow_' + data.sessionId, 
                `width=${width},height=${height},top=${top},left=${left},scrollbars=yes,resizable=yes`);
        })
        .catch(error => {
            console.error('Error:', error);
            alert('開始に失敗しました: ' + error.message);
        });
    });

    // 初期表示時に実行
    window.addEventListener('DOMContentLoaded', updateOptions);
    /*]]>*/
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/session_menu.js"></script>

</body>
</html>
