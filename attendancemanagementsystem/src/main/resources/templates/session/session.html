<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>授業開始設定 - Attendance System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .setup-card { max-width: 600px; margin: 40px auto; padding: 30px; background: white; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .form-label { font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="setup-card">
        <h2 class="text-center mb-4">授業を開始する</h2>
        
        <form id="startSessionForm">
            
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="date" class="form-label">日付</label>
                    <input type="date" class="form-control" id="date" required 
                        th:value="${defaultDate}">
                </div>
                <div class="col-md-6">
                    <label for="time" class="form-label">開始時間</label>
                    <input type="time" class="form-control" id="time" required 
                        th:value="${defaultTime}">
                </div>
            </div>

            <div class="mb-3">
                <label for="courseName" class="form-label">対象コース</label>
                <select class="form-select" id="courseName" required>
                    <option value="" selected disabled>コースを選択してください</option>
                    <option th:each="course : ${courseList}"
                            th:value="${course}"
                            th:text="${course}">
                    </option>
                </select>
            </div>

            <div class="mb-3">
                <label for="subjectId" class="form-label">授業科目</label>
                <select class="form-select" id="subjectId" required>
                    <option value="" selected disabled>科目を選択してください</option>
                    <option th:each="subject : ${subjectList}"
                            th:value="${subject.subjectId}"
                            th:text="${subject.subjectName} + ' (' + ${subject.totalCredits} + '単位)'">
                    </option>
                </select>
            </div>

            <div class="mb-3">
                <label for="classroomId" class="form-label">使用教室</label>
                <select class="form-select" id="classroomId" required>
                    <option value="" selected disabled>教室を選択してください</option>
                    <option th:each="room : ${classroomList}"
                            th:value="${room.classroomId}"
                            th:text="${room.classroomName}">
                    </option>
                </select>
            </div>

            <div class="d-grid gap-2 mt-4">
                <button type="submit" class="btn btn-primary btn-lg">
                    セッションを開始 (Pop-up)
                </button>
            </div>
        </form>
    </div>
</div>

<script>
document.getElementById('startSessionForm').addEventListener('submit', function(e) {
    e.preventDefault();

    // フォームの値を取得
    const data = {
        date: document.getElementById('date').value,
        time: document.getElementById('time').value,
        courseName: document.getElementById('courseName').value,
        subjectId: document.getElementById('subjectId').value,
        classroomId: document.getElementById('classroomId').value
    };

    // サーバー送信
    fetch('/session/start', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    })
    .then(response => {
        if (!response.ok) throw new Error('セッション作成に失敗しました');
        return response.json();
    })
    .then(data => {
        // ポップアップを開く
        const url = `/session/active/${data.sessionId}`;
        window.open(url, 'SessionWindow_' + data.sessionId, 'width=1000,height=800,scrollbars=yes,resizable=yes');
        })
    .catch(error => {
        console.error('Error:', error);
        alert('エラーが発生しました: ' + error.message);
    });
});
</script>

</body>
</html>
