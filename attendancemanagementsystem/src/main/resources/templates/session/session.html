<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>セッション設定画面</title>
    <link rel="stylesheet" th:href="@{/css/admin/session.css}">
    <link rel="stylesheet" th:href="@{/css/parts.css}">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.1/css/all.css">
</head>

<body>
<div class="header-container">
    <div th:replace="~{fragments/_parts :: admin-header}"></div>
</div>

<div th:if="${activeSession != null}" id="activeSessionOverlay" ...>
    <button onclick="forceEndSession()" class="btn btn-secondary btn-lg">強制終了して次へ</button>
</div>

<div class="container">
    <div class="setting-table">
        <h2 class="table-label">授業を開始する</h2>
        <form id="startSessionForm">
            <input type="hidden" id="targetDepartment" name="targetDepartmentId">

            <div class="select-box">
                <div class="col-md-6"><label>日付</label><input type="date" id="date" class="form-control" th:value="${defaultDate}" required></div>
                <div class="col-md-6"><label>開始時間</label><input type="time" id="time" class="form-control" th:value="${defaultTime}" required></div>
            </div>

            <div class="select-box">
                <div class="col-md-12">
                    <label for="majorSelect">学科</label>
                    <select class="form-select" id="majorSelect" onchange="onMajorChange()" required>
                        <option value="">選択してください</option>
                    </select>
                </div>
            </div>

            <div class="select-box">
                <div class="col-md-6">
                    <label for="targetGrade">学年</label>
                    <select class="form-select" id="targetGrade" onchange="onGradeChange()" required disabled>
                        <option value="">学科を選択してください</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="classSelect">クラス</label>
                    <select class="form-select" id="classSelect" onchange="onClassChange()" required disabled>
                        <option value="">学年を選択してください</option>
                    </select>
                </div>
            </div>

            <div class="select-box">
                <div class="col-md-6">
                    <label for="subjectId">科目</label>
                    <select class="form-select" id="subjectId" required><option value="">クラスを選択してください</option></select>
                </div>
                <div class="col-md-6">
                    <label for="classroomId">使用教室</label>
                    <select class="form-select" id="classroomId" required>
                        <option th:each="room : ${classroomList}" th:value="${room.classroomId}" th:text="${room.classroomName}"></option>
                    </select>
                </div>
            </div>
            <div class="btn-container"><button type="submit" class="session-start-btn">セッションを開始</button></div>
        </form>
    </div>
</div>

<script th:inline="javascript">
    window.APP_CONFIG = {
        apiBase: /*[[@{/session/api}]]*/ '/session/api',
        startUrl: /*[[@{/session/start}]]*/ '/session/start',
        activeUrlBase: /*[[@{/session/active/}]]*/ '/session/active/',
        departmentList: /*[[${departmentList}]]*/ [],
        activeSessionId: /*[[${activeSession != null ? activeSession.sessionId : null}]]*/ null
    };
</script>
<script th:src="@{/js/session_menu.js}"></script>
</body>
</html>
