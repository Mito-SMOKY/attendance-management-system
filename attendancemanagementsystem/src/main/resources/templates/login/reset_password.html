<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta th:if="${_csrf}" name="_csrf" th:content="${_csrf.token}"/>
    <meta th:if="${_csrf}" name="_csrf_header" th:content="${_csrf.headerName}"/>

    <title>パスワード再設定 - 新しいパスワード</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/parts.css}">
    <link rel="stylesheet" th:href="@{/css/login/loginResetPass.css}">
</head>
<body>

    <div class="header-container">
        <div th:replace="~{fragments/_parts :: main-header}"></div>
    </div>

    <div class="container">
        
        <div class="backbutton-container">
            <div th:replace="~{fragments/_parts :: backButton(url='/password/verify-otp')}"></div>
        </div>
        <div style="clear: both;"></div>
        
        <h2 class="main-title">新しいパスワードを設定してください</h2>

        <div th:if="${error}" class="error-msg-container">
            <p class="error-msg" th:text="${error}"></p>
        </div>
        <div id="jsErrorMsg" class="error-msg" style="display: none;"></div>

        <form th:action="@{/password/update}" method="post" id="resetPassForm">
            
            <div class="input-group password-container">
                <label class="input-label">新しいパスワード</label>
                <input type="password" name="password" id="password" class="input-field" 
                    required placeholder="8〜24文字 (大文字・小文字混合)" 
                    minlength="8" maxlength="24">
                
                <th:block th:replace="~{fragments/_parts :: passwordToggle('password')}"></th:block>
            </div>
            
            <div class="input-group password-container">
                <label class="input-label">パスワード（確認）</label>
                <input type="password" name="confirmPassword" id="confirmPassword" class="input-field" 
                    required placeholder="もう一度入力"
                    maxlength="24">
                
                <th:block th:replace="~{fragments/_parts :: passwordToggle('confirmPassword')}"></th:block>
            </div>

            <div class="btn-area">
                <button type="submit" id="submitBtn" class="confirm-btn">確定</button>
            </div>
        </form>

    </div>

    <script th:src="@{/js/login_ResetPass.js}"></script>
</body>
</html>
