<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メール変更 - 認証コード入力</title>
    
    <link rel="stylesheet" th:href="@{/css/parts.css}">
    <link rel="stylesheet" th:href="@{/css/login/emailVerifyOtp.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="header-container">
        <div th:replace="~{fragments/_parts :: main-header}"></div>
    </div>

    <div class="container">

        <div class="backbutton-container">
            <div th:replace="~{fragments/_parts :: backButton(url='/email/reset-email')}"></div>
        </div>
        
        <div style="clear: both;"></div>

        <h2 class="main-title">ワンタイムパスワードを入力してください</h2>

        <div th:if="${message == 'sent'}" class="success-message">
            認証コードを再送信しました。<br>メールをご確認ください。
        </div>

        <p class="description-text">
            新しいメールアドレスに送信された<br>6桁の認証コードを入力してください。
        </p>

        <form th:action="@{/email/verify-otp}" method="post" id="otpForm" class="otp-form">
            
            <input type="hidden" name="email" th:value="${session.resetEmail_NewEmail}">

            <div class="input-group">
                <input type="text" name="otp" id="otpInput" class="otp-input" 
                    maxlength="6" placeholder="______" required 
                    autocomplete="one-time-code" inputmode="numeric">
                
                <button type="submit" id="submitBtn" class="confirm-btn">確定</button>
            </div>
            
            <div id="jsErrorMsg" class="js-error-msg"></div>

            <div th:if="${param.error}" class="server-error-msg">
                <p th:if="${param.error[0] == 'invalid'}">
                    認証コードが正しくありません。<br>メールを確認して再入力してください。
                </p>
                <p th:if="${param.error[0] == 'too_soon'}">
                    再送信の間隔が短すぎます。<br>少し時間を置いてからお試しください。
                </p>
                <div th:if="${param.error[0] == 'expired'}">
                    <p style="font-weight: bold;">有効期限が切れています。</p>
                    <a th:href="@{/email/reset-email}" class="expire-link">
                        認証コードを再発行する
                    </a>
                </div>
            </div>
        </form>

        <div class="resend-area">
            <p class="resend-text">メールが届かない場合</p>
            <form th:action="@{/email/send-otp}" method="post" id="resendForm">
                <input type="hidden" name="newEmail" th:value="${session.resetEmail_NewEmail}">
                <input type="hidden" name="isResend" value="true">
                <button type="submit" id="resendBtn" class="resend-btn">再送信</button>
            </form>
        </div>
    </div>

    <script th:src="@{/js/email_VerifyOtp.js}"></script>
</body>
</html>
