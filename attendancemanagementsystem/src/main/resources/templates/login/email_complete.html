<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メールアドレス変更完了</title>
    <link rel="stylesheet" th:href="@{/css/parts.css}">
    <style>
        body { font-family: "Yu Gothic", sans-serif; color: #333; margin: 0; text-align: center; }
        .header-bar { background-color: #6CC0C8; height: 60px; width: 100%; margin-bottom: 100px; }
        .container { max-width: 600px; margin: 0 auto; }
        .title { font-size: 24px; font-weight: bold; margin-bottom: 40px; }
        .back-btn { 
            display: inline-block; padding: 10px 30px; 
            border: 1px solid #333; border-radius: 5px; 
            text-decoration: none; color: #333; background-color: white;
            cursor: pointer; transition: background 0.3s;
        }
        .back-btn:hover { background-color: #f0f0f0; }
    </style>
</head>
<body>

    <div class="header-bar"></div>

    <div class="container">
        <h2 class="title">メールアドレスの変更が完了しました</h2>
        <p style="margin-bottom: 40px;">次回ログイン時より、新しいメールアドレスをご利用ください。</p>

        <a th:href="@{/login}" class="back-btn">ログイン画面に戻る</a>
    </div>

</body>
</html>
