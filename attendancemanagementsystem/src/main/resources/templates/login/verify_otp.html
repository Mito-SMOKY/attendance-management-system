<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>パスワード再設定 - 認証コード入力</title>
    
    <link rel="stylesheet" th:href="@{/css/login/loginVerifyOtp.css}">
    <link rel="stylesheet" th:href="@{/css/parts.css}">
</head>
<body>

    <div class="header-bar"></div>

    <div class="container">

        <div class="backbutton-container">
            <div th:replace="~{fragments/_parts :: backButton(url='/password/forgot')}"></div>
        </div>
        
        <div style="clear: both;"></div>

        <h2 class="main-title">ワンタイムパスワードを入力してください</h2>

        <div th:if="${message == 'sent'}" class="success-msg">
            認証コードを再送信しました。メールをご確認ください。
        </div>

        <form th:action="@{/password/verify-otp}" method="post" id="otpForm">
            <input type="hidden" name="email" th:value="${session.resetEmail}">

            <div style="display: inline-block;">
                <input type="text" name="otp" id="otpInput" class="otp-input" 
                    maxlength="6" placeholder="______" required 
                    autocomplete="one-time-code" inputmode="numeric">
                
                <button type="submit" id="submitBtn" class="confirm-btn">確定</button>
            </div>
            
            <div id="jsErrorMsg" class="error-msg" style="display: none;"></div>

            <div th:if="${param.error}" style="color: red; margin-bottom: 15px; margin-top: 15px;">
                <p th:if="${param.error[0] == 'invalid'}">
                    認証コードが正しくありません。<br>メールを確認して再入力してください。
                </p>
                <p th:if="${param.error[0] == 'too_soon'}">
                    再送信の間隔が短すぎます。<br>少し時間を置いてからお試しください。
                </p>
                <div th:if="${param.error[0] == 'expired'}">
                    <p style="font-weight: bold;">有効期限が切れています。</p>
                    <a th:href="@{/password/forgot}" style="color: #007bff; text-decoration: underline;">
                        認証コードを再発行する
                    </a>
                </div>
            </div>
        </form>

        <div class="resend-area">
            <p>メールが届かない場合</p>
            <form th:action="@{/password/send-otp}" method="post" id="resendForm">
                <input type="hidden" name="email" th:value="${session.resetEmail}">
                <input type="hidden" name="isResend" value="true">
                <button type="submit" id="resendBtn" class="resend-btn">再送信</button>
            </form>
        </div>
    </div>

    <script th:src="@{/js/login_verifyotp.js}"></script>
</body>
</html>
