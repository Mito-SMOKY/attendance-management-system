<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワード再設定 - 認証コード入力</title>
    <link rel="stylesheet" th:href="@{/css/parts.css}">
    <style>
        /* 簡易スタイル */
        body { font-family: "Yu Gothic", sans-serif; color: #333; margin: 0; }
        .header-bar { background-color: #6CC0C8; height: 60px; width: 100%; }
        .container { max-width: 600px; margin: 0 auto; padding: 40px 20px; text-align: center; }
        
        .back-btn { display: inline-block; padding: 5px 15px; border: 1px solid #333; border-radius: 5px; text-decoration: none; color: #333; float: left; }
        
        .main-title { font-size: 20px; margin-top: 60px; margin-bottom: 40px; }

        .otp-input { 
            width: 200px; padding: 10px; font-size: 24px; text-align: center; letter-spacing: 5px;
            border: none; border-bottom: 2px solid #6CC0C8; outline: none; background-color: transparent;
        }
        
        .confirm-btn { margin-left: 20px; background-color: white; border: 1px solid #333; padding: 8px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; }
        
        .error-msg { color: red; margin-top: 10px; font-size: 14px; }

        .resend-area { margin-top: 60px; }
        .resend-btn { background-color: white; border: 1px solid #333; padding: 8px 30px; font-size: 14px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header-bar"></div>

    <div class="container">
        <a th:href="@{/password/forgot}" class="back-btn">＜ 戻る</a>
        <div style="clear: both;"></div>

        <h2 class="main-title">ワンタイムパスワードを入力してください</h2>

        <form th:action="@{/password/verify-otp}" method="post">
            <div style="display: inline-block;">
                <input type="text" name="otp" class="otp-input" maxlength="6" placeholder="______" required autocomplete="off">
                <button type="submit" class="confirm-btn">確定</button>
            </div>
            
            <div th:if="${param.error}" style="color: red; margin-bottom: 15px;">
            
            <p th:if="${param.error[0] == 'invalid'}">
                認証コードが正しくありません。<br>メールを確認して再入力してください。
            </p>

            <div th:if="${param.error[0] == 'expired'}">
                <p style="font-weight: bold;">
                    有効期限が切れています。
                </p>
                <p style="font-size: 0.9em;">
                    セキュリティのため、新しい認証コードを発行してください。
                </p>
                <a th:href="@{/password/forgot}" 
                    style="color: #007bff; text-decoration: underline;">
                    認証コードを再発行する
                </a>
            </div>

            <p th:if="${param.error[0] != 'invalid' and param.error[0] != 'expired'}">
                エラーが発生しました。もう一度お試しください。
            </p>
        </div>
        </form>

        <div class="resend-area">
            <p>メールが届かない場合</p>
            <form th:action="@{/password/send-otp}" method="post">
                <input type="hidden" name="email" th:value="${session.resetEmail}">
                <button type="submit" class="resend-btn">再送信</button>
            </form>
        </div>
    </div>

</body>
</html>
