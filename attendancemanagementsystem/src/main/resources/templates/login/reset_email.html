<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メールアドレス変更 - 入力</title>
    <link rel="stylesheet" th:href="@{/css/parts.css}">
    <style>
        /* スタイルは認証画面と同じ定義で統一感を出します */
        body { font-family: "Yu Gothic", sans-serif; margin: 0; color: #333; }
        .header-bar { background-color: #6CC0C8; height: 60px; width: 100%; }
        .container { max-width: 600px; margin: 0 auto; padding: 60px 20px; text-align: center; }
        .main-title { font-size: 22px; font-weight: bold; margin-bottom: 40px; }
        
        .form-content { display: inline-block; text-align: left; width: 100%; max-width: 400px; }
        .form-group { margin-bottom: 25px; }
        .label { display: block; font-weight: bold; font-size: 14px; margin-bottom: 8px; }
        .input-text { width: 100%; padding: 10px; font-size: 16px; border: 1px solid #333; border-radius: 5px; box-sizing: border-box; }
        
        .submit-btn {
            display: block; width: 100%; margin: 40px auto 0; padding: 12px;
            background-color: #fff; border: 1px solid #333; border-radius: 5px;
            font-size: 16px; cursor: pointer; transition: background 0.3s;
        }
        .submit-btn:hover { background-color: #f5f5f5; }
        .error-msg { color: red; font-size: 14px; margin-top: 5px; display: none; }
        .back-link { display: block; margin-top: 30px; text-align: right; color: #6CC0C8; text-decoration: none; border-bottom: 1px solid #6CC0C8; width: fit-content; margin-left: auto;}
        
        /* エラー時の赤枠 */
        .input-error { border-color: red; background-color: #fffafa; }
    </style>
</head>
<body>

    <div class="header-bar"></div>

    <div class="container">
        <h2 class="main-title">新しいメールアドレスを入力してください</h2>

        <form id="emailForm" th:action="@{/email/send-otp}" method="post" class="form-content">
            
            <div class="form-group">
                <label class="label">変更先メールアドレス</label>
                <input type="email" id="newEmail" name="newEmail" class="input-text" placeholder="hoge@example.com" required>
            </div>

            <div class="form-group">
                <label class="label">変更先メールアドレス（確認）</label>
                <input type="email" id="confirmEmail" name="confirmEmail" class="input-text" placeholder="hoge@example.com" required>
                
                <p id="matchError" class="error-msg">メールアドレスが一致しません</p>
                <p th:if="${error}" th:text="${error}" style="color:red; font-size:14px; margin-top:5px; display:block;"></p>
            </div>

            <button type="submit" class="submit-btn">認証コードを送信する</button>
        </form>

        <a th:href="@{/email/auth}" class="back-link">戻る ＞</a>
    </div>

    <script>
        const form = document.getElementById('emailForm');
        const newEmail = document.getElementById('newEmail');
        const confirmEmail = document.getElementById('confirmEmail');
        const matchError = document.getElementById('matchError');

        form.addEventListener('submit', function(e) {
            if (newEmail.value !== confirmEmail.value) {
                e.preventDefault();
                matchError.style.display = 'block';
                confirmEmail.classList.add('input-error');
            }
        });

        confirmEmail.addEventListener('input', function() {
            if (newEmail.value === confirmEmail.value) {
                matchError.style.display = 'none';
                confirmEmail.classList.remove('input-error');
            }
        });
    </script>

</body>
</html>
