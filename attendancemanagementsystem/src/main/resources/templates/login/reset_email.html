<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メールアドレス変更 - 入力</title>
    
    <link rel="stylesheet" th:href="@{/css/parts.css}">
    
    <link rel="stylesheet" th:href="@{/css/login/loginResetEmail.css}">
</head>
<body>

    <div class="header-container">
        <div th:replace="~{fragments/_parts :: main-header}"></div>
    </div>

    <div class="container">
        
        <div class="backbutton-container">
            <div th:replace="~{fragments/_parts :: backButton(url=${backUrl})}"></div>
        </div>

        <h2 class="main-title">新しいメールアドレスを入力してください</h2>
        
        <div th:if="${isFirstLogin}" style="background-color: #e3f2fd; padding: 15px; border-radius: 5px; margin-bottom: 20px; color: #0d47a1; font-size: 0.95rem; line-height: 1.6;">
            <p style="margin: 0; font-weight: bold;">【重要】初回設定のお知らせ</p>
            <p style="margin: 5px 0 0;">初回ログインのため、メールアドレスの登録が必須となっております。<br>
            パスワード再設定や重要なお知らせで使用するため、利用可能なアドレスを入力してください。</p>
        </div>

        <div id="jsErrorMsg" class="js-error-msg"></div>

        <form id="emailForm" th:action="@{/email/send-otp}" method="post" class="form-content">
            
            <div class="form-group">
                <label class="label" for="newEmail">変更先メールアドレス</label>
                <input type="email" id="newEmail" name="newEmail" class="input-text" 
                    placeholder="hoge@example.com" required>
            </div>

            <div class="form-group">
                <label class="label" for="confirmEmail">変更先メールアドレス（確認）</label>
                <input type="email" id="confirmEmail" name="confirmEmail" class="input-text" 
                    placeholder="hoge@example.com" required>
                
                <p id="matchError" class="error-msg" style="display: none;">メールアドレスが一致しません</p>
                
                <p th:if="${error}" th:text="${error}" class="server-error-msg"></p>
            </div>

            <button type="submit" id="submitBtn" class="submit-btn">送信</button>
        </form>
    </div>

    <script th:src="@{/js/login_ResetEmail.js}"></script>
</body>
</html>
