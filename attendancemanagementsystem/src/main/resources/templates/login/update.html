<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワード再設定完了</title>
    <link rel="stylesheet" th:href="@{/css/parts.css}">
    <style>
        body { font-family: "Yu Gothic", sans-serif; color: #333; margin: 0; }
        .header-bar { background-color: #6CC0C8; height: 60px; width: 100%; }
        .container { max-width: 600px; margin: 0 auto; padding: 60px 20px; text-align: center; }
        
        .title { font-size: 24px; color: #6CC0C8; margin-bottom: 30px; font-weight: bold; }
        .message { font-size: 16px; margin-bottom: 50px; line-height: 1.8; }
        
        .login-btn { 
            display: inline-block;
            background-color: #6CC0C8; 
            color: white; 
            text-decoration: none;
            padding: 12px 60px; 
            font-size: 16px; 
            border-radius: 5px; 
            transition: opacity 0.3s;
        }
        .login-btn:hover { opacity: 0.8; }
    </style>
</head>
<body>

    <div class="header-bar"></div>

    <div class="container">
        <h2 class="title">パスワード変更完了</h2>

        <p class="message">
            パスワードの再設定が完了しました。<br>
            新しいパスワードでログインしてください。
        </p>

        <a th:href="@{/login}" class="login-btn">ログイン画面へ</a>
    </div>

</body>
</html>
