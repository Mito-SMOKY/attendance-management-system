<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワード再設定 - メールアドレス入力</title>
    
    <link rel="stylesheet" th:href="@{/css/common/parts.css}">
    <link rel="stylesheet" th:href="@{/css/login/loginForgot.css}">
</head>
<body>

    <div class="header-container">
        <div th:replace="~{fragments/_parts :: main-header}"></div>
    </div>

    <div class="container">
        <div class="backbutton-container">
            <div th:replace="~{fragments/_parts :: backButton(url='/login')}"></div>
        </div>

        <div style="clear: both;"></div>

        <h2 class="system-title">出欠管理システム</h2>

        <p class="instruction">
            ワンタイムパスワードを送信するメールアドレスを入力してください
        </p>

        <form th:action="@{/password/send-otp}" method="post">
            <div class="input-group">
                <label class="input-label">メールアドレス</label>
                <input type="text" name="email" class="input-field" placeholder="メールアドレス" required>
            </div>
            
            <div th:if="${error}" class="error-msg">
                <p th:text="${error}"></p>
            </div>

            <div>
                <button type="submit" class="submit-btn">送信</button>
            </div>
        </form>
    </div>

</body>
</html>
