<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>書き込み確認 - 出欠管理システム</title>
    <link rel="stylesheet" th:href="@{/css/parts.css}">
    <link rel="stylesheet" th:href="@{/css/nfc/nfc.css}">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.1/css/all.css">
</head>
<body>
    <div class="header-container">
        <div th:if="${#authorization.expr('hasRole(''ADMIN'')')}">
            <div th:replace="~{fragments/_parts :: admin-header}"></div>
        </div>
        <div th:if="${#authorization.expr('hasRole(''SUPER_ADMIN'')')}">
            <div th:replace="~{fragments/_parts :: superadmin-header}"></div>
        </div>
    </div>

    <div class="backbutton-container">
        <div th:replace="~{fragments/_parts :: backButton(url='/admin/nfc/idle')}"></div>
    </div>

    <div class="writer-container">
        <div th:replace="~{fragments/_parts :: page-title-part('NFC登録')}"></div>

        <div id="view-input">
            <div class="instruction-text">
                書き込むデータを<br>入力してください
            </div>

            <div class="form-area">
                <div class="input-group">
                    <label class="input-label">カードID</label>
                    <input type="text" id="input-card-id" class="text-input" readonly th:value="${cardId}">
                </div>

                <div class="input-group">
                    <label class="input-label">学籍番号</label>
                    <input type="text" id="input-user-id" class="text-input" placeholder="例: 2321001" th:value="${userId}" autocomplete="off">
                </div>

                <div class="input-group">
                    <label class="input-label">氏名</label>
                    <input type="text" id="input-user-name" class="text-input" readonly placeholder="番号を入力すると表示されます">
                </div>
                
                <div class="action-area">
                    <button type="button" id="btn-auth" class="auth-btn">
                        書き込み
                    </button>
                </div>
            </div>
        </div>

        <div id="view-loading" class="spinner-container hidden">
            <div class="spinner"></div>
            <p>カードへ書き込み中...</p>
        </div>
    </div>

    <script th:src="@{/js/nfc_confirm.js}"></script>
</body>
</html>
