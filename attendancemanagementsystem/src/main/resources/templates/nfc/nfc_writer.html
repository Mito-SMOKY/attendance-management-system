<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC書き込み</title>
    
    <link rel="stylesheet" th:href="@{/css/parts.css}">
    <link rel="stylesheet" th:href="@{/css/nfc/writer.css}">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="header-container">
        <div th:replace="~{fragments/_parts :: header(title='出欠管理システム')}"></div>
    </div>
    
    <div class="backbutton-container">
        <div th:replace="~{fragments/_parts :: backButton(url='/admin/timeTableList2')}"></div>
    </div>

    <div class="writer-container">
        
        <div class="instruction-text">
            書き込むデータを入力して<br>
            ください
        </div>

        <form action="#" method="post" class="form-area">
            
            <div class="input-group">
                <label class="input-label">カードID</label>
                <input type="text" class="text-input" name="cardId" placeholder="XXXXXXXX">
            </div>

            <div class="input-group">
                <label class="input-label">学籍番号</label>
                <input type="text" class="text-input" name="studentId" placeholder="2321001">
            </div>

            <div class="action-area">
                <button type="submit" class="auth-btn">
                    確定して<br>認証
                </button>
            </div>

        </form>

    </div>

</body>
</html>
