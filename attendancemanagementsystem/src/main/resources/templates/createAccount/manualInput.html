<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>手動登録</title>
    <link rel="stylesheet" th:href="@{/css/parts.css}">
    <link rel="stylesheet" th:href="@{/css/createAccount/manualInput.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
      
    </style>
  </head>
  <body>

    <div class="header-container">
        <div th:if="${#authorization.expr('hasRole(''ADMIN'')')}">
            <div th:replace="~{fragments/_parts :: admin-header}"></div>
        </div>
        <div th:if="${#authorization.expr('hasRole(''SUPER_ADMIN'')')}">
            <div th:replace="~{fragments/_parts :: superadmin-header}"></div>
        </div>
    </div>

    <div class="backbutton-container">
        <div th:replace="~{fragments/_parts :: backButton(url='/admin/accountHome')}"></div>
    </div>

    <h1>手動でのアカウント登録</h1>
    <p>登録したい学生の情報を入力してください。</p>

    <form th:action="@{/admin/saveManualAccounts}" method="post">
      
      <div class="batch-setting">
        <h3>基本設定（全員に適用）</h3>
        <div class="input-row">
          <label>リスト名:</label>
          <input
            type="text"
            name="dataListName"
            placeholder="例: 2025年度新入生"
            required
          />
        </div>

        <div class="input-row">
          <label>年度:</label>
          <input
            type="number"
            name="academicYear"
            placeholder="2025"
            value="2025"
            required
          />
        </div>

        <div class="input-row">
          <label>学年:</label>
          <select name="grade">
            <option value="1">1年</option>
            <option value="2">2年</option>
            <option value="3">3年</option>
          </select>
        </div>

        <div class="input-row">
          <label>学科・クラス:</label>
          <select name="departmentId">
            <option
              th:each="dept : ${departmentList}"
              th:value="${dept.departmentId}"
              th:text="${(dept.major != null ? dept.major.majorName : '(学科不明)') + ' : ' + dept.className}"
            >
              情報システム学科 : Aクラス
            </option>
          </select>
        </div>
      </div>

      <div id="account-container">
        <div class="input-group">
          <h3>No.1</h3>
          <div class="input-row">
            <label>ログインID</label>
            <input
              type="text"
              name="accounts[0].studentNumber"
              placeholder="ST001"
              required
            />
          </div>
          <div class="input-row">
            <label>氏名</label>
            <input
              type="text"
              name="accounts[0].name"
              placeholder="山田 太郎"
              required
            />
          </div>
          <div class="input-row">
            <label>パスワード</label>
            <input
              type="text"
              name="accounts[0].password"
              placeholder="初期パスワード"
              required
            />
          </div>
        </div>
      </div>

      <button type="button" class="btn btn-add" onclick="addAccount()">
        ＋ 枠を追加
      </button>
      <button type="button" class="btn btn-remove" onclick="removeAccount()">
        － 最後の枠を削除
      </button>

      <br />

      <div class="checkbox-container">
        <input type="checkbox" id="dl-check" name="downloadCsv" value="true" checked>
        <label for="dl-check">登録完了後にCSVファイルをダウンロードする</label>
      </div>

      <button type="submit" class="btn btn-save">登録実行</button>
    </form>

    <script th:src="@{/js/createAccount/manualInput.js}"></script>
  </body>
</html>
