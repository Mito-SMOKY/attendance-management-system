<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>受講情報詳細</title>
    <link rel="stylesheet" th:href="@{/css/parts.css}">
    <link rel="stylesheet" th:href="@{/css/admin/studentSubjectDetail.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <input type="hidden" id="studentIdHidden" th:value="${detail.studentId}">

    <div class="header-container">
        <div th:if="${#authorization.expr('hasRole(''ADMIN'')')}">
            <div th:replace="~{fragments/_parts :: admin-header}"></div>
        </div>
        <div th:if="${#authorization.expr('hasRole(''SUPER_ADMIN'')')}">
            <div th:replace="~{fragments/_parts :: superadmin-header}"></div>
        </div>
    </div>
    
    <div class="backbutton-container">
        <div th:replace="~{fragments/_parts :: backButton(url=${backUrl})}"></div>
    </div>

    <div class="main-container">
        
        <div th:replace="~{fragments/_parts :: page-title-part('受講情報')}"></div>

        <div class="content-wrapper">
            
            <div class="left-panel">
                
                <div class="student-name-display">
                    <span th:text="${detail.studentName} + ' さん'"></span>
                </div>

                <table class="info-table">
                    <tr>
                        <th>教科名</th>
                        <td class="subject-name">
                            <a th:href="@{/admin/subjectInfo(departmentId=${detail.departmentId}, subjectId=${detail.subjectId}, grade=${detail.grade}, from='student', fromStudentId=${detail.studentId})}"
                               style="text-decoration: none; border-bottom: 1px solid transparent; transition: border-bottom 0.3s;">
                               <span th:text="${detail.subjectName}"></span>
                               <i class="fa-solid fa-arrow-up-right-from-square" style="font-size: 0.9em; margin-left: 5px;"></i>
                            </a>
                        </td>
                    </tr>
                    <tr>
                        <th>教室</th>
                        <td th:text="${detail.classroomName}"></td>
                    </tr>
                    <tr>
                        <th>担当教員</th>
                        <td th:text="${detail.teacherName}"></td>
                    </tr>
                    <tr>
                        <th>実施コマ数</th>
                        <td th:text="${detail.totalClasses} + 'コマ'"></td>
                    </tr>
                    <tr>
                        <th>履修状況</th>
                        <td th:text="${detail.completedCount}"></td>
                    </tr>
                    <tr>
                        <th>現在の出席率</th>
                        <td class="rate-highlight" th:text="${detail.attendanceRate}"></td>
                    </tr>
                </table>
            </div>

            <div class="right-panel">
                
                <div class="button-group">
                    <button type="button" class="edit-btn" id="editBtn" onclick="toggleEditMode()">編集</button>
                    <button type="button" class="save-btn" id="saveBtn" onclick="saveChanges()" style="display:none;">保存</button>
                    <button type="button" class="cancel-btn" id="cancelBtn" onclick="cancelEdit()" style="display:none;">キャンセル</button>
                </div>

                <div class="summary-area">
                    <table class="summary-table">
                        <thead>
                            <tr>
                                <th>出席</th>
                                <th>欠席</th>
                                <th>遅刻</th>
                                <th>早退</th>
                                <th>出停</th>
                                <th>公欠</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td th:text="${detail.attendanceCount}"></td>
                                <td th:text="${detail.absenceCount}"></td>
                                <td th:text="${detail.lateCount}"></td>
                                <td th:text="${detail.earlyLeaveCount}"></td>
                                <td th:text="${detail.suspensionCount}"></td>
                                <td th:text="${detail.publicAbsenceCount}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="detail-table-wrapper">
                    <table class="schedule-table" id="scheduleTable">
                        <thead>
                            <tr>
                                <th>日付</th>
                                <th>一限目</th>
                                <th>二限目</th>
                                <th>三限目</th>
                                <th>四限目</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(detail.dailyRecords)}">
                                <td colspan="5">データがありません</td>
                            </tr>
                            
                            <tr th:each="row : ${detail.dailyRecords}">
                                <td th:text="${row.dateStr}"></td>
                                <td th:each="periodIdx : ${#numbers.sequence(1, 4)}"
                                    class="editable-cell"
                                    th:with="statusMark=${periodIdx == 1 ? row.period1 : (periodIdx == 2 ? row.period2 : (periodIdx == 3 ? row.period3 : row.period4))}"
                                    th:data-date="${row.dateStr}"
                                    th:data-period="${periodIdx}"
                                    th:data-original-mark="${statusMark}"
                                    th:text="${statusMark}"
                                    th:classappend="${
                                        statusMark == null ? '' :
                                        (statusMark == '〇' || statusMark == '○' ? 'status-present' : 
                                        (statusMark == '✕' || statusMark == '×' || statusMark == 'x' ? 'status-absence' : 
                                        (statusMark == '△' ? 'status-late' : 
                                        (statusMark == '早' ? 'status-early' : 
                                        (statusMark == '停' ? 'status-suspend' : 
                                        (statusMark == '公' ? 'status-public' : ''))))))
                                    }">-</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <script th:src="@{/js/admin/studentSubjectDetail.js}"></script>
</body>
</html>
