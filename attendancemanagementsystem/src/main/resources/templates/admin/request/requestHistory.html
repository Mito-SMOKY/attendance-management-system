<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">申請履歴</title>
    
    <link rel="stylesheet" th:href="@{/css/parts.css}">
    <link rel="stylesheet" th:href="@{/css/admin/requestHistory.css}">
    <link href="https://use.fontawesome.com/releases/v6.2.0/css/all.css" rel="stylesheet">
</head>
<body>

    <div class="header-container">
        <div th:replace="~{fragments/_parts :: admin-header}"></div>
    </div>
    
    <div class="backbutton-container">
        <div th:replace="~{fragments/_parts :: backButton(url='/admin/request/menu')}"></div>
    </div>

    <main class="main-container">
        
        <div class="page-title">申請履歴</div>
        
        <div th:if="${#lists.isEmpty(historyList)}" style="text-align: center; padding: 40px; color: #666;">
            <i class="fa-regular fa-folder-open" style="font-size: 3em; margin-bottom: 15px;"></i>
            <p>申請履歴はありません。</p>
        </div>

        <table class="history-table" th:unless="${#lists.isEmpty(historyList)}">
            <thead>
                <tr>
                    <th>申請日</th>
                    <th>申請種別</th>
                    <th>申請先 (承認者)</th>
                    <th>状態</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="req : ${historyList}">
                    <td th:text="${req.createdAt}"></td>
                    <td th:text="${req.type}"></td>
                    <td th:text="${req.approverName}"></td>
                    <td>
                        <span class="status-badge"
                            th:classappend="${
                                req.statusCode == 1 ? 'status-pending' : 
                                req.statusCode == 2 ? 'status-approved' : 
                                req.statusCode == 3 ? 'status-rejected' : ''
                            }"
                            th:text="${req.status}">
                        </span>
                    </td>
                    <td>
                        <a th:href="@{/admin/request/history/{id}(id=${req.requestId})}" class="detail-btn">
                            詳細
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>

        <div class="pagination" th:if="${totalPages > 1}">
    
            <a th:href="@{/admin/request/history(page=${currentPage - 1})}"
            class="page-link"
            th:classappend="${currentPage == 0} ? 'disabled'">＜</a>

            <th:block th:with="start=${currentPage - 2 < 0 ? 0 : currentPage - 2},
                            end=${currentPage + 2 > totalPages - 1 ? totalPages - 1 : currentPage + 2}">
                
                <th:block th:with="finalStart=${end - start < 4 and end == totalPages - 1 ? (end - 4 < 0 ? 0 : end - 4) : start},
                                finalEnd=${end - start < 4 and start == 0 ? (start + 4 > totalPages - 1 ? totalPages - 1 : start + 4) : end}">

                    <th:block th:each="i : ${#numbers.sequence(finalStart, finalEnd)}">
                        <a th:href="@{/admin/request/history(page=${i})}"
                        class="page-link"
                        th:classappend="${i == currentPage} ? 'active'"
                        th:text="${i + 1}">1</a>
                    </th:block>

                </th:block>
            </th:block>

            <a th:href="@{/admin/request/history(page=${currentPage + 1})}"
            class="page-link"
            th:classappend="${currentPage == totalPages - 1} ? 'disabled'">＞</a>
            
        </div>

    </main>

</body>
</html>
