<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="_csrf" th:content="${_csrf != null} ? ${_csrf.token} : ''"/>
    <meta name="_csrf_header" th:content="${_csrf != null} ? ${_csrf.headerName} : ''"/>
    
    <meta name="submit-url" th:content="${submitUrl}"/>
    
    <meta name="is-super-admin" th:content="${#authorization.expression('hasRole(''SUPER_ADMIN'')')}"/>

    <title th:text="${pageTitle}">確認画面</title>
    
    <link rel="stylesheet" th:href="@{/css/parts.css}">
    <link rel="stylesheet" th:href="@{/css/admin/requestDeleteConfirm.css}">
    <link href="https://use.fontawesome.com/releases/v6.2.0/css/all.css" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.32/dist/sweetalert2.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.32/dist/sweetalert2.all.min.js"></script>
</head>
<body>

    <div class="header-container">
        <div th:if="${#authorization.expression('hasRole(''SUPER_ADMIN'')')}">
            <div th:replace="~{fragments/_parts :: superadmin-header}"></div>
        </div>
        <div th:unless="${#authorization.expression('hasRole(''ADMIN'')')}">
            <div th:replace="~{fragments/_parts :: admin-header}"></div>
        </div>
    </div>
    
    <div class="backbutton-container">
        <div th:replace="~{fragments/_parts :: backButton(url='/admin/request/select?mode=' + ${mode})}"></div>
    </div>

    <main class="confirm-container">
        
        <h2 class="main-title" th:text="${pageTitle}">生徒削除</h2>
        
        <div class="content-box">
            <h3 class="sub-title">以下の生徒のアカウントを削除しますか？</h3>
            
            <div class="selection-info">
                選択数: <span th:text="${studentList.size()}">0</span> 名
            </div>

            <div class="table-scroll-wrapper">
                <table class="confirm-table">
                    <thead>
                        <tr>
                            <th>選択</th>
                            <th>状態</th>
                            <th>ログインID</th>
                            <th>学科・コース</th>
                            <th>学年</th>
                            <th>クラス</th>
                            <th>氏名</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="student : ${studentList}" 
                            th:classappend="${student.userId == null} ? 'disabled' : ''"
                            th:data-id="${student.userId}">
                            
                            <td class="checkbox-cell">
                                <input type="checkbox" class="confirm-checkbox" 
                                    th:value="${student.userId}" checked>
                            </td>
                            <td th:text="${student.statusText}"></td>
                            <td th:text="${student.loginId}"></td>
                            <td th:text="${student.department}" class="align-left"></td>
                            <td th:text="${student.grade}"></td>
                            <td th:text="${student.classroom}"></td>
                            <td th:text="${student.name}" class="align-left"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(studentList)}">
                            <td colspan="7">対象データがありません</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="input-area" style="margin-bottom: 20px;" 
                 th:unless="${#authorization.expression('hasRole(''SUPER_ADMIN'')')}">
                <label for="approver" style="font-weight: bold; display: block; margin-bottom: 5px;">
                    申請先（承認者）<span style="color: red; font-size: 12px; margin-left: 5px;">必須</span>
                </label>
                <select id="approver" class="remarks-input" style="height: 40px; border: 2px solid #539DA4;">
                    <option value="" disabled selected>承認者を選択してください</option>
                    <option th:each="admin : ${approverList}" 
                            th:value="${admin.userId}" 
                            th:text="${admin.name}">
                        管理者名
                    </option>
                </select>
                <p th:if="${#lists.isEmpty(approverList)}" style="color: red; font-size: 13px; margin-top: 5px;">
                    ※申請可能な上位管理者が存在しません。
                </p>
            </div>

            <div class="remarks-area">
                <label for="remarks">備考</label>
                <textarea id="remarks" class="remarks-input" 
                        th:placeholder="${confirmMessage}"></textarea>
            </div>

            <div class="action-area">
                <button type="button" id="confirmBtn" class="confirm-btn">確 定</button>
            </div>
            
        </div>
    </main>

    <div id="passwordModal" class="modal-overlay">
        <div class="modal-content">
            <h3>管理者認証</h3>
            <p>削除処理を実行するためにパスワードを入力してください。<br><span style="color:red; font-size:0.9em;">※この操作は取り消せません</span></p>
            <input type="password" id="actionPassword" placeholder="パスワード" class="password-input">
            <div class="modal-actions">
                <button type="button" id="cancelModalBtn" class="modal-btn cancel">キャンセル</button>
                <button type="button" id="submitModalBtn" class="modal-btn submit">実行（削除）</button>
            </div>
        </div>
    </div>

    <script th:src="@{/js/admin/requestDeleteConfirm.js}"></script>

</body>
</html>
