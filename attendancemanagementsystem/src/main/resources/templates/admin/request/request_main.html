<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者用-申請画面</title>
    
    <link rel="stylesheet" th:href="@{/css/parts.css}">
    <link rel="stylesheet" th:href="@{/css/common/request.css}">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <div class="header-container">
        <div th:replace="~{fragments/_parts :: admin-header}"></div>
    </div>

    <div class="backbutton-container">
        <div th:replace="~{fragments/_parts :: historyBackButton}"></div>
    </div>

    <div class="content-wrapper">
        <div class="action-buttons">
            <a th:href="@{url}"  class="ghost-button">生徒削除画面</a>
            <a th:href="@{url}"  class="ghost-button">ステータス変更</a>
            <a th:href="@{url}"  class="ghost-button">申請履歴</a>
        </div>
    </div>

</body>
</html>
