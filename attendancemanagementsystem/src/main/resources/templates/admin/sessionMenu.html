<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>session</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" th:href="@{/css/admin/parts.css}">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.1/css/all.css">
</head>

<body>

   <div class="header-container">
        <div th:replace="~{fragments/_parts :: header(title='出欠管理システム')}"></div>
    </div>
    
    
    <div class="backbutton-container">
        <div th:replace="~{fragments/_parts :: backButton(url='/timetable')}"></div>
    </div> 

    <div class="container">
        
        <div class="apply-btn-container">
            <button class="btn-apply">適用</button>
        </div>

        <table class="input-table">
            <tr>
                <th>教科名</th>
                <td>
                    <select>
                        <option>システム構築</option>
                        <option>プログラミング</option>
                    </select>
                </td>
            </tr>
            <tr>
                <th>コース</th>
                <td>
                    <select>
                        <option>SE・マスター</option>
                        <option>IT・エキスパート</option>
                    </select>
                </td>
            </tr>
            <tr>
                <th>教室</th>
                <td>
                    <select>
                        <option>231</option>
                        <option>232</option>
                    </select>
                </td>
            </tr>
            <tr>
                <th>授業時間</th>
                <td>
                    <input type="text" class="time-input">
                    <span> : </span>
                    <input type="text" class="time-input">
                </td>
            </tr>
            <tr>
                <th>日付</th>
                <td>
                    <input type="text" placeholder="YYYY/MM/DD">
                </td>
            </tr>
        </table>

        <div class="footer-action">
            <button class="btn-start-session">セッションを開始</button>
        </div>
        
    </div>

</body>
</html>
