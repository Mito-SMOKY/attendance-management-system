<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>授業情報</title>
    
    <link rel="stylesheet" th:href="@{/css/parts.css}">
    <link rel="stylesheet" th:href="@{/css/admin/classInfo.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="header-container">
        <div th:if="${#authorization.expr('hasRole(''ADMIN'')')}">
            <div th:replace="~{fragments/_parts :: admin-header}"></div>
        </div>
        <div th:if="${#authorization.expr('hasRole(''SUPER_ADMIN'')')}">
            <div th:replace="~{fragments/_parts :: superadmin-header}"></div>
        </div>
    </div>
    <div class="backbutton-container">
        <div th:replace="~{fragments/_parts :: backButton(url=${backUrl})}"></div>
    </div>
    
    <div class="info-container">
        
        <div th:replace="~{fragments/_parts :: page-title-part('授業情報')}"></div>
        
        <input type="hidden" id="sessionId" th:value="${classInfo.sessionId}">

        <div class="main-container">

            <div class="session-info-card" id="sessionInfoArea">

                <div class="section-header">
                    <h2 class="atten-header">基本情報</h2>
                    <div class="controls-card" style="justify-content: flex-end; display: flex; margin-bottom: 10px;">
                        <button id="editSessionBtn" class="edit-btn">授業情報の編集</button>
                        <button id="saveSessionBtn" class="save-btn" style="display:none;">保存</button>
                        <button id="cancelSessionBtn" class="cancel-btn" style="display:none;">キャンセル</button>
                    </div>
                </div>

                <div class="session-info-flex">

                <div class="info-card">
                    <div class="info-label">教科名</div>
                    <div class="info-value">
                        <div id="viewSubject">
                            <a class="subject-link" th:href="@{/admin/subjectInfo(departmentId=${classInfo.departmentId}, subjectId=${classInfo.currentSubjectId}, grade=${classInfo.grade}, from='classInfo', fromSessionId=${classInfo.sessionId})}"
                            th:text="${classInfo.subjectName}">
                            </a>
                            <a class="subject-link-icon" th:href="@{/admin/subjectInfo(departmentId=${classInfo.departmentId}, subjectId=${classInfo.currentSubjectId}, grade=${classInfo.grade}, from='classInfo', fromSessionId=${classInfo.sessionId})}">
                                <i class="fa-solid fa-arrow-up-right-from-square"></i>
                            </a>
                        </div>
                        </div>
                </div>

                <div class="info-card">
                    <div class="info-label">担当教員</div>
                    <div class="info-value">
                        <span class="session-view" th:text="${classInfo.teacherName}">山田 太郎</span>
                        <div class="session-edit" style="display:none;">
                            <select id="editTeacher" class="form-select">
                                <option th:each="t : ${classInfo.allTeachers}"
                                        th:value="${t.userId}"
                                        th:text="${t.name}"
                                        th:selected="${t.userId == classInfo.currentTeacherId}">
                                </option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="info-card">
                    <div class="info-label">実施日</div>
                    <div class="info-value">
                        <span class="session-view" th:text="${classInfo.dateText}"></span>
                        <div class="session-edit" style="display:none;">
                            <input type="date" id="editDate" class="form-input" th:value="${classInfo.currentDateValue}">
                        </div>
                    </div>
                </div>

                <div class="info-card">
                    <div class="info-label">時限</div>
                    <div class="info-value">
                        <span class="session-view" th:text="${classInfo.timeSlotText}"></span>
                        <div class="session-edit" style="display:none;">
                            <select id="editTimeSlot" class="form-select">
                                <option th:each="slot : ${classInfo.allTimeSlots}"
                                        th:value="${slot.slotId}"
                                        th:text="${slot.startTime + ' ~'}"
                                        th:selected="${slot.slotId == classInfo.currentTimeSlotId}">
                                </option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="info-card">
                    <div class="info-label">教室</div>
                    <div class="info-value">
                        <span class="session-view" th:text="${classInfo.classroomName}">101教室</span>
                        <div class="session-edit" style="display:none;">
                            <select id="editClassroom" class="form-select">
                                <option th:each="room : ${classInfo.allClassrooms}"
                                        th:value="${room.classroomId}"
                                        th:text="${room.classroomName}"
                                        th:selected="${room.classroomId == classInfo.currentClassroomId}">
                                </option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="info-card">
                    <div class="info-label">クラス</div>
                    <div class="info-value">
                        <span th:text="${classInfo.courseName}">情報工学科 1年</span>
                    </div>
                </div>

            </div>
            </div>

            <div class="student-list-section">
                <div class="section-header">
                    <h2 class="atten-header">出席簿</h2>
                    <div>
                        <button id="editStudentBtn" class="edit-btn">出欠の編集</button>
                        <button id="saveStudentBtn" class="save-btn" style="display:none;">保存</button>
                        <button id="cancelStudentBtn" class="cancel-btn" style="display:none;">キャンセル</button>
                    </div>
                </div>
                
                <div class="table-wrapper">
                    <table class="student-table" id="studentTable">
                        <thead>
                            <tr>
                                <th>番号</th>
                                <th>学年</th>
                                <th>クラス</th>
                                <th>氏名</th>
                                <th>出欠</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="student : ${classInfo.students}" th:attr="data-user-id=${student.userId}">
                                <td th:text="${student.studentNumber}"></td>
                                <td th:text="${student.grade}"></td>
                                <td th:text="${student.className}"></td>
                                <td th:text="${student.name}"></td>
                                <td>
                                    <span class="status-view" th:text="${student.statusLabel}" th:classappend="${student.statusStyle}">-</span>
                                    <select class="status-select">
                                        <option value="" th:selected="${student.currentStatusId == null}">未登録</option>
                                        <th:block th:each="st : ${classInfo.allStatuses}">
                                            <option th:value="${st.statusId}" th:text="${st.statusName}" th:selected="${student.currentStatusId == st.statusId}"></option>
                                        </th:block>
                                    </select>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(classInfo.students)}"><td colspan="5">生徒がいません。</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/admin/classInfo.js}"></script>
</body>
</html>
