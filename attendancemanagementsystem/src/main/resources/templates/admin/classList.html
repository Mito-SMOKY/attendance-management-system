<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>授業一覧</title>
    
    <link rel="stylesheet" th:href="@{/css/parts.css}">
    <link rel="stylesheet" th:href="@{/css/admin/adminlist.css}">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="header-container">
        <div th:replace="~{fragments/_parts :: admin-header}"></div>
    </div>

    <div class="backbutton-container">
        <div th:replace="~{fragments/_parts :: backButton(url='/admin/timetable')}"></div>
    </div>

    <div class="list-container">
        
        <h1 class="page-title">授業一覧</h1>

        <div class="controls-area">

           
            <form th:action="@{/admin/dailyClassList}" method="get" class="search-form-3">
                <input  type="text" 
                        name="date" 
                        id="dateInput"
                        required 
                        maxlength="8" 
                        pattern="\d{8}" 
                        autocomplete="off"
                        title="数字8桁（YYYYMMDD）で入力してください"
                        th:value="${viewData.searchDate}" 
                        placeholder="yyyyMMdd">
                
                <input type="hidden" name="userId" th:value="${currentUserId}">
                
                <button type="submit" aria-label="検索"></button>
            </form>
            
        </div>
        
        <div class="date-header" th:text="${viewData.headerDate}"></div>

        <div class="table-wrapper">
            <table class="class-list-table">
                <thead>
                    <tr>
                        <th class="period-header col-period">時限</th>
                        <th class="subject-header col-subject">教科</th>
                        <th class="classroom-header col-classroom">教室</th>
                    </tr>
                </thead>
                <tbody>

                    <tr th:each="entry : ${viewData.periods}" th:with="p=${entry.value}">
                        <td class="period-cell" th:text="${entry.key}">1</td>
                        
                        <td class="subject-cell">
                            <th:block th:if="${p != null && p.hasClass}">
                                <a th:href="@{/admin/subject/detail/{id}(id=${p.subjectId})}" 
                                class="subject-link"
                                th:text="${p.subjectName}">教科名</a>
                            </th:block>
                            <span th:if="${p == null || !p.hasClass}" style="color:#ccc;">授業データがありません</span>
                        </td>

                        <td class="classroom-cell">
                            <span th:text="${p != null && p.hasClass ? p.classroomName : '-'}">教室名</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

    <script  th:src="@{/js/admin/classList.js}"></script>

</body>
</html>
