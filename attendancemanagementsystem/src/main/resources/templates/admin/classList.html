<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>授業一覧</title>
    
    <link rel="stylesheet" th:href="@{/css/parts.css}">
    <link rel="stylesheet" th:href="@{/css/admin/adminlist.css}">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="header-container">
        <div th:replace="~{fragments/_parts :: admin-header}"></div>
    </div>

    <div class="backbutton-container">
        <div th:replace="~{fragments/_parts :: backButton(url='/admin/timetable')}"></div>
    </div>

    <div class="list-container">
        
        <h1 class="page-title">授業一覧</h1>

        <div class="controls-area">
            
            <div class="search-section">
                <form th:action="@{/admin/dailyClassList}" method="get" class="search-form-row">
                    <input type="text" name="date" class="search-input" 
                           th:value="${viewData.searchDate}" placeholder="yyyyMMdd">
                    <input type="hidden" name="userId" value="admin001">
                    <button type="submit" class="search-btn">
                        <i class="fa-solid fa-magnifying-glass"></i> 検索
                    </button>
                </form>
            </div>
            
        </div>
        
        <div class="date-header" th:text="${viewData.headerDate}">
            2024年 8月 14日 (水)
        </div>

        <div class="table-wrapper">
            <table class="class-list-table">
                <thead>
                    <tr>
                        <th class="period-header">時限</th>
                        <th class="subject-header">教科 / 教室</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="entry : ${viewData.periods}">
                        
                        <td class="period-cell" th:text="${entry.key}">1</td>
                        
                        <td class="subject-cell" th:with="p=${entry.value}">
                            
                            <th:block th:if="${p != null && p.hasClass}">
                                <a th:href="@{/admin/subject/detail/{id}(id=${p.subjectId})}" 
                                class="subject-link"
                                th:text="${p.subjectName}">教科名</a>
                                
                                <br> <span class="room-name" th:text="${p.classroomName}">教室名</span>
                            </th:block>
                            
                            <span th:if="${p == null || !p.hasClass}" style="color:#ccc;">-</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

</body>
</html>
