<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作成履歴</title>
    
    <link rel="stylesheet" th:href="@{/css/parts.css}">
    <link rel="stylesheet" th:href="@{/css/admin/adminAccountHistory.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="header-container">
        <div th:if="${#authorization.expr('hasRole(''ADMIN'')')}">
            <div th:replace="~{fragments/_parts :: admin-header}"></div>
        </div>
        <div th:if="${#authorization.expr('hasRole(''SUPER_ADMIN'')')}">
            <div th:replace="~{fragments/_parts :: superadmin-header}"></div>
        </div>
    </div>

    <div class="backbutton-container">
        <div th:replace="~{fragments/_parts :: backButton(url='/admin/accountManage')}"></div>
    </div>

    <div class="history-container">
        
        <div class="page-title-wrapper">
            <h1 class="page-title">作成履歴</h1>
        </div>

        <div class="table-wrapper">
            <table class="history-table">
                <colgroup>
                    <col style="width: 25%;"> <col style="width: 25%;"> <col style="width: 50%;"> </colgroup>
                <thead>
                    <tr>
                        <th>作成日時</th>
                        <th>作成者</th>
                        <th>データリスト名</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="history : ${historyList}">
                        <td th:text="${history.createdAt}">2025-03-01</td>
                        <td th:text="${history.creatorName}">**********</td>
                        <td>
                            <a href="#" class="data-link" th:text="${history.dataListName}">2025年度_SE_M_1_AA</a>
                        </td>
                    </tr>
                    
                    <tr th:if="${historyList == null or historyList.isEmpty()}">
                        <td colspan="3" style="text-align: center; padding: 20px;">データがありません。</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

</body>
</html>
