<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仮アカウント一覧</title>
    
    <link rel="stylesheet" th:href="@{/css/parts.css}">
    <link rel="stylesheet" th:href="@{/css/admin/adminAccountList.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="header-container">
        <div th:replace="~{fragments/_parts :: admin-header}"></div>
    </div>

    <div class="backbutton-container">
        <div th:replace="~{fragments/_parts :: backButton(url='/admin/accountHistory')}"></div>
    </div>

    <div class="list-container">
        
        <h1 class="page-title">仮アカウント一覧</h1>

        <div class="info-table-wrapper">
            <table class="info-table">
                <thead>
                    <tr>
                        <th>データリスト名</th>
                        <th>作成者</th>
                        <th>作成日時</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${dataListName != null}">
                        <td th:text="${dataListName}"></td>
                        <td th:text="${creatorName}"></td>
                        <td th:text="${createdAt}"></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="account-table-wrapper">
            <table class="account-table">
                <thead>
                    <tr>
                        <th class="col-name">名前</th>
                        <th class="col-student-id">学籍番号</th>
                        <th class="col-affiliation">所属ID</th>
                        <th class="col-password">仮パスワード</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="account : ${accountList}">
                        <td th:text="${account.name}"></td>
                        <td th:text="${account.studentId}"></td>
                        <td th:text="${account.affiliationId}"></td>
                        <td th:text="${account.password}"></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="button-area">
            <button type="button" class="action-btn export-btn" onclick="exportCsv()">ファイル出力</button>
            
            <a th:href="@{/admin/accountManage}" class="action-btn top-btn">アカウント作成TOPへ</a>
        </div>

    </div>

    <script>
        function exportCsv() {
            // ファイル出力処理
            alert("ファイル出力処理を実行します");
            // location.href = '/admin/export-accounts';
        }
    </script>

</body>
</html>
