<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ファイルアップロード</title>
    
    <link rel="stylesheet" th:href="@{/css/parts.css}">
    <link rel="stylesheet" th:href="@{/css/admin/adminCsvUpload.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="header-container">
        <div th:if="${#authorization.expr('hasRole(''ADMIN'')')}">
            <div th:replace="~{fragments/_parts :: admin-header}"></div>
        </div>
        <div th:if="${#authorization.expr('hasRole(''SUPER_ADMIN'')')}">
            <div th:replace="~{fragments/_parts :: superadmin-header}"></div>
        </div>
    </div>

    <div class="backbutton-container">
        <div th:replace="~{fragments/_parts :: backButton(url='/admin/accountManage')}"></div>
    </div>

    <div class="upload-container">
        
        <h1 class="page-title">ファイルアップロード</h1>

        <div class="description-area">
            <p>生徒名、所属、学籍番号を入力してCSVファイルを<br>アップロードするとユーザーの仮アカウントを作成します。</p>
        </div>

        <form id="uploadForm" method="post" enctype="multipart/form-data" th:action="@{/admin/upload-file}" class="upload-form">
            
            <div class="file-input-wrapper">
                <label for="csvFile" class="file-label-btn">ファイルを選択</label>
                <input type="file" id="csvFile" name="file" accept=".csv" class="file-input-hidden" onchange="updateFileName(this)">
            </div>

            <p id="errorMsg" style="color: red; font-weight: bold; margin-top: 10px; display: none;">
                ファイルを選択してください
            </p>

            <button type="submit" class="submit-btn">アップロード</button>

        </form>

    </div>

    <script>
        // ファイル名表示の更新と、エラーメッセージのクリア
        function updateFileName(input) {
            const display = document.getElementById('fileNameDisplay');
            const errorMsg = document.getElementById('errorMsg');

            if (input.files && input.files.length > 0) {
                display.textContent = input.files[0].name;
                // ファイルが選ばれたらエラーメッセージを消す
                errorMsg.style.display = 'none';
            } else {
                display.textContent = '選択されていません';
            }
        }

        // 送信時のチェック
        document.getElementById('uploadForm').addEventListener('submit', function(event) {
            const input = document.getElementById('csvFile');
            const errorMsg = document.getElementById('errorMsg');

            // ファイルが選択されていない場合
            if (!input.files || input.files.length === 0) {
                // 送信をキャンセル
                event.preventDefault();
                // エラーメッセージを表示
                errorMsg.style.display = 'block';
            }
        });
    </script>

</body>
</html>
