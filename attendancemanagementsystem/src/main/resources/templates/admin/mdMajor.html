<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>学科マスタ</title>
    <link rel="stylesheet" th:href="@{/css/parts.css}" />
    <link rel="stylesheet" th:href="@{/css/admin/adminMdClassroom.css}" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <style>
      .master-tabs {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        border-bottom: 2px solid #ddd;
        padding-bottom: 10px;
      }
      .master-tab {
        padding: 10px 20px;
        background-color: #f0f0f0;
        border-radius: 5px 5px 0 0;
        text-decoration: none;
        color: #333;
        font-weight: bold;
      }
      .master-tab.active {
        background-color: #007bff;
        color: white;
      }
      .master-tab:hover {
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div class="header-container">
      <div th:replace="~{fragments/_parts :: admin-header}"></div>
    </div>
    <div class="backbutton-container">
      <div
        th:replace="~{fragments/_parts :: backButton(url='/admin/master-data')}"
      ></div>
    </div>

    <form th:action="@{/admin/master/major/save}" method="post" id="masterForm">
      <div class="classroom-container">
        <div class="master-tabs">
          <a th:href="@{/admin/master/major}" class="master-tab active"
            >① 学科登録</a
          >
          <a th:href="@{/admin/master/course}" class="master-tab"
            >② コース登録</a
          >
          <a th:href="@{/admin/master/department}" class="master-tab"
            >③ クラス(所属)登録</a
          >
        </div>

        <div class="page-header-wrapper">
          <h1 class="page-title">学科マスタ</h1>
        </div>
        <div
          th:if="${successMessage}"
          style="color: green; text-align: center; margin-bottom: 10px"
        >
          <span th:text="${successMessage}"></span>
        </div>
        <div
          th:if="${errorMessage}"
          style="color: red; text-align: center; margin-bottom: 10px"
        >
          <span th:text="${errorMessage}"></span>
        </div>

        <div class="filter-area">
          <button type="button" class="edit-btn" onclick="toggleEditMode()">
            編集
          </button>
        </div>

        <div class="error-message-area">
          <span id="errorMsgRequired" class="error-text" style="display: none"
            >※学科名は必須です。</span
          >
        </div>

        <div class="table-wrapper">
          <table class="classroom-table" id="majorTable">
            <thead>
              <tr>
                <th>学科名</th>
                <th style="width: 15%"></th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="major : ${majorList}">
                <input
                  type="hidden"
                  name="majorId"
                  th:value="${major.majorId}"
                />
                <td>
                  <span class="view-mode" th:text="${major.majorName}"></span>
                  <input
                    type="text"
                    class="form-input edit-mode"
                    style="display: none"
                    name="majorName"
                    th:value="${major.majorName}"
                    placeholder="学科名"
                  />
                </td>
                <td>
                  <button
                    type="button"
                    class="delete-btn"
                    onclick="deleteRow(this)"
                    style="display: none"
                  >
                    <i class="fa-solid fa-trash-can"></i>
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="add-btn-wrapper" style="display: none">
          <button type="button" class="add-row-btn" onclick="addMajorRow()">
            ＋
          </button>
        </div>
      </div>
    </form>

    <script>
      function toggleEditMode() {
        const body = document.body;
        const btn = document.querySelector(".edit-btn");
        const form = document.getElementById("masterForm");

        if (body.classList.contains("editing-mode")) {
          if (!validateData()) return;
          if (!confirm("変更を保存しますか？")) return;
          form.submit();
        } else {
          body.classList.add("editing-mode");
          btn.textContent = "適用";
          document
            .querySelectorAll(".view-mode")
            .forEach((el) => (el.style.display = "none"));
          document
            .querySelectorAll(".edit-mode")
            .forEach((el) => (el.style.display = "block"));
          document
            .querySelectorAll(".delete-btn")
            .forEach((el) => (el.style.display = "inline-block"));
          document.querySelector(".add-btn-wrapper").style.display = "block";
        }
      }

      function addMajorRow() {
        const tableBody = document.querySelector("#majorTable tbody");
        const newRow = document.createElement("tr");
        newRow.innerHTML = `
                <td><input type="text" class="form-input edit-mode" name="majorName" placeholder="学科名" style="display: block"></td>
                <td><button type="button" class="delete-btn" onclick="deleteRow(this)" style="display: inline-block"><i class="fa-solid fa-trash-can"></i></button></td>
            `;
        tableBody.appendChild(newRow);
      }

      function deleteRow(btn) {
        if (
          confirm(
            "この行を削除しますか？\n※使用中の学科は削除できない場合があります。"
          )
        )
          btn.closest("tr").remove();
      }

      function validateData() {
        const inputs = document.querySelectorAll('input[name="majorName"]');
        let hasError = false;
        document.getElementById("errorMsgRequired").style.display = "none";
        inputs.forEach((input) => {
          if (input.value.trim() === "") {
            input.classList.add("input-error");
            hasError = true;
          } else {
            input.classList.remove("input-error");
          }
        });
        if (hasError)
          document.getElementById("errorMsgRequired").style.display =
            "inline-block";
        return !hasError;
      }
    </script>
  </body>
</html>
