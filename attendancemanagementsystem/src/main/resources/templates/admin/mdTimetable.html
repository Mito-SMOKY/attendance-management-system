<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>時間割一括登録</title>
    <link rel="stylesheet" th:href="@{/css/parts.css}">
    <link rel="stylesheet" th:href="@{/css/admin/mdTimetable.css}">
</head>
<body>
    <div class="header-container">
        <div th:replace="~{fragments/_parts :: admin-header}"></div>
    </div>

    <div class="timetable-container">
        <h1 class="page-title">時間割登録 (週間テンプレート)</h1>

        <form th:action="@{/admin/mdTimetable/register}" th:object="${mdTimetableDto}" method="post">
            
            <div class="setting-area" style="background: #fff; padding: 20px; margin-bottom: 20px; border: 1px solid #ccc;">
                <div class="form-group">
                    <label>対象クラス(学科):</label>
                    <select th:field="*{departmentId}" class="filter-select" required>
                        <option value="">選択してください</option>
                        <option th:each="entry : ${departmentOptions}" 
                                th:value="${entry.key}" 
                                th:text="${entry.value}">
                            表示例: 【ITコース】情報科 / 2年 / A組
                        </option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>適用期間:</label>
                    <input type="date" th:field="*{startDate}" required> ～ 
                    <input type="date" th:field="*{endDate}" required>
                    <p style="font-size:0.8rem; color:#666;">※指定した期間のすべての曜日に、以下の時間割が反映されます。</p>
                </div>
            </div>

            <div class="table-wrapper">
                <table class="timetable-table">
                    <thead>
                        <tr>
                            <th>時限</th>
                            <th>月曜日</th>
                            <th>火曜日</th>
                            <th>水曜日</th>
                            <th>木曜日</th>
                            <th>金曜日</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="ts : ${timeSlots}">
                            
                            <td th:text="${ts.slotId} + '限'" style="font-weight:bold; background:#eee;"></td>
                            
                            <td th:each="day : ${ {'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY'} }">
                                <div class="cell-input">
                                    <select th:field="*{scheduleMap[__${ts.slotId}__]['__${day}__'].subjectId}">
                                        <option value="">(教科なし)</option>
                                        <option th:each="sub : ${subjectList}" th:value="${sub.subjectId}" th:text="${sub.subjectName}"></option>
                                    </select>
                                    
                                    <select th:field="*{scheduleMap[__${ts.slotId}__]['__${day}__'].classroomId}">
                                        <option value="">(教室未定)</option>
                                        <option th:each="room : ${classroomList}" th:value="${room.classroomId}" th:text="${room.classroomName}"></option>
                                    </select>
                                    
                                    <select th:field="*{scheduleMap[__${ts.slotId}__]['__${day}__'].userId}">
                                        <option value="">(教員未定)</option>
                                        <option th:each="teacher : ${teacherList}" th:value="${teacher.userId}" th:text="${teacher.name}"></option>
                                    </select>
                                </div>
                            </td>
                        </tr>
                    </tbody>                
                </table>
            </div>

            <div class="button-area" style="text-align: center; margin-top: 20px;">
                <button type="submit" class="btn-primary">この内容で一括登録する</button>
            </div>
        </form>
    </div>
</body>
</html>
