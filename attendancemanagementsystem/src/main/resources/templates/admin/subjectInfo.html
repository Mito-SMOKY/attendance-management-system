<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教科情報</title>
    
    <link rel="stylesheet" th:href="@{/css/parts.css}">
    <link rel="stylesheet" th:href="@{/css/admin/adminSubjectInfo.css}">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="header-container">
        <div th:replace="~{fragments/_parts :: header(title='出欠管理システム')}"></div>
    </div>
    
    <div class="backbutton-container">
        <div th:replace="~{fragments/_parts :: backButton(url='/subjectList')}"></div>
    </div>


    <div class="subject-info-container">
        
        <div class="page-header-wrapper">
            <h1 class="page-title">教科情報</h1>
        </div>

        <div class="main-content-grid">
            
            <div class="left-panel">
                
                <div class="info-block">
                    <div class="basic-info-header">
                        <button class="edit-btn" id="toggleEditBtn">編集</button>
                    </div>
                    <table class="detail-table">
                        <tbody>
                            <tr>
                                <th>講座名</th>
                                <td>
                                    <span class="view-mode" th:text="${subjectName}"></span>
                                    <select class="edit-mode" name="subjectName">
                                        <option value="">選択</option>
                                        <option th:each="item : ${subjectNameList}" 
                                                th:value="${item.val}" th:text="${item.label}"
                                                th:selected="${item.val == subjectName}"></option>
                                    </select>
                                </td>
                                <th>年度</th>
                                <td>
                                    <span class="view-mode" th:text="${year}"></span>
                                    <select class="edit-mode" name="year">
                                        <option value="">選択</option>
                                        <option th:each="y : ${yearList}" 
                                                th:value="${y}" th:text="${y}"
                                                th:selected="${y == year}"></option>
                                    </select>
                                </td>
                            </tr>
                            <tr>
                                <th>コース・学年</th>
                                <td>
                                    <span class="view-mode" th:text="${courseGrade}"></span>
                                    <select class="edit-mode" name="courseGrade">
                                        <option value=""></option>
                                        <option th:each="cg : ${courseGradeList}" 
                                                th:value="${cg.id}" th:text="${cg.name}"
                                                th:selected="${cg.name == courseGrade}"></option>
                                    </select>
                                </td>
                                <th>教科ID</th>
                                <td>
                                    <span class="view-mode" th:text="${subjectId}"></span>
                                    <select class="edit-mode" name="subjectId">
                                        <option value="">選択</option>
                                        <option th:each="sid : ${subjectIdList}" 
                                                th:value="${sid}" th:text="${sid}"
                                                th:selected="${sid == subjectId}"></option>
                                    </select>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="info-block">
                    <table class="detail-table">
                        <tbody>
                            <tr>
                                <th colspan="2">担当教員</th>
                                <td colspan="2">
                                    <span class="view-mode" th:text="${teacherName}"></span>
                                    <select class="edit-mode" name="teacherName">
                                        <option value="">教員を選択</option>
                                        <option th:each="teacher : ${teacherList}" 
                                                th:value="${teacher.id}" th:text="${teacher.name}"
                                                th:selected="${teacher.name == teacherName}"></option>
                                    </select>
                                </td>
                            </tr>
                            <tr>
                                <th colspan="2">単位数</th>
                                <td colspan="2">
                                    <span class="view-mode" th:text="${credits}"></span>
                                    <input type="text" class="edit-mode edit-input" name="credits" th:value="${credits}">
                                </td>
                            </tr>
                            <tr>
                                <th colspan="2">曜日・コマ</th>
                                <td colspan="2">
                                    <span class="view-mode" th:text="${schedule}"></span>
                                    <input type="text" class="edit-mode edit-input" name="schedule" th:value="${schedule}">
                                </td>
                            </tr>
                            <tr>
                                <th colspan="2">教室</th>
                                <td colspan="2">
                                    <span class="view-mode" th:text="${classroom}"></span>
                                    <select class="edit-mode" name="classroom">
                                        <option value="">教室を選択</option>
                                        <option th:each="room : ${classroomList}" 
                                                th:value="${room.id}" th:text="${room.name}"
                                                th:selected="${room.name == classroom}"></option>
                                    </select>
                                </td>
                            </tr>
                            <tr>
                                <th colspan="2">成績評価方法</th>
                                <td colspan="2">
                                    <div class="view-mode text-content" th:text="${gradingMethod}"></div>
                                    <textarea class="edit-mode edit-textarea" name="gradingMethod" th:text="${gradingMethod}"></textarea>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>

            <div class="right-panel">
                <div class="student-list-wrapper">
                    <table class="student-table">
                        <thead>
                            <tr>
                                <th>氏名</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="student : ${studentList}">
                                <td>
                                    <a th:href="@{/student/info/{id}(id=${student.id})}" 
                                       th:text="${student.name}" class="student-link"></a>
                                </td>
                            </tr>
                            
                            <tr th:if="${#lists.isEmpty(studentList)}">
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>

    </div>

   <script>
        document.getElementById('toggleEditBtn').addEventListener('click', function() {
            const viewModes = document.querySelectorAll('.view-mode');
            const editModes = document.querySelectorAll('.edit-mode');
            const isEditing = this.classList.contains('active-edit');

            if (!isEditing) {
                // === 編集モードへ ===
                viewModes.forEach(el => el.style.display = 'none');
                editModes.forEach(el => el.style.display = 'block'); 

                this.textContent = '保存';
                this.classList.add('active-edit');
                this.style.backgroundColor = '#539DA4';
                this.style.color = 'white';
            } else {
                // === 保存処理 (画面反映) ===
                
                editModes.forEach(input => {
                    // 親要素(td)を探す
                    const parent = input.parentElement;
                    const viewSpan = parent.querySelector('.view-mode');
                    
                    if (viewSpan) {
                        if (input.tagName === 'SELECT') {
                            // ▼▼▼ 修正箇所: プルダウンの処理 ▼▼▼
                            // valueが空（初期値の「選択してください」等）の場合は、表示を空にする
                            if (input.value === "") {
                                viewSpan.textContent = ""; 
                            } else {
                                // 値が入っている場合のみ、そのテキスト(例: "数学I")を表示
                                const selectedOption = input.options[input.selectedIndex];
                                if(selectedOption) viewSpan.textContent = selectedOption.text;
                            }
                        } else {
                            // input/textareaの場合
                            viewSpan.textContent = input.value;
                        }
                    }
                });

                // === 通常モードへ ===
                editModes.forEach(el => el.style.display = 'none');
                viewModes.forEach(el => el.style.display = 'block'); 

                this.textContent = '編集';
                this.classList.remove('active-edit');
                this.style.backgroundColor = '';
                this.style.color = '';
            }
        });
    </script>

</body>
</html>
