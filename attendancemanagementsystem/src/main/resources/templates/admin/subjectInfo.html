<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教科情報詳細</title>
    
    <link rel="stylesheet" th:href="@{/css/parts.css}">
    <link rel="stylesheet" th:href="@{/css/admin/subjectInfo.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="header-container">
        <div th:if="${#authorization.expr('hasRole(''ADMIN'')')}">
            <div th:replace="~{fragments/_parts :: admin-header}"></div>
        </div>
        <div th:if="${#authorization.expr('hasRole(''SUPER_ADMIN'')')}">
            <div th:replace="~{fragments/_parts :: superadmin-header}"></div>
        </div>
    </div>

    <div class="backbutton-container">
        <div th:replace="~{fragments/_parts :: backButton(url=${backUrl})}"></div>
    </div>

    <div class="main-container">
        
        <div th:replace="~{fragments/_parts :: page-title-part('教科情報')}"></div>

        <div class="control-bar">
            <div class="left-controls">
                
                <div class="search-wrapper">
                    <div class="search-input-container">
                        <i class="fa-solid fa-magnifying-glass search-icon"></i>
                        <input type="text" id="subjectSearchInput" class="search-input" placeholder="教科名で検索 (例: Java)">
                        <div id="searchLoader" class="loader" style="display: none;"></div>
                    </div>
                    <ul id="suggestionList" class="suggestion-list" style="display: none;"></ul>
                </div>

            </div>
        </div>

        <div class="info-grid">
            
            <div class="left-panel">
                <div class="info-card">
                    <h3 class="card-title">基本情報</h3>
                    <table class="detail-table">
                        <tr>
                            <th>講座名</th>
                            <td th:text="${info.subjectName}"></td>
                        </tr>
                        <tr>
                            <th>年度</th>
                            <td th:text="${info.fiscalYear}"></td>
                        </tr>
                        <tr>
                            <th>コース・学年</th>
                            <td th:text="${info.courseAndGrade}"></td>
                        </tr>
                        <tr>
                            <th>教科ID</th>
                            <td th:text="${info.displaySubjectId}"></td>
                        </tr>
                    </table>
                </div>

                <div class="info-card mt-20">
                    <h3 class="card-title">授業詳細</h3>
                    <table class="detail-table">
                        <tr>
                            <th>担当教員</th>
                            <td th:text="${info.teacherName}"></td>
                        </tr>
                        <tr>
                            <th>コマ数</th>
                            <td th:text="${info.credits} + 'コマ'"></td>
                        </tr>
                        <tr>
                            <th>曜日・コマ</th>
                            <td th:text="${info.schedule}"></td>
                        </tr>
                        </table>
                </div>
            </div>

            <div class="right-panel">
                <div class="student-card">
                    <h3 class="card-title">履修学生一覧 <span class="badge" th:text="${info.students.size()} + '名'"></span></h3>
                    
                    <div class="student-scroll-container">
                        <table class="student-table">
                            <thead>
                                <tr>
                                    <th>氏名</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="student : ${info.students}">
                                    <td>
                                        <a th:href="@{/admin/student/{sid}/subject/{subid}(sid=${student.id}, subid=${info.subjectId}, from='subject', fromDeptId=${info.departmentId}, fromGrade=${info.grade})}" 
                                           class="student-link">
                                            <i class="fa-solid fa-user-graduate"></i>
                                            <span th:text="${student.name}">川島 未裕</span>
                                            <i class="fa-solid fa-chevron-right" style="float: right; font-size: 0.8em; color: #ccc; margin-top: 4px;"></i>
                                        </a>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(info.students)}">
                                    <td class="text-center" style="color: #999; padding: 20px;">登録学生なし</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
<script th:src="@{/js/admin/subjectInfo.js}"></script>
</body>
</html>
