<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生徒一覧</title>
    
    <link rel="stylesheet" th:href="@{/css/parts.css}">
    <link rel="stylesheet" th:href="@{/css/admin/studentList.css}">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="header-container">
        <div th:replace="~{fragments/_parts :: admin-header}"></div>
    </div>
    
    
    <div class="backbutton-container">
        <div th:replace="~{fragments/_parts :: backButton(url='/timetable')}"></div>
    </div>

    <div class="student-list-container">
        
        <h1 class="page-title">生徒一覧</h1>

        <div class="search-filter-area">
            
            <form action="#" method="get" class="search-form">
                <input type="text" class="search-input" placeholder="検索キーワードを入力">
            </form>

            <button type="submit" class="tool-btn search-btn">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>

            <button class="tool-btn filter-btn">
                <i class="fa-solid fa-sliders"></i>
            </button>
            
        </div>

        <div class="table-wrapper">
            <table class="student-table">
                <colgroup>
                    <col style="width: 15%;"> <col style="width: 30%;"> <col style="width: 10%;"> <col style="width: 10%;"> <col style="width: 35%;"> </colgroup>
                <thead>
                    <tr>
                        <th>学籍番号</th>
                        <th>学科・コース</th>
                        <th>学年</th>
                        <th>クラス</th>
                        <th>氏名</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                    </tr>
                    <tr>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                    </tr>
                    <tr>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                    </tr>
                    <tr>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                    </tr>
                    <tr>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="pagination">
            <a href="#" class="page-link">＜</a>
            <a href="#" class="page-link active">1</a>
            <a href="#" class="page-link">2</a>
            <a href="#" class="page-link">3</a>
            <a href="#" class="page-link">4</a>
            <a href="#" class="page-link">5</a>
            <span class="page-dots">...</span>
            <a href="#" class="page-link">＞</a>
        </div>

    </div>

</body>
</html>
