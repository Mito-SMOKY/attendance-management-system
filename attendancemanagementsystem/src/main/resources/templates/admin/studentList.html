<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生徒一覧</title>
    
    <link rel="stylesheet" th:href="@{/css/parts.css}">
    <link rel="stylesheet" th:href="@{/css/adminStudentList.css}">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="header-container">
        <div th:replace="~{fragments/_parts :: header(title='出欠管理システム')}"></div>
    </div>
    
    <div class="backbutton-container">
        <div th:replace="~{fragments/_parts :: backButton(url='/timetable')}"></div>
    </div>

    <div class="student-list-container">
        
        <h1 class="page-title">生徒一覧</h1>

        <div class="search-filter-area">
            
            <form action="#" method="get" class="search-form">
                <input type="text" class="search-input" placeholder="キーワードを入力">
            </form>

            <button type="submit" class="tool-btn search-btn">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>

            <button class="tool-btn filter-btn" id="filterBtn">
                <svg class="filter-icon-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M4.25 5.61C6.27 8.2 10 13 10 13v6c0 .55.45 1 1 1h2c.55 0 1-.45 1-1v-6s3.72-4.8 5.74-7.39A1 1 0 0 0 18.95 4H5.04c-.83 0-1.3.95-.79 1.61z"/>
                </svg>
            </button>
            
            <div class="filter-menu" id="filterMenu">
                <form action="#" method="get">
                    <div class="filter-group">
                        <label>学科</label>
                        <select name="department" class="filter-select">
                            <option value="">すべて</option>
                            <option th:each="dept : ${departmentList}" 
                                    th:value="${dept.id}" 
                                    th:text="${dept.name}"></option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label>コース</label>
                        <select name="course" class="filter-select">
                            <option value="">すべて</option>
                            <option th:each="course : ${courseList}" 
                                    th:value="${course.id}" 
                                    th:text="${course.name}"></option>
                        </select>
                    </div>

                    <div class="filter-actions">
                        <button type="submit" class="apply-btn">適用</button>
                    </div>
                </form>
            </div>
            
        </div>

        <div class="table-wrapper">
            <table class="student-table">
                <colgroup>
                    <col style="width: 15%;"> <col style="width: 30%;"> <col style="width: 10%;"> <col style="width: 10%;"> <col style="width: 35%;"> 
                </colgroup>
                <thead>
                    <tr>
                        <th>学籍番号</th>
                        <th>学科・コース</th>
                        <th>学年</th>
                        <th>クラス</th>
                        <th>氏名</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="student : ${studentList}">
                        <td th:text="${student.studentNumber}"></td>
                        <td th:text="${student.departmentCourse}"></td>
                        <td th:text="${student.grade}"></td>
                        <td th:text="${student.className}"></td>
                        <td th:text="${student.name}"></td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

    <script>
        const filterBtn = document.getElementById('filterBtn');
        const filterMenu = document.getElementById('filterMenu');

        filterBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            filterMenu.classList.toggle('active');
        });

        document.addEventListener('click', (e) => {
            if (!filterMenu.contains(e.target) && !filterBtn.contains(e.target)) {
                filterMenu.classList.remove('active');
            }
        });
        
        filterMenu.addEventListener('click', (e) => {
            e.stopPropagation();
        });
    </script>

</body>
</html>
