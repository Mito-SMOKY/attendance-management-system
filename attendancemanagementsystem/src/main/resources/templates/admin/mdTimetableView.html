<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>時間割参照</title>
    <link rel="stylesheet" th:href="@{/css/parts.css}">
    <link rel="stylesheet" th:href="@{/css/admin/mdTimetableView.css}">
    
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/material_blue.css">
    
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ja.js"></script>

    <script th:src="@{/js/admin/mdTimetable.js}"></script>
</head>
<body>
    <div class="header-container">
        <div th:replace="~{fragments/_parts :: admin-header}"></div>
    </div>

    <div class="backbutton-container">
        <div th:replace="~{fragments/_parts :: backButton(url='/admin/timetable')}"></div>
    </div>

    <div class="timetable-container">
        <h1 class="page-title">時間割参照</h1>

        <div class="mode-tabs">
            <a th:href="@{/admin/mdTimetable}" class="tab-link">半期一括登録</a>
            <a th:href="@{/admin/mdTimetable/daily}" class="tab-link">日別編集</a>
            <a th:href="@{/admin/mdTimetable/view}" class="tab-link active-tab">時間割参照</a>
            <a th:href="@{/admin/mdTimetable/delete}" class="tab-link active-tab" style="color: #dc3545;">一括削除</a>
        </div>

        <form th:action="@{/admin/mdTimetable/view}" method="get" class="setting-area">
            <div class="setting-row center-align" style="border-bottom:1px dashed #ddd; padding-bottom:10px; margin-bottom:15px;">
                <label>年度:</label>
                <select name="year" id="yearSelect" class="searchable-select" style="width:100px;" onchange="setReferenceDate()">
                    <option th:each="y : ${#numbers.sequence(mdTimetableDto.year - 1, mdTimetableDto.year + 1)}"
                            th:value="${y}" 
                            th:text="${y} + '年度'"
                            th:selected="${y == mdTimetableDto.year}">
                    </option>
                </select>

                <label>学期:</label>
                <select name="term" id="termSelect" class="searchable-select" style="width:100px;" onchange="setReferenceDate()">
                    <option value="1" th:selected="${mdTimetableDto.term == 1}">前期</option>
                    <option value="2" th:selected="${mdTimetableDto.term == 2}">後期</option>
                </select>
                
                <button type="button" onclick="setReferenceDate()" class="btn-secondary">
                    ← この学期の基準日にリセット
                </button>
            </div>

            <div class="setting-row">
                <div class="form-group">
                    <label>表示基準日 (この日を含む週を表示):</label>
                    <input type="text" name="date" id="dateInput" th:value="${mdTimetableDto.startDate}" class="form-control" required style="width: 150px; background-color: white;">
                </div>
                
                <div class="form-group">
                    <label>クラス:</label>
                    <select name="departmentId" class="searchable-select" required style="min-width: 300px;">
                        <option value="">選択してください</option>
                        <option th:each="entry : ${departmentOptions}" 
                                th:value="${entry.key}" 
                                th:text="${entry.value}"
                                th:selected="${entry.key == mdTimetableDto.departmentId}">
                        </option>
                    </select>
                </div>
                
                <button type="submit" class="btn-primary">表示</button>
            </div>
        </form>

        <div class="table-wrapper" th:if="${mdTimetableDto.departmentId != null}">
            <div style="margin-bottom:10px; font-weight:bold; color:#333;">
                表示中の週: <span th:text="${mdTimetableDto.startDate}"></span> ～ <span th:text="${mdTimetableDto.endDate}"></span>
            </div>

            <table class="timetable-table">
                <thead>
                    <tr>
                        <th style="width:10%;">時限</th>
                        <th>月</th><th>火</th><th>水</th><th>木</th><th>金</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="ts : ${timeSlots}">
                        <td style="font-weight:bold; background:#eee; text-align:center;">
                            <span th:text="${ts.slotId} + '限'"></span><br>
                            <span style="font-size:0.8em; font-weight:normal;" th:text="${ts.startTime} + '～' + ${ts.endTime}"></span>
                        </td>
                        
                        <td th:each="day : ${ {'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY'} }">
                            <div th:with="slotMap=${mdTimetableDto.scheduleMap.get(ts.slotId)}" class="view-cell">
                                <th:block th:if="${slotMap != null}">
                                    <div th:with="cell=${slotMap.get(day)}">
                                        <div th:if="${cell != null && cell.subjectId != null}">
                                            <div class="view-subject" 
                                                th:text="${cell.subjectName != null ? cell.subjectName : '(科目ID:' + cell.subjectId + ')'}">
                                            </div>
                                            <div class="view-details">
                                                <span th:if="${cell.classroomName != null}">
                                                    <i class="fas fa-door-open"></i> <span th:text="${cell.classroomName}"></span>
                                                </span>
                                                <br th:if="${cell.classroomName != null}">
                                                <span th:if="${cell.teacherName != null}">
                                                    <i class="fas fa-user"></i> <span th:text="${cell.teacherName}"></span>
                                                </span>
                                            </div>
                                        </div>
                                        <div th:if="${cell == null || cell.subjectId == null}" class="view-empty">-</div>
                                    </div>
                                </th:block>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <div th:if="${mdTimetableDto.departmentId == null}" style="text-align:center; margin-top:50px; color:#666;">
            <p>条件を指定して「表示」ボタンを押してください。</p>
        </div>
    </div>
</body>
</html>
