<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生徒操作履歴</title>
    
    <link rel="stylesheet" th:href="@{/css/parts.css}">
    <link rel="stylesheet" th:href="@{/css/admin/requestList.css}">
    <link href="https://use.fontawesome.com/releases/v6.2.0/css/all.css" rel="stylesheet">
    
</head>
<body>

    <div class="header-container">
        <div th:replace="~{fragments/_parts :: superadmin-header}"></div>
    </div>
    
    <div class="main-container">
        <div th:replace="~{fragments/_parts :: page-title-part('生徒操作履歴')}"></div>

        <div class="content-wrapper">
            
        <div class="backbutton-container" >
            <div th:replace="~{fragments/_parts :: backButton(url='/admin/userManagement')}"></div>
        </div>

            <div class="table-container">
                <table class="history-table">
                    <thead>
                        <tr class="history-tr">
                            <th>操作日時</th>
                            <th>実行者</th>
                            <th>操作タイプ</th>
                            <th>操作内容</th>
                            <th>ステータス</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(historyList)}">
                            <td colspan="5" style="text-align: center; padding: 20px;">
                                履歴が存在しません
                            </td>
                        </tr>

                        <tr th:each="history : ${historyList}">
                            <td th:text="${history.createdAt}"></td>
                            <td th:text="${history.requesterName}"></td>
                            <td th:text="${history.requestTypeName}"></td>
                            <td>
                                <span th:text="${history.requestMessage != null ? history.requestMessage : 'ID: ' + history.requestId}"></span>
                            </td>
                            <td>
                                <span class="status-badge">完了</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    </body>
</html>
