<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">申請詳細</title>
    
    <th:block th:if="${_csrf}">
        <meta name="_csrf" th:content="${_csrf.token}"/>
        <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    </th:block>

    <link rel="stylesheet" th:href="@{/css/parts.css}">
    <link rel="stylesheet" th:href="@{/css/admin/requestDetail.css}">
    <link href="https://use.fontawesome.com/releases/v6.2.0/css/all.css" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="header-container">
        <div th:replace="~{fragments/_parts :: superadmin-header}"></div>
    </div>
    
    <div class="backbutton-container">
        <div th:replace="~{fragments/_parts :: backButton(url='/admin/requestList/list')}"></div>
    </div>

    <main class="main-container">

        <div th:replace="~{fragments/_parts :: page-title-part('申請詳細')}"></div>

        <div class="detail-card">
            
            <h2 >詳細情報</h2>
            
            <div class="info-group">
                <div class="detail-item">
                    <label class="label">申請ID</label>
                    <div class="value-box" th:text="${request.requestId}"></div>
                </div>
                
                <div class="detail-item">
                    <label class="label">申請日時</label>
                    <div class="value-box" th:text="${request.createdAt}"></div>
                </div>
            </div>

            <div class="info-group">
                <div class="detail-item">
                    <label class="label">申請者</label>
                    <div class="value-box">
                        <a th:href="@{/admin/studentInfo(id=${request.requesterId})}" 
                           th:text="${request.requesterName}" 
                           class="student-link">
                        </a>
                    </div>
                </div>
                
                <div class="detail-item">
                    <label class="label">申請種別</label>
                    <div class="value-box" th:text="${request.typeName}"></div>
                </div>
            </div>

            <div class="info-group">
                <div class="detail-item">
                    <label class="label">ステータス</label>
                    <span class="status-badge" 
                          th:classappend="'status-' + ${request.statusCode}"
                          th:text="${request.status}">
                    </span>
                </div>
            </div>

            <div class="info-group full-width" th:if="${request.details != null && !request.details.empty}">
                <div class="detail-item full-width">
                    <label class="label">対象授業（公欠）</label>
                    <div class="table-container">
                        <table class="details-table">
                            <thead>
                                <tr>
                                    <th>日付</th>
                                    <th>時限</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="d : ${request.details}">
                                    <td th:text="${d.date} + '   '"></td>
                                    <td th:text="${d.slot} + '限'"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="info-group" th:if="${request.targetStatusId != null}">
                <div class="detail-item">
                    <label class="label">変更後ステータスID</label>
                    <div class="value-box" th:text="${request.targetStatusId}"></div>
                </div>
            </div>

            <div class="info-group" th:if="${request.targetDepartmentId != null}">
                <div class="detail-item">
                    <label class="label">変更後学科ID</label>
                    <div class="value-box" th:text="${request.targetDepartmentId}"></div>
                </div>
            </div>

            <div class="info-group full-width">
                <div class="detail-item full-width">
                    <label class="label">変更内容</label>
                    <div class="value-box reason-box" th:text="${request.requestMessage}"></div>
                </div>
            </div>

        </div>

        <div class="action-area" th:if="${request.statusCode == 1}">
            <button type="button" class="btn-approve" onclick="confirmAction('approve')">承認</button>
            <button type="button" class="btn-reject" onclick="confirmAction('reject')">却下</button>
        </div>

    </main>

    <script th:inline="javascript">
        const requestId = /*[[${request.requestId}]]*/ 0;

        function confirmAction(action) {
            const actionText = (action === 'approve') ? '承認' : '却下';
            
            Swal.fire({
                title: actionText + 'しますか？',
                text: "この操作は取り消せません。",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: (action === 'approve') ? '#28a745' : '#dc3545',
                cancelButtonColor: '#6c757d',
                confirmButtonText: 'はい、' + actionText + 'します',
                cancelButtonText: 'キャンセル'
            }).then((result) => {
                if (result.isConfirmed) {
                    executeProcess(action);
                }
            });
        }

        function executeProcess(action) {
            const csrfTokenMeta = document.querySelector('meta[name="_csrf"]');
            const csrfHeaderMeta = document.querySelector('meta[name="_csrf_header"]');
            
            const formData = new URLSearchParams();
            formData.append('requestId', requestId);
            formData.append('action', action);

            const headers = {
                'Content-Type': 'application/x-www-form-urlencoded'
            };
            if (csrfTokenMeta && csrfHeaderMeta) {
                headers[csrfHeaderMeta.content] = csrfTokenMeta.content;
            }

            fetch('/admin/requestList/process', {
                method: 'POST',
                headers: headers,
                body: formData
            })
            .then(async response => {
                const msg = await response.text();
                
                if (!response.ok) {
                    throw new Error(msg || '処理に失敗しました');
                }
                return msg;
            })
            .then(msg => {
                Swal.fire('完了', msg, 'success').then(() => {
                    location.href = '/admin/requestList/list';
                });
            })
            .catch(err => {
                Swal.fire('エラー', err.message, 'error');
            });
        }
    </script>
</body>
</html>
