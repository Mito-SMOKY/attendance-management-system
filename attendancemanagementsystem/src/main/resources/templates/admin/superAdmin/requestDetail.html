<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">申請詳細</title>
    
    <th:block th:if="${_csrf}">
        <meta name="_csrf" th:content="${_csrf.token}"/>
        <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    </th:block>

    <link rel="stylesheet" th:href="@{/css/parts.css}">
    <link rel="stylesheet" th:href="@{/css/admin/requestDetail.css}">
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="header-container">
        <div th:replace="~{fragments/_parts :: superadmin-header}"></div>
    </div>
    
    <div class="backbutton-container">
        <a th:href="@{/admin/requestList/list}" class="btn-back">一覧へ戻る</a>
    </div>

    <main class="main-container">
        <div class="detail-card">
            <h2>申請詳細情報</h2>
            
            <div class="info-group">
                <label>申請者</label>
                <div class="info-value" th:text="${request.requesterName} + ' (ID: ' + ${request.requesterId} + ')'"></div>
            </div>

            <div class="info-group">
                <label>申請種類</label>
                <div class="info-value" th:text="${request.typeName}"></div>
            </div>

            <div class="info-group">
                <label>理由・メッセージ</label>
                <div class="info-value" th:text="${request.message}"></div>
            </div>

            <div class="info-group">
                <label>申請日時</label>
                <div class="info-value" th:text="${request.createdAt}"></div>
            </div>

            <hr class="divider">

            <div th:if="${request.typeId == 1}">
                <h3>対象日時 (公欠・欠席)</h3>
                <table class="detail-table">
                    <thead>
                        <tr>
                            <th>日付</th>
                            <th>時限</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="d : ${request.details}">
                            <td th:text="${d.date}">2025/01/01</td>
                            <td th:text="${d.slot} + '限'">1限</td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(request.details)}">
                            <td colspan="2" style="text-align: center;">詳細データがありません</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div th:if="${request.typeId == 4}">
                 <h3>変更申請内容</h3>
                 <p>変更先学科ID: <span th:text="${request.targetDeptId}"></span></p>
            </div>


            <div class="action-buttons" th:if="${request.status == 1}">
                <button type="button" class="btn-reject" th:onclick="|processRequest(${request.requestId}, 'reject')|">却下</button>
                <button type="button" class="btn-approve" th:onclick="|processRequest(${request.requestId}, 'approve')|">承認</button>
            </div>
            
            <div th:if="${request.status != 1}" class="status-message">
                <p>この申請は既に処理済みです。</p>
            </div>

        </div>
    </main>

    <script th:inline="javascript">
        function processRequest(requestId, action) {
            const actionText = (action === 'approve') ? '承認' : '却下';
            
            Swal.fire({
                title: actionText + 'しますか？',
                text: "この操作は取り消せません。",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#539DA4',
                cancelButtonColor: '#d33',
                confirmButtonText: 'はい',
                cancelButtonText: 'キャンセル'
            }).then((result) => {
                if (result.isConfirmed) {
                    sendRequest(requestId, action);
                }
            });
        }

        function sendRequest(requestId, action) {
            const csrfTokenMeta = document.querySelector('meta[name="_csrf"]');
            const csrfHeaderMeta = document.querySelector('meta[name="_csrf_header"]');
            
            const formData = new URLSearchParams();
            formData.append('requestId', requestId);
            formData.append('action', action);

            const headers = {
                'Content-Type': 'application/x-www-form-urlencoded'
            };
            if (csrfTokenMeta && csrfHeaderMeta) {
                headers[csrfHeaderMeta.content] = csrfTokenMeta.content;
            }

            fetch('/admin/requestList/process', {
                method: 'POST',
                headers: headers,
                body: formData
            })
            .then(async response => {
                // ★修正点: サーバーからのメッセージ(text)を先に取得する
                const msg = await response.text();
                
                // エラー(400など)の場合も、そのメッセージをエラーとして投げる
                if (!response.ok) {
                    throw new Error(msg || '処理に失敗しました');
                }
                return msg;
            })
            .then(msg => {
                // 成功時
                Swal.fire('完了', msg, 'success').then(() => {
                    location.href = '/admin/requestList/list';
                });
            })
            .catch(err => {
                // ★ここでサーバーからの具体的なエラーメッセージを表示する
                Swal.fire('エラー', err.message, 'error');
            });
        }
    </script>
</body>
</html>
