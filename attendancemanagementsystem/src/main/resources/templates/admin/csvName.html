<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ファイルアップロード</title>
    
    <link rel="stylesheet" th:href="@{/css/parts.css}">
    <link rel="stylesheet" th:href="@{/css/admin/adminCsvName.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="header-container">
        <div th:replace="~{fragments/_parts :: header(title='出欠管理システム')}"></div>
    </div>

    <div class="backbutton-container">
        <div th:replace="~{fragments/_parts :: backButton(url='/admin/account-input')}"></div>
    </div>

    <div class="name-input-container">
        
        <h1 class="page-title">ファイルアップロード</h1>

        <form method="post" th:action="@{/admin/account-list}">

            <div class="file-info-area">
            
            </div>

            <div class="input-section">
                <div class="input-wrapper">
                    <input type="text" id="dataListName" name="dataListName" class="name-input" placeholder="データリスト名" required>
                </div>
                </div>

            <div class="action-area">
                <p class="action-desc">このCSVファイルからアカウントを作成します。</p>
                <button type="submit" class="create-btn">作成</button>
            </div>
        </form>

    </div>

</body>
</html>
