<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>ファイルアップロード</title>
    <link rel="stylesheet" th:href="@{/css/parts.css}" />
    <link rel="stylesheet" th:href="@{/css/admin/adminCsvName.css}" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="header-container">
      <div th:replace="~{fragments/_parts :: admin-header}"></div>
    </div>
    <div class="backbutton-container">
      <div
        th:replace="~{fragments/_parts :: backButton(url='/admin/upload')}"
      ></div>
    </div>

    <div class="name-input-container">
      <h1 class="page-title">リスト情報の入力</h1>

      <form
        method="post"
        th:action="@{/admin/account-list}"
        th:object="${datalistForm}"
      >
        <div
          class="input-section"
          style="background: #f9f9f9; padding: 15px; margin-bottom: 20px"
        >
          <h3>基本設定</h3>
          <div>
            <label>年度:</label>
            <input
              type="number"
              th:field="*{academicYear}"
              placeholder="2025"
              required
            />
          </div>
          <div>
            <label>学年:</label>
            <select th:field="*{grade}">
              <option value="1">1年</option>
              <option value="2">2年</option>
              <option value="3">3年</option>
            </select>
          </div>
          <div>
            <label>学科・クラス:</label>
            <select th:field="*{departmentId}">
              <option
                th:each="dept : ${departmentList}"
                th:value="${dept.departmentId}"
                th:text="${(dept.major != null ? dept.major.majorName : '学科不明') + ' : ' + dept.className}"
              ></option>
            </select>
          </div>
        </div>

        <div class="input-section">
          <input
            type="text"
            th:field="*{datalistName}"
            class="name-input"
            placeholder="データリスト名"
            required
          />
        </div>

        <th:block th:each="acc, stat : *{tempAccounts}">
          <input
            type="hidden"
            th:field="*{tempAccounts[__${stat.index}__].loginId}"
          />
          <input
            type="hidden"
            th:field="*{tempAccounts[__${stat.index}__].name}"
          />
          <input
            type="hidden"
            th:field="*{tempAccounts[__${stat.index}__].password}"
          />
        </th:block>

        <div class="action-area">
          <button type="submit" class="create-btn">確認画面へ</button>
        </div>
      </form>
    </div>
  </body>
</html>
