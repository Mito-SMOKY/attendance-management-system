<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>リスト詳細</title>
    <style>
      body {
        padding: 20px;
        font-family: sans-serif;
      }
      .info-box {
        background-color: #f9f9f9;
        padding: 15px;
        border-radius: 5px;
        margin-bottom: 20px;
        border: 1px solid #eee;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 8px;
        text-align: left;
      }
      th {
        background-color: #007bff;
        color: white;
      }
      tr:nth-child(even) {
        background-color: #f2f2f2;
      }
      .btn {
        padding: 8px 15px;
        background-color: #6c757d;
        color: white;
        text-decoration: none;
        border-radius: 4px;
      }
      .btn:hover {
        background-color: #5a6268;
      }
    </style>
  </head>
  <body>
    <h1>リスト詳細確認</h1>

    <div class="info-box">
      <p>
        <strong>リストID:</strong>
        <span th:text="${datalist.dataListId}"></span>
      </p>
      <p>
        <strong>リスト名:</strong>
        <span th:text="${datalist.dataListName}"></span>
      </p>

      <p>
        <strong>作成者:</strong>
        <span
          th:text="${datalist.creatorUser != null ? datalist.creatorUser.name : '不明'}"
        ></span>
        (<span
          th:text="${datalist.creatorUser != null ? datalist.creatorUser.loginId : '-'}"
        ></span
        >)
      </p>

      <p>
        <strong>作成日時:</strong> <span th:text="${datalist.createdAt}"></span>
      </p>
    </div>

    <h3>登録メンバー一覧（保存履歴）</h3>
    <table>
      <thead>
        <tr>
          <th style="width: 50px">No.</th>
          <th>ログインID</th>
          <th>氏名</th>

          <th>年度</th>
          <th>学年</th>
          <th>学科</th>
          <th>クラス</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="detail, stat : ${details}">
          <td th:text="${stat.count}">1</td>
          <td th:text="${detail.loginId}">ST001</td>
          <td th:text="${detail.name}">山田 太郎</td>

          <td th:text="${detail.academicYear}">2025</td>
          <td th:text="${detail.grade} + '年'">1年</td>
          <td th:text="${detail.majorName}">情報システム学科</td>
          <td th:text="${detail.className}">Aクラス</td>
        </tr>
      </tbody>
    </table>

    <br /><br />
    <a th:href="@{/admin/creation-history}" class="btn">← 履歴一覧に戻る</a>
  </body>
</html>
