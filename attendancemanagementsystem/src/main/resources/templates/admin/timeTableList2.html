<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>時間割一覧</title>
    
    <link rel="stylesheet" th:href="@{/css/parts.css}">
    <link rel="stylesheet" th:href="@{/css/admin/adminTimetableList2.css}">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="header-container">
        <div th:replace="~{fragments/_parts :: header(title='出欠管理システム')}"></div>
    </div>
    
    <div class="backbutton-container">
        <div th:replace="~{fragments/_parts :: backButton(url='/')}"></div>
    </div>
    
    <div class="timetable-container">
        
        <div class="page-header-wrapper">
            <h1 class="page-title">時間割一覧</h1>
        </div>

        <form action="#" method="get" class="filter-area">
            <select class="filter-select term-select">
                <option>2024年度 前期</option>
                <option>2024年度 後期</option>
            </select>
        </form>

        <div class="table-wrapper">
            <table class="timetable-table">
                <colgroup>
                    <col style="width: 40%;"> 
                    <col style="width: 40%;"> 
                    <col style="width: 20%;"> 
                </colgroup>
                <thead>
                    <tr>
                        <th>学科</th>
                        <th>コース</th>
                        <th>学年</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${timetableList}">
                        <td th:text="${item.department}"></td> <td th:text="${item.course}"></td>      <td th:text="${item.grade} + '年'"></td> </tr>

                    <tr th:if="${timetableList == null or timetableList.size() == 0}">
                        <td colspan="3" style="padding: 30px; color: #777;">
                            表示するデータがありません。
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

</body>
</html>
