<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>仮アカウント管理</title>
    <style>
      .container {
        display: flex;
        gap: 15px;
      }
      .card {
        border: 1px solid #ccc;
        padding: 15px;
        width: 200px;
        text-align: center;
        border-radius: 8px;
      }
      .btn {
        display: block;
        margin-top: 10px;
        padding: 8px;
        background: #28a745;
        color: white;
        text-decoration: none;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1>仮アカウント管理メニュー</h1>
    <div class="container">
      <div class="card">
        <h3>ファイル一括登録</h3>
        <p>CSVから登録します</p>
        <a th:href="@{/admin/upload}" class="btn">ファイル読込</a>
      </div>
      <div class="card">
        <h3>手動登録</h3>
        <p>画面で入力します</p>
        <a th:href="@{/admin/manual-input}" class="btn">手動入力</a>
      </div>
      <div class="card">
        <h3>作成履歴</h3>
        <p>過去のリストを確認</p>
        <a th:href="@{/admin/creation-history}" class="btn">履歴を見る</a>
      </div>
    </div>
    <br />
    <a th:href="@{/admin/home}">← ホームへ戻る</a>
  </body>
</html>
