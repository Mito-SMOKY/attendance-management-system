<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>管理者詳細</title>

    <link rel="stylesheet" th:href="@{/css/parts.css}" />
    <link rel="stylesheet" th:href="@{/css/sadmin/sadminInfo.css}" />
    <link
      href="https://use.fontawesome.com/releases/v6.2.0/css/all.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="header-container">
      <div th:replace="~{fragments/_parts :: header}"></div>
    </div>

    <div class="main-wrapper">
      <div class="top-section">
        <div class="backbutton-container">
          <div
            th:replace="~{fragments/_parts :: backButton(url='/admin/sadminList')}"
          ></div>
        </div>

        <h2 class="page-title">管理者詳細</h2>
      </div>

      <div class="info-container">
        <div class="info-header">
          <h3>登録情報</h3>
          <button
            type="button"
            id="btnEditMode"
            class="btn-edit-mode"
            onclick="toggleEditMode()"
          >
            編集
          </button>
        </div>

        <form
          id="detailForm"
          th:action="@{/admin/sadmin/update}"
          method="post"
          th:object="${sadminInfo}"
        >
          <div class="detail-box">
            <div class="detail-row">
              <div class="detail-label">管理者番号</div>
              <div class="detail-value" th:text="*{userId}"></div>
              <input
                type="hidden"
                id="userId"
                name="userId"
                th:value="*{userId}"
              />
            </div>

            <div class="detail-row">
              <div class="detail-label">氏名</div>
              <div class="detail-value">
                <input
                  type="text"
                  id="userName"
                  name="name"
                  th:value="*{name}"
                  disabled
                />
              </div>
            </div>

            <div class="detail-row">
              <div class="detail-label">上位権限</div>
              <div class="detail-value">
                <select
                  id="userAuth"
                  name="adminLevelID"
                  class="auth-select"
                  disabled
                >
                  <option
                    value="1"
                    th:selected="*{adminLevelID == 1 || adminLevelID == '1'}"
                  >
                    〇 (上位権限)
                  </option>
                  <option
                    value="0"
                    th:selected="*{adminLevelID == 0 || adminLevelID == '0'}"
                  >
                    ✕ (一般権限)
                  </option>
                </select>
              </div>
            </div>
          </div>

          <div class="detail-box mt-20">
            <div class="detail-row">
              <div class="detail-label">メールアドレス</div>
              <div class="detail-value">
                <input
                  type="text"
                  id="userEmail"
                  name="email"
                  th:value="*{email}"
                  disabled
                />
              </div>
            </div>
          </div>

          <div class="action-buttons">
            <button
              class="btn-delete"
              type="button"
              onclick="openDeleteModal()"
            >
              ユーザー削除
            </button>

            <button
              class="btn-confirm"
              id="btnSave"
              type="button"
              onclick="saveUser()"
              style="display: none"
            >
              確定
            </button>
          </div>
        </form>
      </div>
    </div>

    <div id="deleteModal" class="modal-overlay">
      <div class="modal-box">
        <div class="modal-icon">
          <i class="fa-solid fa-triangle-exclamation"></i>
        </div>

        <h2 class="modal-title">このユーザーを削除しますか？</h2>
        <p class="modal-warning">※この操作は取り消せません</p>

        <div class="modal-user-info">
          <p>管理者番号：<span id="modalUserIdDisplay"></span></p>
          <p>氏名：<span id="modalUserNameDisplay"></span></p>
        </div>

        <form id="deleteForm" th:action="@{/admin/sadmin/delete}" method="post">
          <input type="hidden" id="deleteTargetId" name="targetID" />

          <p class="modal-input-label">パスワードを入力してください</p>
          <div class="password-wrapper">
            <input
              type="password"
              id="deletePassword"
              name="password"
              placeholder="*******"
              required
            />
            <i
              class="fa-solid fa-eye-slash toggle-eye"
              onclick="togglePasswordVisibility()"
            ></i>
          </div>

          <div class="modal-buttons">
            <button
              type="button"
              class="btn-modal-cancel"
              onclick="closeDeleteModal()"
            >
              キャンセル
            </button>
            <button type="submit" class="btn-modal-delete">削除</button>
          </div>
        </form>
      </div>
    </div>

    <script th:src="@{/js/admin/sadminInfo.js}"></script>
  </body>
</html>
