<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>教科情報マスタ</title>

    <link rel="stylesheet" th:href="@{/css/parts.css}" />
    <link rel="stylesheet" th:href="@{/css/admin/mdSubjectInformation.css}" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <style>
      /* 教員エリアのスタイル調整 */
      .teacher-select-wrapper {
        display: flex;
        align-items: center;
        gap: 5px;
        margin-bottom: 5px;
      }
      .teacher-select-wrapper select {
        flex-grow: 1;
        max-width: 200px;
      }
      .remove-teacher-btn {
        background-color: #ffe6e6;
        border: 1px solid #ffcccc;
        color: #d9534f;
        border-radius: 4px;
        cursor: pointer;
        width: 24px;
        height: 24px;
        line-height: 22px;
        padding: 0;
        text-align: center;
      }
      .add-teacher-inner-btn {
        display: block;
        width: 100%;
        background-color: #f0f8ff;
        border: 1px dashed #007bff;
        color: #007bff;
        padding: 4px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.85em;
        margin-top: 5px;
      }
      /* 編集モード切り替え用 */
      .view-mode {
        display: block;
      }
      .edit-mode {
        display: none;
      }

      /* .is-editing クラスがついた時 */
      .is-editing .view-mode {
        display: none;
      }
      .is-editing .edit-mode {
        display: block;
      }

      /* 新規追加行は常に編集モードとして扱うためのスタイル */
      tr.new-row .view-mode {
        display: none !important;
      }
      tr.new-row .edit-mode {
        display: block !important;
      }
    </style>
  </head>
  <body>
    <div class="header-container">
      <div th:replace="~{fragments/_parts :: admin-header}"></div>
    </div>

    <div class="layout-wrapper">
      <div class="page-header-outer">
        <h1 class="page-title">教科情報マスタ</h1>
      </div>

      <div class="backbutton-container">
        <div
          th:replace="~{fragments/_parts :: backButton(url='/admin/master-data')}"
        ></div>
      </div>

      <form
        th:action="@{/admin/master/SubjectInformation/save}"
        method="post"
        id="masterForm"
      >
        <div class="subject-info-container">
          <div th:if="${successMessage}" class="alert-success">
            <span th:text="${successMessage}"></span>
          </div>
          <div th:if="${errorMessage}" class="alert-error">
            <span th:text="${errorMessage}"></span>
          </div>

          <div class="action-area">
            <button type="button" class="edit-btn" onclick="toggleEditMode()">
              編集
            </button>
            <button
              type="submit"
              class="save-btn edit-mode"
              style="margin-left: 10px"
            >
              <i class="fa-solid fa-save"></i> 保存して終了
            </button>
          </div>

          <div class="table-wrapper">
            <table class="subject-info-table" id="infoTable">
              <thead>
                <tr>
                  <th class="th-major">コース</th>
                  <th class="th-class">クラス</th>
                  <th class="th-grade">学年</th>
                  <th>受講教科 (結合名)</th>
                  <th style="min-width: 250px">担当教師</th>
                  <th class="edit-mode" style="width: 50px">削除</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="info : ${subjectInfoList}">
                  <td>
                    <span class="view-mode" th:text="${info.majorName}"></span>
                    <div class="edit-mode">
                      <span th:text="${info.majorName}"></span>
                      <input
                        type="hidden"
                        class="row-major-id"
                        th:value="${info.majorId}"
                      />
                    </div>
                  </td>

                  <td>
                    <span class="view-mode" th:text="${info.className}"></span>
                    <div class="edit-mode">
                      <span th:text="${info.className}"></span>
                      <input
                        type="hidden"
                        class="row-dept-id"
                        th:value="${info.departmentId}"
                      />
                    </div>
                  </td>

                  <td>
                    <span
                      class="view-mode"
                      th:text="${info.grade != null ? info.grade + '年' : '-'}"
                    ></span>
                    <div class="edit-mode">
                      <span
                        th:text="${info.grade != null ? info.grade + '年' : '-'}"
                      ></span>
                      <input
                        type="hidden"
                        class="row-grade"
                        th:value="${info.grade}"
                      />
                    </div>
                  </td>

                  <td>
                    <span
                      class="view-mode"
                      th:text="${info.subjectName}"
                    ></span>
                    <div class="edit-mode">
                      <input
                        type="text"
                        class="row-subject-name"
                        th:value="${info.subjectName}"
                        style="width: 100%"
                      />
                    </div>
                  </td>

                  <td>
                    <div class="view-mode">
                      <span th:each="tName, iterStat : ${info.teacherNames}">
                        <span th:text="${tName}"></span
                        ><span th:if="${!iterStat.last}">, </span>
                      </span>
                      <span th:if="${#lists.isEmpty(info.teacherNames)}"
                        >未定</span
                      >
                    </div>

                    <div class="edit-mode teacher-edit-area">
                      <div
                        th:each="tId, stat : ${info.teacherIds}"
                        class="teacher-select-wrapper"
                      >
                        <select name="teacherId">
                          <option value="">-- 未定 --</option>
                          <option
                            th:each="t : ${teacherList}"
                            th:value="${t.teacherId}"
                            th:text="${t.teacherName}"
                            th:selected="${t.teacherId == tId}"
                          ></option>
                        </select>
                        <button
                          type="button"
                          class="remove-teacher-btn"
                          onclick="removeTeacher(this)"
                        >
                          ×
                        </button>

                        <input
                          type="hidden"
                          name="majorId"
                          th:value="${info.majorId}"
                        />
                        <input
                          type="hidden"
                          name="departmentId"
                          th:value="${info.departmentId}"
                        />
                        <input
                          type="hidden"
                          name="grade"
                          th:value="${info.grade}"
                        />
                        <input
                          type="hidden"
                          name="subjectName"
                          th:value="${info.subjectName}"
                        />
                        <input
                          type="hidden"
                          name="subjectId"
                          th:value="${info.subjectId}"
                        />
                      </div>

                      <div
                        th:if="${#lists.isEmpty(info.teacherIds)}"
                        class="teacher-select-wrapper"
                      >
                        <select name="teacherId">
                          <option value="" selected>-- 未定 --</option>
                          <option
                            th:each="t : ${teacherList}"
                            th:value="${t.teacherId}"
                            th:text="${t.teacherName}"
                          ></option>
                        </select>
                        <button
                          type="button"
                          class="remove-teacher-btn"
                          onclick="removeTeacher(this)"
                        >
                          ×
                        </button>
                        <input
                          type="hidden"
                          name="majorId"
                          th:value="${info.majorId}"
                        />
                        <input
                          type="hidden"
                          name="departmentId"
                          th:value="${info.departmentId}"
                        />
                        <input
                          type="hidden"
                          name="grade"
                          th:value="${info.grade}"
                        />
                        <input
                          type="hidden"
                          name="subjectName"
                          th:value="${info.subjectName}"
                        />
                        <input
                          type="hidden"
                          name="subjectId"
                          th:value="${info.subjectId}"
                        />
                      </div>

                      <button
                        type="button"
                        class="add-teacher-inner-btn"
                        onclick="addTeacherField(this)"
                      >
                        ＋ 担当追加
                      </button>
                    </div>
                  </td>

                  <td class="edit-mode">
                    <button
                      type="button"
                      class="delete-btn"
                      onclick="deleteRow(this)"
                    >
                      <i class="fa-solid fa-trash-can"></i>
                    </button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="add-btn-wrapper edit-mode">
            <button type="button" class="add-row-btn" onclick="addRow()">
              ＋ 行を追加
            </button>
          </div>
        </div>
      </form>
    </div>

    <script th:inline="javascript">
      /*<![CDATA[*/
      const teacherOptions = /*[[${teacherList}]]*/ [];
      const majorOptions = /*[[${majorList}]]*/ [];
      const departmentOptions = /*[[${departmentList}]]*/ [];
      const gradeOptions = /*[[${gradeList}]]*/ [1, 2, 3]; // デフォルト値のフォールバック
      /*]]>*/
    </script>

    <script>
      // 編集モード切替
      function toggleEditMode() {
        const container = document.querySelector(".subject-info-container");
        container.classList.toggle("is-editing");

        const btn = document.querySelector(".edit-btn");
        if (container.classList.contains("is-editing")) {
          btn.textContent = "編集終了(データは保存されません)";
          btn.classList.add("active");

          // ★追加: 編集モードに入ったらメッセージ（成功・エラー）を非表示にする
          const successMsg = document.querySelector(".alert-success");
          const errorMsg = document.querySelector(".alert-error");
          if (successMsg) successMsg.style.display = "none";
          if (errorMsg) errorMsg.style.display = "none";
        } else {
          btn.textContent = "編集";
          btn.classList.remove("active");
        }
      }

      // 教員追加フィールドの生成
      function addTeacherField(btn) {
        const cell = btn.closest(".teacher-edit-area");
        const row = btn.closest("tr");

        // 新しいラッパーを作成
        const wrapper = document.createElement("div");
        wrapper.className = "teacher-select-wrapper";

        // セレクトボックス作成
        const select = document.createElement("select");
        select.name = "teacherId";
        const defaultOpt = document.createElement("option");
        defaultOpt.value = "";
        defaultOpt.text = "-- 未定 --";
        select.appendChild(defaultOpt);

        teacherOptions.forEach((t) => {
          const opt = document.createElement("option");
          opt.value = t.teacherId;
          opt.text = t.teacherName;
          select.appendChild(opt);
        });
        wrapper.appendChild(select);

        // 削除ボタン
        const removeBtn = document.createElement("button");
        removeBtn.type = "button";
        removeBtn.className = "remove-teacher-btn";
        removeBtn.innerText = "×";
        removeBtn.onclick = function () {
          removeTeacher(this);
        };
        wrapper.appendChild(removeBtn);

        // Hidden値の取得（行の状態から取得）
        let majorId, deptId, grade, subjectName;

        // 新規行(select)か既存行(hidden/span)かで取得元を変える、あるいは共通クラスから取る
        if (row.classList.contains("new-row")) {
          majorId = row.querySelector(".row-major-select").value;
          deptId = row.querySelector(".row-dept-select").value;
          grade = row.querySelector(".row-grade-select").value;
          subjectName = row.querySelector(".row-subject-name").value;
        } else {
          majorId = row.querySelector(".row-major-id").value;
          deptId = row.querySelector(".row-dept-id").value;
          grade = row.querySelector(".row-grade").value;
          subjectName = row.querySelector(".row-subject-name").value;
        }

        // Hidden Input 作成
        wrapper.appendChild(createHidden("majorId", majorId));
        wrapper.appendChild(createHidden("departmentId", deptId));
        wrapper.appendChild(createHidden("grade", grade));
        wrapper.appendChild(createHidden("subjectName", subjectName));
        // 新規追加分の subjectId は空または既存行IDを入れる
        // ここでは既存行の場合はIDを入れ、新規行の場合は空にする
        const subjectIdInput = row.querySelector('input[name="subjectId"]'); // 既存行の隠しフィールドを探す
        if (subjectIdInput) {
          wrapper.appendChild(createHidden("subjectId", subjectIdInput.value));
        } else {
          wrapper.appendChild(createHidden("subjectId", "")); // 新規行
        }

        cell.insertBefore(wrapper, btn);
      }

      // 教員削除
      function removeTeacher(btn) {
        const wrapper = btn.closest(".teacher-select-wrapper");
        const area = wrapper.parentElement;
        if (area.querySelectorAll(".teacher-select-wrapper").length <= 1) {
          wrapper.querySelector("select").value = ""; // 1つだけならリセット
        } else {
          wrapper.remove();
        }
      }

      // 行削除
      function deleteRow(btn) {
        if (confirm("この教科情報を削除しますか？")) {
          btn.closest("tr").remove();
        }
      }

      // 行追加機能
      function addRow() {
        const tbody = document.querySelector("#infoTable tbody");
        const tr = document.createElement("tr");
        tr.className = "new-row"; // 新規行用クラス（常に編集モード）

        // 1. コース (Major)
        const tdMajor = document.createElement("td");
        const selMajor = createSelect(majorOptions, "majorId", "majorName");
        selMajor.className = "row-major-select";
        selMajor.name = "dummy_major"; // 送信対象外（hiddenで送るため）
        selMajor.onchange = function () {
          syncHiddenValues(tr, "majorId", this.value);
        };
        tdMajor.appendChild(selMajor);
        tr.appendChild(tdMajor);

        // 2. クラス (Dept)
        const tdDept = document.createElement("td");
        const selDept = createSelect(
          departmentOptions,
          "departmentId",
          "className",
        );
        selDept.className = "row-dept-select";
        selDept.name = "dummy_dept";
        selDept.onchange = function () {
          syncHiddenValues(tr, "departmentId", this.value);
        };
        tdDept.appendChild(selDept);
        tr.appendChild(tdDept);

        // 3. 学年 (Grade)
        const tdGrade = document.createElement("td");
        const selGrade = document.createElement("select");
        selGrade.className = "row-grade-select";
        selGrade.name = "dummy_grade";
        const defOpt = document.createElement("option");
        defOpt.text = "選択";
        selGrade.appendChild(defOpt);
        gradeOptions.forEach((g) => {
          const opt = document.createElement("option");
          opt.value = g;
          opt.text = g + "年";
          selGrade.appendChild(opt);
        });
        selGrade.onchange = function () {
          syncHiddenValues(tr, "grade", this.value);
        };
        tdGrade.appendChild(selGrade);
        tr.appendChild(tdGrade);

        // 4. 教科名
        const tdName = document.createElement("td");
        const inpName = document.createElement("input");
        inpName.type = "text";
        inpName.className = "row-subject-name";
        inpName.style.width = "100%";
        inpName.oninput = function () {
          syncHiddenValues(tr, "subjectName", this.value);
        };
        tdName.appendChild(inpName);
        tr.appendChild(tdName);

        // 5. 担当教師エリア
        const tdTeacher = document.createElement("td");
        const editArea = document.createElement("div");
        editArea.className = "teacher-edit-area edit-mode"; // 常時表示

        // 教師追加ボタン
        const addBtn = document.createElement("button");
        addBtn.type = "button";
        addBtn.className = "add-teacher-inner-btn";
        addBtn.innerText = "＋ 担当追加";
        addBtn.onclick = function () {
          addTeacherField(this);
        };

        editArea.appendChild(addBtn);
        tdTeacher.appendChild(editArea);
        tr.appendChild(tdTeacher);

        // 初期教師フィールドを1つ追加
        addTeacherField(addBtn);

        // 6. 削除ボタン
        const tdDel = document.createElement("td");
        const delBtn = document.createElement("button");
        delBtn.type = "button";
        delBtn.className = "delete-btn";
        delBtn.innerHTML = '<i class="fa-solid fa-trash-can"></i>';
        delBtn.onclick = function () {
          deleteRow(this);
        };
        tdDel.appendChild(delBtn);
        tr.appendChild(tdDel);

        tbody.appendChild(tr);
      }

      // --- Helper Functions ---

      function createHidden(name, val) {
        const input = document.createElement("input");
        input.type = "hidden";
        input.name = name;
        input.value = val === undefined || val === null ? "" : val;
        return input;
      }

      function createSelect(options, valKey, textKey) {
        const sel = document.createElement("select");
        const def = document.createElement("option");
        def.value = "";
        def.text = "選択";
        sel.appendChild(def);
        options.forEach((opt) => {
          const o = document.createElement("option");
          o.value = opt[valKey];
          o.text = opt[textKey];
          sel.appendChild(o);
        });
        return sel;
      }

      // Visualな入力(select/text)が変わった時に、その行に含まれる全ての送信用のHidden値を同期する
      function syncHiddenValues(row, name, value) {
        const hiddens = row.querySelectorAll(`input[name="${name}"]`);
        hiddens.forEach((h) => (h.value = value));
      }

      // 既存行の教科名変更イベントリスナー
      document.addEventListener("input", function (e) {
        if (
          e.target.classList.contains("row-subject-name") &&
          !e.target.closest("tr").classList.contains("new-row")
        ) {
          // 既存行の場合のみここで処理（新規行はoninputで処理済み）
          const val = e.target.value;
          const row = e.target.closest("tr");
          row
            .querySelectorAll('input[name="subjectName"]')
            .forEach((h) => (h.value = val));
        }
      });
    </script>
  </body>
</html>
