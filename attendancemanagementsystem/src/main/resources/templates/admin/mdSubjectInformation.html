<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>教科情報マスタ</title>

    <link rel="stylesheet" th:href="@{/css/parts.css}" />
    <link
      rel="stylesheet"
      th:href="@{/css/admin/adminMdSubjectInformation.css}"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="header-container">
      <div
        th:replace="~{fragments/_parts :: header(title='出欠管理システム')}"
      ></div>
    </div>

    <div class="backbutton-container">
      <div
        th:replace="~{fragments/_parts :: backButton(url='/admin/master-data')}"
      ></div>
    </div>

    <form
      th:action="@{/admin/mdSubjectInformation/save}"
      method="post"
      id="masterForm"
    >
      <div class="subject-info-container">
        <div class="page-header-wrapper">
          <h1 class="page-title">教科マスタ</h1>
        </div>

        <div
          th:if="${successMessage}"
          style="color: green; text-align: center; margin-bottom: 10px"
        >
          <span th:text="${successMessage}"></span>
        </div>
        <div
          th:if="${errorMessage}"
          style="color: red; text-align: center; margin-bottom: 10px"
        >
          <span th:text="${errorMessage}"></span>
        </div>

        <div class="action-area">
          <button type="button" class="edit-btn" onclick="toggleEditMode()">
            編集
          </button>
        </div>

        <div class="error-message-area">
          <span id="errorMsgDuplicate" class="error-text"
            >※同じ教科と教師の組み合わせが既に存在します。</span
          >
        </div>

        <div class="table-wrapper">
          <table class="subject-info-table" id="infoTable">
            <thead>
              <tr>
                <th>受講教科</th>
                <th>教師</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="info : ${subjectInfoList}">
                <input
                  type="hidden"
                  name="subjectId"
                  th:value="${info.subjectId}"
                />

                <td>
                  <span class="view-mode" th:text="${info.subjectName}"></span>
                  <input
                    type="text"
                    class="edit-mode"
                    name="subjectName"
                    th:value="${info.subjectName}"
                  />

                  <button
                    type="button"
                    class="delete-btn"
                    onclick="deleteRow(this)"
                  >
                    <i class="fa-solid fa-trash-can"></i>
                  </button>
                </td>
                <td>
                  <span class="view-mode" th:text="${info.teacherName}"></span>
                  <select class="edit-mode" name="teacherId">
                    <option value="">教師を選択</option>
                    <option
                      th:each="teacher : ${teacherList}"
                      th:value="${teacher.teacherId}"
                      th:text="${teacher.teacherName}"
                      th:selected="${teacher.teacherId == info.teacherId}"
                    ></option>
                  </select>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="add-btn-wrapper">
          <button type="button" class="add-row-btn" onclick="addRow()">
            ＋
          </button>
        </div>
      </div>
    </form>

    <script th:inline="javascript">
      /*<![CDATA[*/
      // Controllerから渡されたteacherListを使用
      const teacherOptions = /*[[${teacherList}]]*/ [];
      /*]]>*/
    </script>

    <script>
      function toggleEditMode() {
        const body = document.body;
        const btn = document.querySelector(".edit-btn");
        const errorText = document.getElementById("errorMsgDuplicate");
        const form = document.getElementById("masterForm");

        if (body.classList.contains("editing-mode")) {
          // --- 適用（保存）ボタン押下時 ---
          if (!validateDuplicates()) {
            errorText.style.display = "inline-block";
            return;
          }

          if (!confirm("変更を保存しますか？")) {
            return;
          }

          // フォームを送信
          form.submit();
        } else {
          // --- 編集ボタン押下時 ---
          body.classList.add("editing-mode");
          btn.textContent = "適用";
          errorText.style.display = "none";
        }
      }

      function addRow() {
        const tableBody = document.querySelector("#infoTable tbody");
        const newRow = document.createElement("tr");

        let optionsHtml = '<option value="">教師を選択</option>';
        if (teacherOptions) {
          teacherOptions.forEach((teacher) => {
            optionsHtml += `<option value="${teacher.teacherId}">${teacher.teacherName}</option>`;
          });
        }

        // 新規行も既存行と同じname属性にする
        newRow.innerHTML = `
                <td>
                    <input type="text" class="edit-mode" name="subjectName" placeholder="教科名を入力" style="display:block;">
                    <button type="button" class="delete-btn" onclick="deleteRow(this)" style="display:flex;">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </td>
                <td>
                    <select class="edit-mode" name="teacherId" style="display:block;">
                        ${optionsHtml}
                    </select>
                </td>
            `;

        tableBody.appendChild(newRow);
      }

      function deleteRow(btn) {
        // 削除ボタンを押したら行ごと消す（送信されなくなる＝削除扱い）
        if (confirm("この行を削除しますか？")) {
          const row = btn.closest("tr");
          row.remove();
        }
      }

      function validateDuplicates() {
        const rows = document.querySelectorAll("#infoTable tbody tr");
        const pairs = new Map();
        let hasError = false;

        document
          .querySelectorAll(".input-error")
          .forEach((el) => el.classList.remove("input-error"));

        rows.forEach((row, index) => {
          const nameInput = row.querySelector('input[name="subjectName"]');
          const teacherSelect = row.querySelector('select[name="teacherId"]');

          if (!nameInput || !teacherSelect) return;

          const nameVal = nameInput.value.trim();
          const teacherVal = teacherSelect.value;

          // 両方入力されている場合のみチェック
          if (nameVal && teacherVal) {
            const key = nameVal + "::" + teacherVal;

            if (pairs.has(key)) {
              hasError = true;
              nameInput.classList.add("input-error");
              teacherSelect.classList.add("input-error");

              // 重複元の行も赤くする
              const prevRowIndex = pairs.get(key);
              const prevRow = rows[prevRowIndex];
              const prevName = prevRow.querySelector(
                'input[name="subjectName"]'
              );
              const prevTeacher = prevRow.querySelector(
                'select[name="teacherId"]'
              );
              if (prevName) prevName.classList.add("input-error");
              if (prevTeacher) prevTeacher.classList.add("input-error");
            } else {
              pairs.set(key, index);
            }
          }
        });

        return !hasError;
      }
    </script>
  </body>
</html>
