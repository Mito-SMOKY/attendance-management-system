<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>教科情報マスタ</title>

    <link rel="stylesheet" th:href="@{/css/parts.css}" />
    <link rel="stylesheet" th:href="@{/css/admin/mdSubjectInformation.css}" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />

  </head>
  <body>
    <div class="header-container">
      <div th:replace="~{fragments/_parts :: admin-header}"></div>
    </div>

    <div class="layout-wrapper">
      <div class="page-header-outer">
        <h1 class="page-title">教科情報マスタ</h1>
      </div>

      <div class="backbutton-container">
        <div
          th:replace="~{fragments/_parts :: backButton(url='/admin/master-data')}"
        ></div>
      </div>

      <div class="main-container">
      
      <div th:replace="~{fragments/_parts :: page-title-part('教科情報マスタ')}"></div>

      <form
        th:action="@{/admin/master/SubjectInformation/save}"
        method="post"
        id="masterForm"
      >
        <div class="subject-info-container">
          <div th:if="${successMessage}" class="alert-success">
            <span th:text="${successMessage}"></span>
          </div>
          <div th:if="${errorMessage}" class="alert-error">
            <span th:text="${errorMessage}"></span>
          </div>

          <div class="action-area">
            <button
              type="submit"
              class="save-btn edit-mode"
            >
              <i class="fa-solid fa-save"></i> 保存
            </button>

            <button type="button" class="edit-btn" onclick="toggleEditMode()">
              編集
            </button>
            
          </div>

          <div class="table-wrapper">
            <table class="subject-info-table" id="infoTable">
              <thead>
                <tr>
                  <th class="th-major">学科</th>
                  <th class="th-class">クラス</th>
                  <th class="th-grade">学年</th>
                  <th>受講教科 (結合名)</th>
                  <th style="min-width: 250px">担当教師</th>
                  <th class="edit-mode" style="width: 50px">削除</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="info : ${subjectInfoList}">
                  <td>
                    <span class="view-mode" th:text="${info.majorName}"></span>
                    <div class="edit-mode">
                      <span th:text="${info.majorName}"></span>
                      <input
                        type="hidden"
                        class="row-major-id"
                        th:value="${info.majorId}"
                      />
                    </div>
                  </td>

                  <td>
                    <span class="view-mode" th:text="${info.className}"></span>
                    <div class="edit-mode">
                      <span th:text="${info.className}"></span>
                      <input
                        type="hidden"
                        class="row-dept-id"
                        th:value="${info.departmentId}"
                      />
                    </div>
                  </td>

                  <td>
                    <span
                      class="view-mode"
                      th:text="${info.grade != null ? info.grade + '年' : '-'}"
                    ></span>
                    <div class="edit-mode">
                      <span
                        th:text="${info.grade != null ? info.grade + '年' : '-'}"
                      ></span>
                      <input
                        type="hidden"
                        class="row-grade"
                        th:value="${info.grade}"
                      />
                    </div>
                  </td>

                  <td>
                    <span
                      class="view-mode"
                      th:text="${info.subjectName}"
                    ></span>
                    <div class="edit-mode">
                      <input
                        type="text"
                        class="row-subject-name"
                        th:value="${info.subjectName}"
                        style="width: 100%"
                      />
                    </div>
                  </td>

                  <td>
                    <div class="view-mode">
                      <span th:each="tName, iterStat : ${info.teacherNames}">
                        <span th:text="${tName}"></span
                        ><span th:if="${!iterStat.last}">, </span>
                      </span>
                      <span th:if="${#lists.isEmpty(info.teacherNames)}"
                        >未定</span
                      >
                    </div>

                    <div class="edit-mode teacher-edit-area">
                      <input
                        type="hidden"
                        name="row-base-subject-id"
                        th:value="${info.subjectId}"
                      />

                      <div
                        th:each="tId, stat : ${info.teacherIds}"
                        class="teacher-select-wrapper"
                      >
                        <select name="teacherId">
                          <option value="">-- 未定 --</option>
                          <option
                            th:each="t : ${teacherList}"
                            th:value="${t.teacherId}"
                            th:text="${t.teacherName}"
                            th:selected="${t.teacherId == tId}"
                          ></option>
                        </select>
                        <button
                          type="button"
                          class="remove-teacher-btn"
                          onclick="removeTeacher(this)"
                        >
                          ×
                        </button>

                        <input
                          type="hidden"
                          name="majorId"
                          th:value="${info.majorId}"
                        />
                        <input
                          type="hidden"
                          name="departmentId"
                          th:value="${info.departmentId}"
                        />
                        <input
                          type="hidden"
                          name="grade"
                          th:value="${info.grade}"
                        />
                        <input
                          type="hidden"
                          name="subjectName"
                          th:value="${info.subjectName}"
                        />
                        <input
                          type="hidden"
                          name="subjectId"
                          th:value="${info.subjectId}"
                        />
                      </div>

                      <div
                        th:if="${#lists.isEmpty(info.teacherIds)}"
                        class="teacher-select-wrapper"
                      >
                        <select name="teacherId">
                          <option value="" selected>-- 未定 --</option>
                          <option
                            th:each="t : ${teacherList}"
                            th:value="${t.teacherId}"
                            th:text="${t.teacherName}"
                          ></option>
                        </select>
                        <button
                          type="button"
                          class="remove-teacher-btn"
                          onclick="removeTeacher(this)"
                        >
                          ×
                        </button>
                        <input
                          type="hidden"
                          name="majorId"
                          th:value="${info.majorId}"
                        />
                        <input
                          type="hidden"
                          name="departmentId"
                          th:value="${info.departmentId}"
                        />
                        <input
                          type="hidden"
                          name="grade"
                          th:value="${info.grade}"
                        />
                        <input
                          type="hidden"
                          name="subjectName"
                          th:value="${info.subjectName}"
                        />
                        <input
                          type="hidden"
                          name="subjectId"
                          th:value="${info.subjectId}"
                        />
                      </div>

                      <button
                        type="button"
                        class="add-teacher-inner-btn"
                        onclick="addTeacherField(this)"
                      >
                        ＋ 担当追加
                      </button>
                    </div>
                  </td>

                  <td class="edit-mode">
                    <button
                      type="button"
                      class="delete-btn"
                      onclick="deleteRow(this)"
                    >
                      <i class="fa-solid fa-trash-can"></i>
                    </button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="add-btn-wrapper edit-mode">
            <button type="button" class="add-row-btn" onclick="addRow()">
              ＋ 行を追加
            </button>
          </div>
        </div>
      </form>
    </div>

    <script th:inline="javascript">
      /*<![CDATA[*/
      const teacherOptions = /*[[${teacherList}]]*/ [];
      const majorOptions = /*[[${majorList}]]*/ [];
      const departmentOptions = /*[[${departmentList}]]*/ [];
      const gradeOptions = /*[[${gradeList}]]*/ [1, 2, 3];
      /*]]>*/
    </script>

    <script th:src="@{/js/admin/mdSubjectInformation.js}"></script>

  </body>
</html>
