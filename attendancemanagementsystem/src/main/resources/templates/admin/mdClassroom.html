<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>教室マスタ</title>

    <link rel="stylesheet" th:href="@{/css/parts.css}" />
    <link rel="stylesheet" th:href="@{/css/admin/mdClassroom.css}" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
</head>
<body>

    <div th:replace="~{fragments/_parts :: admin-header}"></div>


    <div class="main-container">

        <div class="backbutton-container">
            <div th:replace="~{fragments/_parts :: backButton(url='/admin/master-data')}"></div>
        </div>

        <div th:replace="~{fragments/_parts :: page-title-part('教室マスタ')}"></div>
        
        <form th:action="@{/admin/master/classroom/save}" method="post" id="masterForm">
            <div class="classroom-card">
                
                <div th:if="${successMessage}" class="alert-message success">
                    <span th:text="${successMessage}"></span>
                </div>
                <div th:if="${errorMessage}" class="alert-message error">
                    <span th:text="${errorMessage}"></span>
                </div>

                <div class="action-bar">
                    <button type="button" class="action-btn edit-btn view-mode" onclick="enableEditMode()">
                        <i class="fa-solid fa-pen"></i> 編集
                    </button>
                </div>

                <div class="error-area">
                    <span id="errorMsgRequired" class="error-text" style="display: none">※教室名は必須入力です。</span>
                    <span id="errorMsgDuplicate" class="error-text" style="display: none">※入力された教室名は既に使用されています。</span>
                </div>

                <div class="table-container">
                    <table class="classroom-table" id="classroomTable">
                        <colgroup>
                            <col style="width: 40%" />
                            <col style="width: 50%" />
                            <col style="width: 10%" />
                        </colgroup>
                        <thead>
                            <tr>
                                <th>教室名</th>
                                <th>MACアドレス</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="room : ${classroomList}">
                                <input type="hidden" name="classroomId" th:value="${room.classroomId}" />

                                <td>
                                    <span class="view-mode" th:text="${room.classroomName}"></span>
                                    <input type="text" class="form-input edit-mode" name="classroomName" 
                                           th:value="${room.classroomName}" placeholder="教室名 (例: 201)" />
                                </td>

                                <td>
                                    <span class="view-mode" th:text="${room.macAddress}"></span>
                                    <input type="text" class="form-input edit-mode" name="macAddress" 
                                           th:value="${room.macAddress}" placeholder="AA:BB:CC:11:22:33" />
                                </td>

                                <td class="action-col">
                                    <button type="button" class="delete-btn edit-mode" onclick="deleteRow(this)">
                                        <i class="fa-solid fa-trash-can"></i>
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="action-footer edit-mode">
                    <div class="edit-btns">
                        <button type="button" class="btn btn-add" onclick="addClassroomRow()">
                            <i class="fa-solid fa-plus"></i> 行を追加
                        </button>
                    </div>
                    
                    <div class="save-btns">
                        <button type="button" class="btn btn-secondary" onclick="cancelEditMode()">キャンセル</button>
                        <button type="button" class="btn btn-save" onclick="saveData()">保存実行</button>
                    </div>
                </div>

            </div>
        </form>

    </div> 
    
    <script th:src="@{/js/admin/mdClassroom.js}"></script>
</body>
</html>
