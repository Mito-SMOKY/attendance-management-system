<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>教室マスタ</title>

    <link rel="stylesheet" th:href="@{/css/common/parts.css}" />
    <link rel="stylesheet" th:href="@{/css/md/mdClassroom.css}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
</head>
<body>
    <div class="header-container">
        <div th:replace="~{fragments/_parts :: admin-header}"></div>
    </div>

    <div class="backbutton-container">
        <div th:replace="~{fragments/_parts :: backButton(url='/admin/master-data')}"></div>
    </div>

    <form th:action="@{/admin/master/classroom/save}" method="post" id="masterForm">
        <div class="classroom-container">
            <div class="page-header-wrapper">
                <h1 class="page-title">教室マスタ</h1>
            </div>

            <div th:if="${successMessage}" style="color: green; text-align: center; margin-bottom: 10px">
                <span th:text="${successMessage}"></span>
            </div>
            <div th:if="${errorMessage}" style="color: red; text-align: center; margin-bottom: 10px">
                <span th:text="${errorMessage}"></span>
            </div>

            <div class="filter-area">
                <button type="button" class="edit-btn" onclick="toggleEditMode()">
                    編集
                </button>
            </div>

            <div class="error-message-area">
                <span id="errorMsgRequired" class="error-text" style="display: none">※教室名は必須入力です。</span>
                <span id="errorMsgDuplicate" class="error-text" style="display: none">※入力された教室名は既に使用されています。</span>
            </div>

            <div class="table-wrapper">
                <table class="classroom-table" id="classroomTable">
                    <colgroup>
                        <col style="width: 40%" />
                        <col style="width: 50%" />
                        <col style="width: 10%" />
                    </colgroup>
                    <thead>
                        <tr>
                            <th>教室名</th>
                            <th>MACアドレス</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="room : ${classroomList}">
                            <input type="hidden" name="classroomId" th:value="${room.classroomId}" />

                            <td>
                                <span class="view-mode" th:text="${room.classroomName}"></span>
                                <input type="text" class="form-input edit-mode" style="display: none"
                                    name="classroomName" th:value="${room.classroomName}" placeholder="教室名 (例: 201)" />
                            </td>

                            <td>
                                <span class="view-mode" th:text="${room.macAddress}"></span>
                                <input type="text" class="form-input edit-mode" style="display: none" 
                                    name="macAddress" th:value="${room.macAddress}" placeholder="AA:BB:CC:11:22:33" />
                            </td>

                            <td>
                                <button type="button" class="delete-btn" onclick="deleteRow(this)" style="display: none">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="add-btn-wrapper" style="display: none">
                <button type="button" class="add-row-btn" onclick="addClassroomRow()">
                    ＋
                </button>
            </div>
        </div>
    </form>

    <script th:src="@{/js/mdClassroom.js}"></script>
</body>
</html>
