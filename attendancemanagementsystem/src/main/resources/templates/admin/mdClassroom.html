<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教室マスタ</title>
    
    <link rel="stylesheet" th:href="@{/css/parts.css}">
    <link rel="stylesheet" th:href="@{/css/admin/adminMdClassroom.css}">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="header-container">
        <div th:replace="~{fragments/_parts :: header(title='出欠管理システム')}"></div>
    </div>
    
    <div class="backbutton-container">
        <div th:replace="~{fragments/_parts :: backButton(url='/admin/timeTableList2')}"></div>
    </div>
    
    <div class="classroom-container">
        
        <div class="page-header-wrapper">

            <h1 class="page-title">教室マスタ</h1>
        </div>

        <div class="filter-area">
            <button type="button" class="edit-btn" onclick="toggleEditMode()">編集</button>
        </div>

        <div class="error-message-area">
            <span id="errorMsgRequired" class="error-text">※教室情報と教室名の両方を入力してください。</span>
            <span id="errorMsgDuplicate" class="error-text">※入力された教室名は既に使用されています。</span>
        </div>

        <div class="table-wrapper">
            <table class="classroom-table" id="classroomTable">
                <colgroup>
                    <col style="width: 50%;"> 
                    <col style="width: 50%;"> 
                </colgroup>
                <thead>
                    <tr>
                        <th>教室情報</th>
                        <th>教室名</th>
                    </tr>
                </thead>
                <tbody>
                    </tbody>
            </table>
        </div>

        <div class="add-btn-wrapper">
            <button type="button" class="add-row-btn" onclick="addClassroomRow()">＋</button>
        </div>

    </div>

    <script>
        function toggleEditMode() {
            const body = document.body;
            const btn = document.querySelector('.edit-btn');
            const errorMsgReq = document.getElementById('errorMsgRequired');
            const errorMsgDup = document.getElementById('errorMsgDuplicate');
            
            if (body.classList.contains('editing-mode')) {
                const isSuccess = applyAddedRows();

                if (isSuccess) {
                    body.classList.remove('editing-mode');
                    btn.textContent = '編集';
                    errorMsgReq.style.display = 'none';
                    errorMsgDup.style.display = 'none';
                    
                    sortClassroomTable();
                    mergeCells(); 
                }
                
            } else {
                body.classList.add('editing-mode');
                btn.textContent = '適用';
                errorMsgReq.style.display = 'none';
                errorMsgDup.style.display = 'none';
                
                unmergeCells();
            }
        }

        function addClassroomRow() {
            const tableBody = document.querySelector('#classroomTable tbody');
            const newRow = document.createElement('tr');
            
            newRow.classList.add('added-row');
            
            newRow.innerHTML = `
                <td>
                    <select class="form-select" name="floor">
                        <option value="">階を選択</option>
                        <option value="2F">2F</option>
                        <option value="3F">3F</option>
                        <option value="4F">4F</option>
                    </select>
                </td>
                <td>
                    <input type="text" class="form-input" placeholder="教室名 (例: 201)" name="newName">
                </td>
            `;
            
            tableBody.appendChild(newRow);
        }

        function applyAddedRows() {
            const addedRows = document.querySelectorAll('.added-row');
            const tableRows = document.querySelectorAll('#classroomTable tbody tr');
            
            let hasEmptyError = false;
            let hasDuplicateError = false;
            
            document.getElementById('errorMsgRequired').style.display = 'none';
            document.getElementById('errorMsgDuplicate').style.display = 'none';
            document.querySelectorAll('.input-error').forEach(el => el.classList.remove('input-error'));

            let existingNames = [];
            tableRows.forEach(row => {
                if (!row.classList.contains('added-row')) {
                    const input = row.querySelector('input[name="newName"]');
                    const nameCell = row.cells[1]; 
                    const inputInCell = nameCell.querySelector('input');
                    const name = inputInCell ? inputInCell.value : nameCell.innerText;
                    
                    if(name) existingNames.push(name.trim());
                }
            });

            let currentBatchNames = [];

            addedRows.forEach(row => {
                const selectElement = row.querySelector('select[name="floor"]');
                const inputElement = row.querySelector('input[name="newName"]');
                
                const valFloor = selectElement ? selectElement.value : "";
                const valName = inputElement ? inputElement.value.trim() : "";

                if (valFloor === "" && valName === "") return;

                if (valFloor === "" || valName === "") {
                    hasEmptyError = true;
                    if (valFloor === "") selectElement.classList.add('input-error');
                    if (valName === "") inputElement.classList.add('input-error');
                } 
                else {
                    if (existingNames.includes(valName) || currentBatchNames.includes(valName)) {
                        hasDuplicateError = true;
                        inputElement.classList.add('input-error');
                    } else {
                        currentBatchNames.push(valName);
                    }
                }
            });

            if (hasEmptyError) {
                document.getElementById('errorMsgRequired').style.display = 'inline-block';
                return false;
            }
            if (hasDuplicateError) {
                document.getElementById('errorMsgDuplicate').style.display = 'inline-block';
                return false;
            }

            addedRows.forEach(row => {
                const selectElement = row.querySelector('select[name="floor"]');
                const inputElement = row.querySelector('input[name="newName"]');
                
                const valFloor = selectElement ? selectElement.value : "";
                const valName = inputElement ? inputElement.value.trim() : "";

                if (valFloor !== "" && valName !== "") {
                    const newInput = document.createElement('input');
                    newInput.type = 'text';
                    newInput.className = 'form-input'; 
                    newInput.value = valFloor;
                    newInput.name = 'info'; 
                    
                    selectElement.parentNode.replaceChild(newInput, selectElement);
                    row.classList.remove('added-row');
                } else {
                    row.remove();
                }
            });

            return true;
        }

        function sortClassroomTable() {
            const tableBody = document.querySelector('#classroomTable tbody');
            const rows = Array.from(tableBody.querySelectorAll('tr'));

            rows.sort((a, b) => {
                const getVal = (row, cellIndex) => {
                    const cell = row.cells[cellIndex];
                    if(!cell) return "";
                    const input = cell.querySelector('.form-input, .form-select');
                    return input ? input.value : cell.innerText.trim();
                };

                const floorA = getVal(a, 0);
                const floorB = getVal(b, 0);
                if (floorA < floorB) return -1;
                if (floorA > floorB) return 1;

                const nameA = getVal(a, 1);
                const nameB = getVal(b, 1);
                
                const numA = parseInt(nameA.replace(/\D/g, ''));
                const numB = parseInt(nameB.replace(/\D/g, ''));
                
                if (!isNaN(numA) && !isNaN(numB)) {
                    return numA - numB;
                } else {
                    return nameA < nameB ? -1 : 1;
                }
            });

            rows.forEach(row => tableBody.appendChild(row));
        }

        function mergeCells() {
            const tableBody = document.querySelector('#classroomTable tbody');
            const rows = tableBody.querySelectorAll('tr');
            if (rows.length === 0) return;

            let prevRow = null;
            let rowspanCount = 1;

            for (let i = 0; i < rows.length; i++) {
                const row = rows[i];
                if (row.classList.contains('added-row')) continue;

                const cell = row.cells[0]; 
                const input = cell.querySelector('.form-input');
                const val = input ? input.value : cell.innerText.trim();

                if (prevRow) {
                    const prevCell = prevRow.cells[0];
                    const prevInput = prevCell.querySelector('.form-input');
                    const prevVal = prevInput ? prevInput.value : prevCell.innerText.trim();

                    if (val === prevVal) {
                        rowspanCount++;
                        prevCell.rowSpan = rowspanCount;
                        cell.style.display = 'none'; 
                    } else {
                        prevRow = row;
                        rowspanCount = 1;
                        cell.style.display = ''; 
                        cell.rowSpan = 1;
                    }
                } else {
                    prevRow = row;
                    rowspanCount = 1;
                    cell.style.display = '';
                    cell.rowSpan = 1;
                }
            }
        }

        function unmergeCells() {
            const tableBody = document.querySelector('#classroomTable tbody');
            const rows = tableBody.querySelectorAll('tr');

            rows.forEach(row => {
                const cell = row.cells[0];
                if (cell) {
                    cell.style.display = ''; 
                    cell.rowSpan = 1;        
                }
            });
        }
        
        window.addEventListener('load', () => {
            sortClassroomTable();
            mergeCells();
        });
    </script>

</body>
</html>
