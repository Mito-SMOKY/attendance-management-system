<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>手動登録</title>
    <style>
      /* 既存のスタイル */
      body {
        padding: 20px;
        font-family: sans-serif;
        max-width: 800px;
        margin: 0 auto;
      }
      .input-group {
        margin-bottom: 15px;
        border: 1px solid #eee;
        padding: 15px;
        border-radius: 5px;
        background-color: #f9f9f9;
      }
      .input-row {
        display: flex;
        gap: 15px;
        margin-bottom: 10px;
        align-items: center;
      }
      label {
        font-weight: bold;
        width: 120px;
      } /* 少し幅を広げました */
      input,
      select {
        padding: 5px;
        width: 200px;
      }
      .btn {
        padding: 10px 20px;
        color: white;
        border: none;
        cursor: pointer;
        border-radius: 4px;
        margin-right: 10px;
      }
      .btn-add {
        background-color: #17a2b8;
      }
      .btn-remove {
        background-color: #dc3545;
      }
      .btn-save {
        background-color: #28a745;
        font-size: 16px;
        margin-top: 20px;
      }

      .batch-setting {
        background-color: #e9ecef;
        padding: 15px;
        border-radius: 5px;
        margin-bottom: 20px;
        border-left: 5px solid #007bff;
      }
    </style>
  </head>
  <body>
    <h1>手動でのアカウント登録</h1>
    <p>登録したい学生の情報を入力してください。</p>

    <form th:action="@{/admin/save-manual-accounts}" method="post">
      <div class="batch-setting">
        <h3>基本設定（全員に適用）</h3>
        <div class="input-row">
          <label>リスト名:</label>
          <input
            type="text"
            name="dataListName"
            placeholder="例: 2025年度新入生"
            required
          />
        </div>

        <div class="input-row">
          <label>年度:</label>
          <input
            type="number"
            name="academicYear"
            placeholder="2025"
            value="2025"
            required
          />
        </div>

        <div class="input-row">
          <label>学年:</label>
          <select name="grade">
            <option value="1">1年</option>
            <option value="2">2年</option>
            <option value="3">3年</option>
          </select>
        </div>

        <div class="input-row">
          <label>学科・クラス:</label>
          <select name="departmentId">
            <option
              th:each="dept : ${departmentList}"
              th:value="${dept.departmentId}"
              th:text="${(dept.major != null ? dept.major.majorName : '(学科不明)') + ' : ' + dept.className}"
            >
              情報システム学科 : Aクラス
            </option>
          </select>
        </div>
      </div>

      <div id="account-container">
        <div class="input-group">
          <h3>No.1</h3>
          <div class="input-row">
            <label>ログインID</label>
            <input
              type="text"
              name="accounts[0].studentNumber"
              placeholder="ST001"
              required
            />
          </div>
          <div class="input-row">
            <label>氏名</label>
            <input
              type="text"
              name="accounts[0].name"
              placeholder="山田 太郎"
              required
            />
          </div>
          <div class="input-row">
            <label>パスワード</label>
            <input
              type="text"
              name="accounts[0].password"
              placeholder="初期パスワード"
              required
            />
          </div>
        </div>
      </div>

      <button type="button" class="btn btn-add" onclick="addAccount()">
        ＋ 枠を追加
      </button>
      <button type="button" class="btn btn-remove" onclick="removeAccount()">
        － 最後の枠を削除
      </button>

      <br /><br />
      <button type="submit" class="btn btn-save">登録実行</button>
    </form>

    <br />
    <a th:href="@{/admin/tmpAccount}">メニューに戻る</a>

    <script>
      function addAccount() {
        const container = document.getElementById("account-container");
        const count = container.children.length; // 現在の要素数

        // 新しい入力グループを作成
        const newGroup = document.createElement("div");
        newGroup.className = "input-group";
        newGroup.innerHTML = `
                <h3>No.${count + 1}</h3>
                <div class="input-row">
                    <label>ログインID</label>
                    <input type="text" name="accounts[${count}].studentNumber" required>
                </div>
                <div class="input-row">
                    <label>氏名</label>
                    <input type="text" name="accounts[${count}].name" required>
                </div>
                <div class="input-row">
                    <label>パスワード</label>
                    <input type="text" name="accounts[${count}].password" required>
                </div>
            `;

        container.appendChild(newGroup);
      }

      function removeAccount() {
        const container = document.getElementById("account-container");
        if (container.children.length > 1) {
          container.removeChild(container.lastElementChild);
        } else {
          alert("これ以上削除できません");
        }
      }
    </script>
  </body>
</html>
