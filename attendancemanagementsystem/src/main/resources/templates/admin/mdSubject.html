<!DOCTYPE html>

<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>教科マスタ</title>

    <link rel="stylesheet" th:href="@{/css/parts.css}" />
    <link rel="stylesheet" th:href="@{/css/admin/adminMdSubject.css}" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="header-container">
      <div
        th:replace="~{fragments/_parts :: header(title='出欠管理システム')}"
      ></div>
    </div>

    <div class="backbutton-container">
      <div
        th:replace="~{fragments/_parts :: backButton(url='/admin/master-data')}"
      ></div>
    </div>

    <div class="subject-master-container">
      <div class="page-header-wrapper">
        <h1 class="page-title">教科マスタ</h1>
      </div>

      <div
        th:if="${successMessage}"
        style="color: green; text-align: center; margin-bottom: 10px"
      >
        <span th:text="${successMessage}"></span>
      </div>
      <div
        th:if="${errorMessage}"
        style="color: red; text-align: center; margin-bottom: 10px"
      >
        <span th:text="${errorMessage}"></span>
      </div>

      <form
        th:action="@{/admin/master/subject/save}"
        method="post"
        id="matrixForm"
      >
        <div class="controls-area">
          <div class="search-group">
            <input
              type="text"
              class="search-input"
              id="searchInput"
              placeholder="教科名を検索"
            />
            <button
              type="button"
              class="search-btn"
              id="searchBtn"
              onclick="filterRows()"
            >
              検索 <i class="fa-solid fa-magnifying-glass"></i>
            </button>
          </div>

          <div class="filter-action-group">
            <div id="gradeForm" style="display: flex; gap: 10px">
              <select
                class="grade-filter"
                id="gradeFilter"
                onchange="filterRows()"
              >
                <option value="">全学年</option>
                <option value="1">1年生</option>
                <option value="2">2年生</option>
                <option value="3">3年生</option>
              </select>
              <select class="department-filter" id="departmentFilter">
                <option value="">学科を選択</option>
              </select>
            </div>

            <button type="button" class="edit-btn" onclick="toggleEditMode()">
              編集
            </button>
          </div>
        </div>

        <div class="table-wrapper">
          <table class="subject-table" id="subjectTable">
            <colgroup>
              <col style="width: 250px" />
              <col style="width: auto" th:each="dept : ${departmentList}" />
            </colgroup>

            <thead>
              <tr>
                <th>教科</th>
                <th
                  th:each="dept : ${departmentList}"
                  th:text="${dept.className}"
                >
                  クラス名
                </th>
              </tr>
            </thead>

            <tbody>
              <tr
                th:each="detail : ${subjectDetailList}"
                class="data-row"
                th:data-grade="${detail.grade}"
              >
                <td class="col-subject-name">
                  <span
                    class="subject-text"
                    th:text="${detail.subjectName}"
                  ></span>
                  <button
                    type="button"
                    class="delete-btn"
                    onclick="deleteRow(this)"
                  >
                    <i class="fa-solid fa-trash-can"></i>
                  </button>
                </td>

                <td
                  th:each="dept : ${departmentList}"
                  onclick="toggleMark(this)"
                  th:classappend="${detail.statusMap.get(dept.departmentId.toString())} ? 'checked'"
                >
                  <span class="check-mark">○</span>

                  <input
                    type="checkbox"
                    name="activePairs"
                    th:value="${detail.subjectId + '-' + dept.departmentId}"
                    th:checked="${detail.statusMap.get(dept.departmentId.toString())}"
                    style="display: none"
                  />
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </form>
    </div>

    <script>
      function toggleEditMode() {
        const body = document.body;
        const btn = document.querySelector(".edit-btn");
        const form = document.getElementById("matrixForm");

        if (body.classList.contains("editing-mode")) {
          // --- 適用（保存）ボタン押下時 ---
          if (!confirm("現在の状態で保存しますか？")) {
            return;
          }
          // フォーム送信
          form.submit();
        } else {
          // --- 編集ボタン押下時 ---
          body.classList.add("editing-mode");
          btn.textContent = "適用";
        }
      }

      function toggleMark(cell) {
        // 編集モード時のみクリック有効
        if (document.body.classList.contains("editing-mode")) {
          cell.classList.toggle("checked");

          // チェックボックスの同期
          const checkbox = cell.querySelector('input[type="checkbox"]');
          if (checkbox) {
            checkbox.checked = cell.classList.contains("checked");
          }
        }
      }

      function filterRows() {
        const selectedGrade = document.getElementById("gradeFilter").value;
        const keyword = document
          .getElementById("searchInput")
          .value.toLowerCase();
        const rows = document.querySelectorAll(".data-row");

        rows.forEach((row) => {
          const rowGrade = row.getAttribute("data-grade");
          let subjectName = "";
          const textElem = row.querySelector(".subject-text");
          if (textElem) {
            subjectName = textElem.innerText.toLowerCase();
          }

          const isGradeMatch =
            selectedGrade === "" || rowGrade == selectedGrade;
          const isKeywordMatch =
            keyword === "" || subjectName.indexOf(keyword) > -1;

          if (isGradeMatch && isKeywordMatch) {
            row.style.display = "";
          } else {
            row.style.display = "none";
          }
        });
      }

      function deleteRow(btn) {
        if (
          confirm(
            "この行を削除しますか？\n（保存すると、この教科の紐づけは全て解除されます）"
          )
        ) {
          const row = btn.closest("tr");
          // 行内のチェックボックスをすべてOFFにする（念のため）
          const checkboxes = row.querySelectorAll('input[type="checkbox"]');
          checkboxes.forEach((cb) => (cb.checked = false));

          // 行を非表示にする（submit時にチェックボックスが送られないようにDOMから消す）
          row.remove();
        }
      }

      document
        .getElementById("searchInput")
        .addEventListener("keypress", function (e) {
          if (e.key === "Enter") {
            e.preventDefault();
            document.getElementById("searchBtn").click();
          }
        });
    </script>
  </body>
</html>
