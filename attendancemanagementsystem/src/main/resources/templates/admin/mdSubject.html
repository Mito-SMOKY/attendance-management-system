<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>教科マスタ</title>

    <link rel="stylesheet" th:href="@{/css/common/parts.css}" />
    <link rel="stylesheet" th:href="@{/css/md/mdSubject.css}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
</head>
<body>
    <div class="header-container">
        <div th:replace="~{fragments/_parts :: admin-header}"></div>
    </div>

    <div class="backbutton-container">
        <div th:replace="~{fragments/_parts :: backButton(url='/admin/master-data')}"></div>
    </div>

    <div class="subject-master-container">
        <div class="page-header-wrapper">
            <h1 class="page-title">教科マスタ</h1>
        </div>

        <div th:if="${successMessage}" style="color: green; text-align: center; margin-bottom: 10px">
            <span th:text="${successMessage}"></span>
        </div>
        <div th:if="${errorMessage}" style="color: red; text-align: center; margin-bottom: 10px">
            <span th:text="${errorMessage}"></span>
        </div>

        <form th:action="@{/admin/master/subject/save}" method="post" id="matrixForm">
            <div class="controls-area">
                <div class="search-group">
                    <input type="text" class="search-input" id="searchInput" placeholder="教科名を検索" />
                    <button type="button" class="search-btn" id="searchBtn" onclick="filterRows()">
                        検索 <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </div>

                <div class="filter-action-group">
                    <div id="gradeForm" style="display: flex; gap: 10px">
                        <select class="grade-filter" id="gradeFilter" onchange="filterRows()">
                            <option value="">全学年</option>
                            <option value="1">1年生</option>
                            <option value="2">2年生</option>
                            <option value="3">3年生</option>
                        </select>
                        <select class="department-filter" id="departmentFilter">
                            <option value="">学科を選択</option>
                        </select>
                    </div>

                    <button type="button" class="edit-btn" onclick="toggleEditMode()">
                        編集
                    </button>
                </div>
            </div>

            <div class="table-wrapper">
                <table class="subject-table" id="subjectTable">
                    <colgroup>
                        <col style="width: 250px" />
                        <col style="width: auto" th:each="dept : ${departmentList}" />
                    </colgroup>

                    <thead>
                        <tr>
                            <th>教科</th>
                            <th th:each="dept : ${departmentList}" th:text="${dept.className}">
                                クラス名
                            </th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr th:each="detail : ${subjectDetailList}" class="data-row" th:data-grade="${detail.grade}">
                            <td class="col-subject-name">
                                <span class="subject-text" th:text="${detail.subjectName}"></span>
                                <button type="button" class="delete-btn" onclick="deleteRow(this)">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </td>

                            <td th:each="dept : ${departmentList}" onclick="toggleMark(this)"
                                th:classappend="${detail.statusMap.get(dept.departmentId.toString())} ? 'checked'">
                                <span class="check-mark">○</span>

                                <input type="checkbox" name="activePairs"
                                    th:value="${detail.subjectId + '-' + dept.departmentId}"
                                    th:checked="${detail.statusMap.get(dept.departmentId.toString())}"
                                    style="display: none" />
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </form>
    </div>

    <script th:src="@{/js/mdSubject.js}"></script>
</body>
</html>
