<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教科情報</title>
    
    <link rel="stylesheet" th:href="@{/css/common/parts.css}">
    <link rel="stylesheet" th:href="@{/css/subject/subjectAttendance.css}">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="header-container">
        <div th:replace="~{fragments/_parts :: admin-header}"></div>
    </div>
    
    <div class="backbutton-container">
        <div th:replace="~{fragments/_parts :: backButton(url='/subjectList')}"></div>
    </div>


    <div class="subject-info-container">
        
        <div class="page-header-wrapper">
            <h1 class="page-title">教科情報</h1>
        </div>

        <div class="main-content-grid">
            
            <div class="left-panel">
                
                <div class="info-block">
                    <div class="basic-info-header">
                        <button class="edit-btn">編集</button>
                    </div>
                    <table class="detail-table">
                        <tbody>
                            <tr>
                                <th>講座名</th>
                                <td th:text="${subjectName}"></td>
                                <th>年度</th>
                                <td th:text="${year}"></td>
                            </tr>
                            <tr>
                                <th>コース・学年</th>
                                <td th:text="${courseGrade}"></td>
                                <th>教科ID</th>
                                <td th:text="${subjectId}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="info-block">
                    <div class="basic-info-header">
                        </div>
                    <table class="detail-table">
                        <tbody>
                            <tr>
                                <th colspan="2">担当教員</th>
                                <td colspan="2" th:text="${teacherName}"></td>
                            </tr>
                            <tr>
                                <th colspan="2">単位数</th>
                                <td colspan="2" th:text="${credits}"></td>
                            </tr>
                            <tr>
                                <th colspan="2">曜日・コマ</th>
                                <td colspan="2" th:text="${schedule}"></td>
                            </tr>
                            <tr>
                                <th colspan="2">教室</th>
                                <td colspan="2" th:text="${classroom}"></td>
                            </tr>
                            <tr>
                                <th colspan="2">成績評価方法</th>
                                <td colspan="2">
                                    <div class="text-content" th:text="${gradingMethod}"></div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>

            <div class="right-panel">
                <div class="student-list-wrapper">
                    <table class="student-table">
                        <thead>
                            <tr>
                                <th>氏名</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="student : ${studentList}">
                                <td th:text="${student.name}"></td>
                            </tr>
                            
                            <tr th:if="${studentList == null}"><td>&nbsp;</td></tr>
                            <tr th:if="${studentList == null}"><td>&nbsp;</td></tr>
                            <tr th:if="${studentList == null}"><td>&nbsp;</td></tr>
                            <tr th:if="${studentList == null}"><td>&nbsp;</td></tr>
                            <tr th:if="${studentList == null}"><td>&nbsp;</td></tr>
                            <tr th:if="${studentList == null}"><td>&nbsp;</td></tr>
                            <tr th:if="${studentList == null}"><td>&nbsp;</td></tr>
                            <tr th:if="${studentList == null}"><td>&nbsp;</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>

    </div>

</body>
</html>
