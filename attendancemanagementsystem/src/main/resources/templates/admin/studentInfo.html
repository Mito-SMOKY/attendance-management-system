<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生徒情報</title>
    
    <link rel="stylesheet" th:href="@{/css/parts.css}">
    <link rel="stylesheet" th:href="@{/css/adminStudentInfo.css}">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="header-container">
        <div th:replace="~{fragments/_parts :: header(title='出欠管理システム')}"></div>
    </div>
    
    
    <div class="backbutton-container">
        <div th:replace="~{fragments/_parts :: backButton(url='/login')}"></div>
    </div>

    <div class="info-container">
        
        <h1 class="page-title">生徒情報</h1>

        <div class="controls-area">
            <a href="#" class="backbutton">戻る</a>
            
            <button class="edit-btn">編集</button>
        </div>

        <div class="basic-info-section">
            
            <div class="profile-block">
                <div class="profile-image-placeholder">
                    <i class="fa-solid fa-user"></i>
                </div>
                <table class="name-table">
                    <tr>
                        <th>学籍番号</th>
                        <td>2400001</td>
                    </tr>
                    <tr>
                        <th>フリガナ</th>
                        <td>アイダ タロウ</td>
                    </tr>
                    <tr>
                        <th>氏名</th>
                        <td>相田 太郎</td>
                    </tr>
                </table>
            </div>

            <div class="academic-block">
                <table class="academic-table">
                    <tr>
                        <th>学科</th>
                        <td>情報処理科</td>
                    </tr>
                    <tr>
                        <th>コース</th>
                        <td>情報処理コース</td>
                    </tr>
                    <tr>
                        <th>学年</th>
                        <td>2年</td>
                    </tr>
                    <tr>
                        <th>クラス</th>
                        <td>AA</td>
                    </tr>
                </table>
            </div>
        </div>

        <div class="attendance-section">
            <div class="section-title">出席情報</div>
            
            <div class="table-wrapper">
                <table class="attendance-table">
                    <colgroup>
                        <col style="width: 20%;"> <col style="width: 15%;"> <col style="width: 40%;"> <col style="width: 25%;"> </colgroup>
                    <thead>
                        <tr>
                            <th>日付</th>
                            <th>時限</th>
                            <th>教科名</th>
                            <th>出欠状況</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>2024/11/14</td>
                            <td>1</td>
                            <td>LINUX基礎</td>
                            <td class="status-present">出席</td>
                        </tr>
                        <tr>
                            <td>2024/11/14</td>
                            <td>2</td>
                            <td>Python実習</td>
                            <td class="status-present">出席</td>
                        </tr>
                        <tr>
                            <td>2024/11/14</td>
                            <td>3</td>
                            <td>システム構築</td>
                            <td class="status-absent">欠席</td>
                        </tr>
                        <tr>
                            <td>2024/11/14</td>
                            <td>4</td>
                            <td>システム構築</td>
                            <td class="status-late">遅刻</td>
                        </tr>
                        <tr>
                            <td>2024/11/15</td>
                            <td>1</td>
                            <td>HR</td>
                            <td class="status-present">出席</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

</body>
</html>
