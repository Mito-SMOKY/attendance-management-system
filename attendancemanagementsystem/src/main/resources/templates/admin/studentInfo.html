<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生徒情報</title>
    
    <link rel="stylesheet" th:href="@{/css/parts.css}">
    <link rel="stylesheet" th:href="@{/css/admin/studentInfo.css}">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="header-container">
        <div th:replace="~{fragments/_parts :: admin-header}"></div>
    </div>
    
    <div class="backbutton-container">
        <div th:replace="~{fragments/_parts :: backButton(url='/admin/studentList')}"></div>
    </div> 

    <div class="info-container">
        
        <div class="page-header-wrapper">
            <h1 class="page-title">生徒情報</h1>
        </div>

        <div class="main-content-area">
            
            <div class="left-sidebar-area">
                
                <div class="student-name-display">
                    <span th:text="${studentInfo.name}">○○ ××</span> さん
                    </div>

                <form class="sidebar-search-form" onsubmit="return false;">
                    <input type="text" id="subjectSearchInput" class="sidebar-search-input" placeholder="教科名を検索" onkeyup="filterSubjects()">
                    <button type="button" class="sidebar-search-btn">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </form>

                <div class="subject-list-box">
                    <div class="sidebar-title">受講教科一覧</div>
                    <ul class="subject-list" id="subjectListUl">
                        <li th:each="subject : ${studentInfo.subjectList}" class="subject-item">
                            <a href="#" th:text="${subject.subjectName}">教科名</a>
                        </li>
                    </ul>
                </div>
            </div>

            <div class="attendance-detail-main">
                
                <div class="attendance-controls">
                    <form id="monthForm">
                        <input type="month" id="monthPicker" name="month" 
                               class="month-select" 
                               th:value="${targetMonth}" 
                               onchange="changeMonth(this.value)">
                    </form>
                    
                    <button class="edit-btn" type="button" onclick="alert('編集機能は開発中です')">編集</button>
                </div>

                <table class="status-summary-table">
                    <thead>
                        <tr>
                            <th>出欠状況</th>
                            <th>出席</th>
                            <th>欠席</th>
                            <th>遅刻</th>
                            <th>早退</th>
                            <th>出停</th>
                            <th>公欠</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>日数</td>
                            <td th:text="${studentInfo.summary.attendanceCount} + '日'">0日</td>
                            <td th:text="${studentInfo.summary.absenceCount} + '日'" style="color: #EF5350;">0日</td>
                            <td th:text="${studentInfo.summary.lateCount} + '日'">0日</td>
                            <td th:text="${studentInfo.summary.earlyLeaveCount} + '日'">0日</td>
                            <td th:text="${studentInfo.summary.suspensionCount} + '日'">0日</td>
                            <td th:text="${studentInfo.summary.publicAbsenceCount} + '日'">0日</td>
                        </tr>
                    </tbody>
                </table>

                <div class="table-wrapper">
                    <table class="schedule-table student-table">
                        <colgroup>
                            <col style="width: 15%;"> 
                        </colgroup>
                        <thead>
                            <tr>
                                <th>日付</th>
                                <th th:each="header : ${studentInfo.periodHeaders}" th:text="${header}">1限目</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="day : ${studentInfo.scheduleList}">
                                <td th:text="${day.dateStr}">1/1(月)</td>
                                <td th:each="period : ${day.periods}">
                                    <div th:if="${period.hasClass}" 
                                        class="cell-content"
                                        th:classappend="${period.statusClass}">
                                        
                                        <span class="subject-name" th:text="${period.subjectName}">教科名</span>
                                        
                                        <span class="status-tag" th:text="${period.statusIcon}">
                                            〇
                                        </span>
                                    </div>
    
    <div th:unless="${period.hasClass}" class="cell-content" style="color: #ccc;">
        -
    </div>
</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        /*<![CDATA[*/
        // URLパスから現在のIDを取得するロジックに変更
        // (th:inline で studentId を埋め込むと null の場合にエラーになることがあるため)
        function getCurrentStudentId() {
            const pathParts = window.location.pathname.split('/');
            return pathParts[pathParts.length - 1]; // URLの最後の部分をIDとする
        }

        // 月変更処理
        function changeMonth(newMonthVal) {
            if (!newMonthVal) return;
            const studentId = getCurrentStudentId();
            // 遷移先URLを作成
            window.location.href = `/admin/student/info/${studentId}?month=${newMonthVal}`;
        }

        // 左サイドバーの教科検索フィルタ
        function filterSubjects() {
            const input = document.getElementById('subjectSearchInput');
            const filter = input.value.toUpperCase();
            const ul = document.getElementById("subjectListUl");
            const li = ul.getElementsByTagName('li');

            for (let i = 0; i < li.length; i++) {
                const a = li[i].getElementsByTagName("a")[0];
                const txtValue = a.textContent || a.innerText;
                if (txtValue.toUpperCase().indexOf(filter) > -1) {
                    li[i].style.display = "";
                } else {
                    li[i].style.display = "none";
                }
            }
        }
        /*]]>*/
    </script>
</body>
</html>
