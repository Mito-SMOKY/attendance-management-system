<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>仮アカウント一覧</title>
    <link rel="stylesheet" th:href="@{/css/parts.css}">
    <link rel="stylesheet" th:href="@{/css/createAccount/tempAccountList.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  </head>
  <body>
    <div class="header-container">
      <div th:if="${#authorization.expr('hasRole(''ADMIN'')')}">
        <div th:replace="~{fragments/_parts :: admin-header}"></div>
      </div>
      <div th:if="${#authorization.expr('hasRole(''SUPER_ADMIN'')')}">
        <div th:replace="~{fragments/_parts :: superadmin-header}"></div>
      </div>
    </div>
  
    <div class="backbutton-container">
      <div th:replace="~{fragments/_parts :: backButton(url=${backUrl})}"></div>
    </div>
    
    <h1>仮アカウント一覧</h1>

    <div th:if="${successMessage}" class="success-message">
        <i class="fas fa-check-circle"></i>
        <span th:text="${successMessage}"></span>
    </div>

    <div class="info-box">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div>
            <p>
                <strong>リストID:</strong>
                <span th:text="${datalist.dataListId}"></span>
            </p>
            <p>
                <strong>リスト名:</strong>
                <span th:text="${datalist.dataListName}"></span>
            </p>
            <p>
                <strong>作成者:</strong>
                <span th:text="${datalist.creatorUser != null ? datalist.creatorUser.name : '不明'}"></span>
                (<span th:text="${datalist.creatorUser != null ? datalist.creatorUser.loginId : '-'}"></span>)
            </p>
            <p>
                <strong>作成日時:</strong> <span th:text="${datalist.createdAt}"></span>
            </p>
        </div>

        <div>
            <a th:href="@{/admin/downloadCsv/{id}(id=${datalist.dataListId})}" class="btn btn-download">
                <i class="fas fa-file-csv"></i> CSVダウンロード
            </a>
        </div>
      </div>
    </div>

    <h3>登録メンバー一覧（保存履歴）</h3>
    <table>
      <thead>
        <tr>
          <th style="width: 50px">No.</th>
          <th>ログインID</th>
          <th>氏名</th>
          <th>年度</th>
          <th>学年</th>
          <th>学科</th>
          <th>クラス</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="detail, stat : ${details}">
          <td th:text="${stat.count}">1</td>
          <td th:text="${detail.loginId}">ST001</td>
          <td th:text="${detail.name}">山田 太郎</td>
          <td th:text="${detail.academicYear}">2025</td>
          <td th:text="${detail.grade} + '年'">1年</td>
          <td th:text="${detail.majorName}">情報システム学科</td>
          <td th:text="${detail.className}">Aクラス</td>
        </tr>
      </tbody>
    </table>

    <br /><br />
    <a th:href="@{/admin/accountHome}" class="btn">← topに戻る</a>

    <script th:src="@{/js/createAccount/tempAccountList.js}"></script>
  </body>
</html>
