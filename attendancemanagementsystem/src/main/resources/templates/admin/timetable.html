<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者用時間割</title>
    
    <link rel="stylesheet" th:href="@{/css/parts.css}">
    <link rel="stylesheet" th:href="@{/css/timeTable.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="header-container">
        <div th:replace="~{fragments/_parts :: admin-header}"></div>
    </div>

    <label class="selectbox-3">
        <select id="adminUserSelect">
            <option th:each="user : ${adminUsers}"
                    th:value="${user.loginId}"
                    th:text="${user.name}"
                    th:selected="${user.loginId == initialUserId}">
            </option>
        </select>
    </label>

    <script th:src="@{/js/admin/timetable.js}" defer></script>
    
    <div class="timetable-container" id="timetableContainer"
        th:data-week-start="${weekStart}"
        th:data-initial-date="${initialDate}"
        th:data-initial-user-id="${initialUserId}">
        
        <div class="timetable-header">
            
            <div class="month-year-selector">
                <select id="yearSelector"></select>
                <select id="monthSelector"></select>
            </div>

            <div class="week-navigation">
                <button id="prevWeekBtn" class="nav-arrow"><</button>
                <span id="currentWeekDisplay" class="week-info"></span>
                <button id="nextWeekBtn" class="nav-arrow">></button>
            </div>
            
            <div class="tooltip-005">
                <a href="/admin/main_calendar">
                    <img th:src="@{/image/calendar.png}" alt="アイコン" style="width: 40px; height: 40px; vertical-align: middle;">
                </a>
                <p>カレンダーへ</p>
            </div>
        </div>

        <div class="timetable-wrapper">
            <table id="weeklyTimetable" class="timetable">
                <thead>
                    <tr>
                        <th class="time-slot-header">時間</th>
                        </tr>
                </thead>
                <tbody id="timetableBody">
                    </tbody>
            </table>
        </div>
    </div>
</body>
</html>
